<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/src/styles/tokens.css">
<style>
 body{margin:0;font-family:system-ui,"Noto Sans SC",sans-serif;background:var(--surface-0);color:var(--ink-primary)}
 .pane{padding:20px 24px}
 h2{font-size:15px;margin:0 0 4px} h3{font-size:12px;margin:16px 0 6px;color:var(--ink-secondary);font-weight:500}
 .row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
 .sw{width:132px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-1)}
 .sw .cap{height:44px} .sw .lb{padding:4px 6px;font-size:10px;line-height:1.35;color:var(--ink-secondary)}
 .sw .lb b{display:block;color:var(--ink-primary);font-size:10px}
 .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid;padding:2px 9px;font-size:12px;font-weight:500}
 .meter{height:6px;border-radius:999px;overflow:hidden;width:150px}
 .meter i{display:block;height:100%;width:62%;border-radius:0 4px 4px 0}
 .card{border:1px solid var(--line);background:var(--surface-1);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-secondary)}
 .mut{color:var(--ink-muted)} .btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:6px 12px;font-size:13px}
 table{border-collapse:collapse;font-size:11px} td{padding:2px 8px 2px 0;color:var(--ink-secondary)} td b{color:var(--ink-primary)}
</style></head><body>
<div class="pane" id="p">
 <h2>OpenMemo 配色体系 · <span id="mode"></span></h2>
 <h3>表面层级 / 中性阶</h3><div class="row" id="neutral"></div>
 <h3>主色 · 四层（块面 / 文字 / 淡底 / 轨道）</h3><div class="row" id="brand"></div>
 <h3>语义色 × 五档 —— 锚点 / ink 文字 / tint 淡底 / line 描边</h3><div class="row" id="status"></div>
 <h3>落到组件：芯片（soft）· 进度条 · 卡片</h3>
 <div class="row" id="live" style="align-items:center"></div>
</div>
<script type="module">
const S=['good','warning','serious','critical','info'];
const NAMES={good:'good 就绪/完成',warning:'warning 要你处理',serious:'serious 会变差',critical:'critical 坏了',info:'info 正在发生'};
const cs=getComputedStyle(document.documentElement);
const v=n=>cs.getPropertyValue(n).trim();
document.getElementById('mode').textContent=document.documentElement.dataset.theme==='dark'?'暗档 dark':'明档 light';
const sw=(name,val,note='')=>`<div class="sw"><div class="cap" style="background:${val}"></div><div class="lb"><b>${name}</b>${val}${note?'<br>'+note:''}</div></div>`;
document.getElementById('neutral').innerHTML=['--surface-0','--surface-1','--surface-2','--line','--ink-muted','--ink-secondary','--ink-primary'].map(n=>sw(n.slice(2),v(n))).join('');
document.getElementById('brand').innerHTML=['--accent','--accent-ink','--info-tint','--accent-track'].map(n=>sw(n.slice(2),v(n.replace('--info-tint','--status-info-tint')))).join('');
document.getElementById('status').innerHTML=S.flatMap(s=>[
  sw(s,v('--status-'+s),'锚点'),sw(s+'-ink',v(`--status-${s}-ink`),'文字 ≥4.5:1'),
  sw(s+'-tint',v(`--status-${s}-tint`),'淡底'),sw(s+'-line',v(`--status-${s}-line`),'描边 ≥3:1')]).join('');
document.getElementById('live').innerHTML=
  S.map(s=>`<span class="chip" style="background:${v('--status-'+s+'-tint')};border-color:${v('--status-'+s+'-line')}88;color:${v('--status-'+s+'-ink')}">● ${NAMES[s].split(' ')[1]}</span>`).join('')
  +S.map(s=>`<span class="meter" style="background:${v('--status-'+s+'-tint')}"><i style="background:${v('--status-'+s+'-ink')}"></i></span>`).join('')
  +`<div class="card">卡片正文 <span class="mut">弱化说明文字</span></div><button class="btn">主按钮</button>`;
</script></body></html>
