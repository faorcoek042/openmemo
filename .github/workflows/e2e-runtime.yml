# 端到端验收：章程要求 **2.1 / 2.2**（运行时组件 + 模型 + 数据目录，全部走网页）
#
# ── 这条腿为什么存在 ────────────────────────────────────────────────────────────────
#
# 用户 2026-08-08 下载 v0.2.0 预编译包在真机上用，Windows 双击报错、macOS 被拦、
# 界面打不开。他的原话：
#
#   「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 在这之前 CI 验的是「产品能不能被脚本驱动着转出一段文本」（cold-start-audit）。
# 那条判据是对的，但它**不覆盖用户在网页上点的那些动作** ——
# 装后端、切后端、卸载、下模型、换模型、删模型、搬数据目录。
# 章程 2.1 / 2.2 是用户点名的硬要求，而它们此前**一次都没有在 CI 上被端到端跑过**。
#
# ── 判据（四条，缺一条这盏灯就不算数）────────────────────────────────────────────
#
#   ① **用预编译包**，解释器是**包自带的 Node**。用户机器上没有 node，
#      "没有 node 也能用"正是这个包存在的理由。`--require-bundle` 保证
#      拿不到包时**当场红**，而不是静默回退到源码树 —— 那样绿灯证明的是仓库，
#      不是用户下载的那个东西。
#   ② **只走 HTTP**，不 import 产品的任何函数。判据必须和用户点出来的那条路逐字相同。
#   ③ **屏蔽宿主 PATH**，并把"借了几个"报出来。借了就是失败。
#   ④ **每条关键断言都有对应的变异证明它会红**（下面的 mutations job）。
#      本仓刚栽过两次假绿灯，"断言写了"和"断言有用"不是一回事。
#
# ── 安全边界（PROTOCOL §9 / §9-bis）────────────────────────────────────────────────
#
# 这条腿里有一整段是**搬数据目录** —— 它最有资格重演 T-142 那场
# 「用户的 key / 模型 / 转写记录在界面上全部消失」的事故。脚本里做了三层：
# `OPENMEMO_POINTER_FILE` 重定向（模块级，窗口为零）、假 HOME/XDG/APPDATA 兜底、
# 跑完核对真实机器指针的 sha256+mtime。第三层是断言 `A-POINTER-UNTOUCHED`，
# 它红了整条腿就红。

name: e2e-runtime

on:
  workflow_dispatch:
    inputs:
      bundleSource:
        # ★ 默认对**本次 checkout 组装的包**跑 —— 与 e2e-notes 同一个判据。
        #
        #   `[CI 实测 run 31249873183]` 拿 artifact 跑时踩到两件事，都是同一个成因
        #   「**包和脚本来自不同的提交**」：
        #     · 变异锚点在旧包里找不到（`M-active-partial-load` 锚的是本轮刚落地的修复）；
        #     · 断言守的性质旧包里还没有，红得没有意义。
        #   门禁要回答的是"**现在这棵树**交付出去能不能用"，所以默认 checkout。
        #   `artifact` 模式留着，用来审计**已经发出去的那个包**（那是另一个问题）。
        description: '包从哪来：checkout=本次代码现组装（默认）／artifact=取 build-bundles 的产物'
        required: false
        default: checkout
        type: choice
        options: [checkout, artifact]
      bundlesRunId:
        description: 'artifact 模式下取哪一次 build-bundles 的产物（留空 = 自动找含本平台产物的最近一次）'
        required: false
        type: string
      resumeTest:
        # 断点续传要真的把一个下到一半的大包（100+ MB）打断再续上。
        # 只在 Linux 那条腿开：另外两条腿开它只是把同一个答案再买一遍，
        # 而带宽和时间是三条腿共享的。
        description: '在 Linux 腿上跑断点续传（要多下 100+ MB）'
        required: false
        default: true
        type: boolean
      mutations:
        description: '跑变异验证（证明断言真的会红）'
        required: false
        default: true
        type: boolean

# 只读。这条腿不建 release、不推 commit、不碰任何共享状态。
permissions:
  contents: read
  # 跨 workflow 取 artifact 需要它（build-bundles 的产物不在本次 run 里）。
  actions: read

concurrency:
  group: e2e-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: 要求 2.1/2.2 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    # fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。
    # 这条腿存在的全部意义就是"三个平台各自到底怎么样"。
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ runner 版本**照抄 cold-start-audit.yml / build-bundles.yml 现用的那一组**。
          #    macOS 那格今天是 `macos-26`，不是 `macos-14`：darwin 包就是在 macos-26 上
          #    组装并做部署目标守卫的，换一个 OS 版本来验，验的就不是同一件事了。
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
            }
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
            }
          - { runner: windows-2025, label: win32-x64, target: win-x64, artifact: bundle-win-x64 }
    steps:
      # submodules **不需要**：这条腿一个音频样本都不用（转写的可行性证明归
      # cold-start-audit）。少 checkout 一棵 whisper.cpp 省好几分钟。
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 在装任何东西之前记录 runner 自带什么。
      #   它是"我们装上了"与"它本来就在"的唯一分界线 —— 脚本里的屏蔽这一步
      #   只让借用**可见**，可见之后还得有个基线才说得清借的是什么。
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      # ── 取预编译包 ────────────────────────────────────────────────────────────
      #
      # build-bundles 是 workflow_dispatch 的，产物不在本次 run 里，所以要跨 run 取。
      # 挑哪一次的判据在 `scripts/ci/resolve-bundle-run.sh` 里（**只有一份**，
      # audit 与 mutations 两个 job 调的是同一个脚本 —— 这里原本是抄了两份的
      # shell，`[实测 run 31249523201]` 我只修了其中一份，另一份就把整条
      # linux 变异腿挂在了 `Artifact not found` 上）。
      # ── 路线 A（默认）：用**本次 checkout** 现组装一个预编译包 ──────────────
      #
      # 它仍然是"预编译包"：同一个 scripts/build-bundle.mjs 组装、包自带的 Node 起、
      # 屏蔽宿主 PATH —— 判据一个字没松。差别只是它来自**这棵树**，
      # 所以变异锚点与断言守的性质必然对得上。
      - name: 装依赖（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile

      # `pnpm -r build` 含 vite build：**CI runner 是一次性的**，PROTOCOL §7 禁的是
      # 共享开发树。缺了 apps/web/dist 的包用户打开是白页，build-bundles 也是这么做的。
      - name: 构建（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: pnpm -r build

      - name: 组装预编译包（现组装模式）
        id: assemble
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: node scripts/build-bundle.mjs --target '${{ matrix.target }}' --skip-archive

      # ── 路线 B：取 build-bundles 的产物（审计已发出去的那个包）──────────────
      - name: 解析 build-bundles 的 run id
        id: runid
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundlesRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: 下载预编译包
        if: ${{ inputs.bundleSource == 'artifact' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: bundle-artifact
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      # 解归档。判据在**解开之后**的那棵树上 —— 归档与解归档之间有它自己的坑
      # （glob 漏掉、tar 排除规则、符号链接没跟随），build-bundles 已经为此
      # 单独立了一步 verify-bundle.sh。
      - name: 解开预编译包 + 验结构（共享脚手架）
        id: bundle
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from bundle-artifact --out extracted \
            --require app/daemon/dist/main.js,runtime/node

      # ── 判据本身 ──────────────────────────────────────────────────────────────
      #
      # `--require-bundle`：拿不到包就当场红。**不许静默回退到源码树** ——
      # 那样这盏绿灯证明的是仓库能跑，而用户手里的是那个包。
      - name: 要求 2.1/2.2 端到端（预编译包 + 屏蔽宿主 PATH + 真 HTTP）
        shell: bash
        timeout-minutes: 45
        run: |
          node scripts/ci/e2e-runtime-audit.mjs \
            --bundle "${{ steps.assemble.outputs.bundle_dir || steps.bundle.outputs.bundle_dir }}" \
            --require-bundle \
            --port 19820 \
            ${{ (matrix.target == 'linux-x64' && inputs.resumeTest) && '--resume-test' || '' }} \
            2>&1 | tee e2e-runtime-${{ matrix.label }}.log

      - name: 留档
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-log-${{ matrix.label }}
          path: e2e-runtime-${{ matrix.label }}.log
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # 变异验证：**证明上面那些断言真的会红**
  # ══════════════════════════════════════════════════════════════════════════════
  #
  # 为什么必须单独有这个 job：本仓刚栽过两次假绿灯（断言的字段在夹具里恒为假、
  # 断言的是"报出来的值"而不是"实际用的值"）。一条**从来没有红过**的断言，
  # 和一条不存在的断言，对用户来说是同一个东西。
  #
  # 每条变异 = 「把某个安全性质拿掉 ⇒ 指定的那条断言必须变红」。
  # 变异跑在**包的独立副本**上（mkdtemp），原包一个字节不动 —— PROTOCOL §10：
  # 「最终状态干净」救不了「过程中别人跑了一次」。
  #
  # ⚠️ 变异 id 的清单**只有一份**，在脚本里（`--list-mutation-ids` 吐出来）。
  #    抄进 YAML 就会有第二份，加了新变异忘了同步的表现是"少跑一条"而不是报错。
  mutations:
    name: 变异验证（${{ matrix.label }}）
    if: ${{ inputs.mutations }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：跑**全部**变异。它们验的是逻辑性质，与平台无关，
          # 在最便宜的 runner 上跑完是最划算的。
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
              only: '',
            }
          # macOS：只跑 `M-driver-lie`。
          # 它的前提是「一个加速包装着、而这次探测没加载它」——
          # 而 Linux/Windows 的 runner 上加速包**装不上**（没有 GPU 硬件证据，
          # 这是正确行为），前提构造不出来，那条断言在那里只能是 UNKNOWN。
          # macOS 上 Metal 是 L1（每台 Mac 都有，无驱动可装），所以那格才验得了。
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
              only: 'M-driver-lie',
            }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ── 路线 A（默认）：用**本次 checkout** 现组装一个预编译包 ──────────────
      #
      # 它仍然是"预编译包"：同一个 scripts/build-bundle.mjs 组装、包自带的 Node 起、
      # 屏蔽宿主 PATH —— 判据一个字没松。差别只是它来自**这棵树**，
      # 所以变异锚点与断言守的性质必然对得上。
      - name: 装依赖（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile

      # `pnpm -r build` 含 vite build：**CI runner 是一次性的**，PROTOCOL §7 禁的是
      # 共享开发树。缺了 apps/web/dist 的包用户打开是白页，build-bundles 也是这么做的。
      - name: 构建（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: pnpm -r build

      - name: 组装预编译包（现组装模式）
        id: assemble
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: node scripts/build-bundle.mjs --target '${{ matrix.target }}' --skip-archive

      # ── 路线 B：取 build-bundles 的产物（审计已发出去的那个包）──────────────
      - name: 解析 build-bundles 的 run id
        id: runid
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundlesRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: 下载预编译包
        if: ${{ inputs.bundleSource == 'artifact' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: bundle-artifact
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      - name: 解开预编译包 + 验结构（共享脚手架）
        id: bundle
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from bundle-artifact --out extracted \
            --require app/daemon/dist/main.js,runtime/node

      # 逐条跑。**一条存活就整步红** —— 存活的意思是"把安全性质拿掉，断言照样绿"，
      # 那条断言此刻等于不存在，修它比修产品更急。
      #
      # 端口每条错开：同一个 runner 上串行跑，但上一发的 daemon 退出有尾巴，
      # 撞端口会表现成"变异让 daemon 起不来"——一个与变异无关的红。
      - name: 逐条变异（每条都必须被抓住）
        shell: bash
        timeout-minutes: 60
        env:
          ONLY: ${{ matrix.only }}
        run: |
          set -uo pipefail
          ids=$(node scripts/ci/e2e-runtime-audit.mjs --list-mutation-ids)
          if [ -n "${ONLY:-}" ]; then ids="$ONLY"; fi
          echo "本轮要跑的变异："; echo "$ids" | sed 's/^/  /'
          port=19840
          rc=0
          survived=""
          for m in $ids; do
            port=$((port+1))
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  变异 $m （port ${port}）"
            echo "════════════════════════════════════════════════════════════════"
            if node scripts/ci/e2e-runtime-audit.mjs \
                 --bundle "${{ steps.assemble.outputs.bundle_dir || steps.bundle.outputs.bundle_dir }}" \
                 --require-bundle --port "$port" --mutate "$m" 2>&1 | tee -a mutations-${{ matrix.label }}.log; then
              echo "  → 抓住了（或本平台构造不出前提，已如实报 UNKNOWN）"
            else
              echo "::error::变异 $m **存活** —— 它对应的断言证明不了任何事"
              survived="$survived $m"
              rc=1
            fi
          done
          echo ""
          if [ $rc -ne 0 ]; then echo "存活的变异：$survived"; else echo "全部变异都被抓住了。"; fi
          exit $rc

      - name: 留档
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-mutations-${{ matrix.label }}
          path: mutations-${{ matrix.label }}.log
          if-no-files-found: warn
