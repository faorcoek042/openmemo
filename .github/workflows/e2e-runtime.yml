# 端到端验收：章程要求 **2.1 / 2.2**（运行时组件 + 模型 + 数据目录，全部走网页）
#
# ── 这条腿为什么存在 ────────────────────────────────────────────────────────────────
#
# 用户 2026-08-08 下载 v0.2.0 预编译包在真机上用，Windows 双击报错、macOS 被拦、
# 界面打不开。他的原话：
#
#   「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 在这之前 CI 验的是「产品能不能被脚本驱动着转出一段文本」（cold-start-audit）。
# 那条判据是对的，但它**不覆盖用户在网页上点的那些动作** ——
# 装后端、切后端、卸载、下模型、换模型、删模型、搬数据目录。
# 章程 2.1 / 2.2 是用户点名的硬要求，而它们此前**一次都没有在 CI 上被端到端跑过**。
#
# ── 判据（四条，缺一条这盏灯就不算数）────────────────────────────────────────────
#
#   ① **用预编译包**，解释器是**包自带的 Node**。用户机器上没有 node，
#      "没有 node 也能用"正是这个包存在的理由。`--require-bundle` 保证
#      拿不到包时**当场红**，而不是静默回退到源码树 —— 那样绿灯证明的是仓库，
#      不是用户下载的那个东西。
#   ② **只走 HTTP**，不 import 产品的任何函数。判据必须和用户点出来的那条路逐字相同。
#   ③ **屏蔽宿主 PATH**，并把"借了几个"报出来。借了就是失败。
#   ④ **每条关键断言都有对应的变异证明它会红**（下面的 mutations job）。
#      本仓刚栽过两次假绿灯，"断言写了"和"断言有用"不是一回事。
#
# ── 安全边界（PROTOCOL §9 / §9-bis）────────────────────────────────────────────────
#
# 这条腿里有一整段是**搬数据目录** —— 它最有资格重演 T-142 那场
# 「用户的 key / 模型 / 转写记录在界面上全部消失」的事故。脚本里做了三层：
# `OPENMEMO_POINTER_FILE` 重定向（模块级，窗口为零）、假 HOME/XDG/APPDATA 兜底、
# 跑完核对真实机器指针的 sha256+mtime。第三层是断言 `A-POINTER-UNTOUCHED`，
# 它红了整条腿就红。

name: e2e-runtime

# ── ⚠️ 读 `inputs.*` 之前先读这一段（#91：`schedule` 下 `default:` 不生效）──────────
#
# **已实测**（scheduled run `31526070085`，2026-08-11 首跑）：`schedule` 触发的运行里
# `github.event_name = 'schedule'`，而 `inputs.mode / modelBudgetMb / legs / bundleRunId`
# **全是空串（len=0）** —— `workflow_dispatch` 的 `default:` **不会**应用到 `schedule`。
# 不用再猜，也不用再验一遍。
#
# 空值下这条腿发生的不是红，是**静默少跑**：`inputs.mutations`（默认 true）为空 ⇒
# 假 ⇒ **整个变异矩阵不跑**，而跳过的 job 在结果列表里和跑过的 job 长得一模一样。
#
# ## 兜底为什么写成 `format('{0}', inputs.X) != 'false'` 而不是 `inputs.X || true`
#
# 因为 GitHub 的 `==` 在两边类型不同时**把两边都转成数字**：`'' → 0`、`false → 0`，
# 于是 **`'' == false` 是 true** —— 空串和"用户显式关掉"在 `==` 下**分不开**。
# 而 `||` 只看真假：`false || true` = `true`，会把**显式的关闭**也覆盖掉。
# 只有比较**字符串渲染**才同时分得开三种情形：
#
#   | `inputs.X`      | `inputs.X \|\| true` | `inputs.X != 'false'` | `format('{0}', inputs.X) != 'false'` |
#   | 空串（schedule）| true ✅              | true ✅               | true ✅                              |
#   | `true`（默认）  | true ✅              | true ✅               | true ✅                              |
#   | `false`（显式） | **true ❌**          | **true ❌**           | false ✅                             |
#
# 这三种写法的判据、以及"空 inputs 的行为必须与 `default:` 的行为逐字相同"这条性质，
# 由 `scripts/ci/selftest-workflow-gates.mjs` **逐点求值比对**（不是读一遍 YAML 说没问题），
# 挂在 `pnpm test:ci-scripts` 上。改动这里而不改那里，会红。
on:
  schedule:
    # 每天 18:15 UTC。⚠️ schedule 只在**默认分支**上触发 —— 这条 cron 在 PR 上验不了，
    # 所以上面那条"空 inputs ≡ default"的性质是**合并前唯一的证据**，见 :selftest。
    # 时刻与 e2e-allcomponents（18:00）错开 15 分钟：不是为了省钱（public 仓 $0），
    # 是别在同一时刻抢 runner 影响别人的 PR 判决。
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      bundleSource:
        # ★ 默认对**本次 checkout 组装的包**跑 —— 与 e2e-notes 同一个判据。
        #
        #   `[CI 实测 run 31249873183]` 拿 artifact 跑时踩到两件事，都是同一个成因
        #   「**包和脚本来自不同的提交**」：
        #     · 变异锚点在旧包里找不到（`M-active-partial-load` 锚的是本轮刚落地的修复）；
        #     · 断言守的性质旧包里还没有，红得没有意义。
        #   门禁要回答的是"**现在这棵树**交付出去能不能用"，所以默认 checkout。
        #   `artifact` 模式留着，用来审计**已经发出去的那个包**（那是另一个问题）。
        description: '包从哪来：checkout=本次代码现组装（默认）／artifact=取 build-bundles 的产物'
        required: false
        default: checkout
        type: choice
        options: [checkout, artifact]
      bundlesRunId:
        description: 'artifact 模式下取哪一次 build-bundles 的产物（留空 = 自动找含本平台产物的最近一次）'
        required: false
        type: string
      resumeTest:
        # 断点续传要真的把一个下到一半的大包（100+ MB）打断再续上。
        # 只在 Linux 那条腿开：另外两条腿开它只是把同一个答案再买一遍，
        # 而带宽和时间是三条腿共享的。
        description: '在 Linux 腿上跑断点续传（要多下 100+ MB）'
        required: false
        default: true
        type: boolean
      mutations:
        description: '跑变异验证（证明断言真的会红）'
        required: false
        default: true
        type: boolean

# 只读。这条腿不建 release、不推 commit、不碰任何共享状态。
permissions:
  contents: read
  # 跨 workflow 取 artifact 需要它（build-bundles 的产物不在本次 run 里）。
  actions: read

concurrency:
  group: e2e-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: 要求 2.1/2.2 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    # 把**实际用到的**那一批包的 run id 抬到 job 级，供下面的 attest 绑定
    # （artifact 模式下 `bundlesRunId` 可以留空自动挑，所以必须取解析后的真值）。
    outputs:
      bundle_run_id: ${{ steps.runid.outputs.id }}
    # fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。
    # 这条腿存在的全部意义就是"三个平台各自到底怎么样"。
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ runner 版本**照抄 cold-start-audit.yml / build-bundles.yml 现用的那一组**。
          #    macOS 那格今天是 `macos-26`，不是 `macos-14`：darwin 包就是在 macos-26 上
          #    组装并做部署目标守卫的，换一个 OS 版本来验，验的就不是同一件事了。
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
            }
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
            }
          - { runner: windows-2025, label: win32-x64, target: win-x64, artifact: bundle-win-x64 }
    steps:
      # ★★ submodules: recursive（Manager 2026-08-11 裁决，#77 六腿预检抓到的红）。
      #
      #   这里原来写的是"submodules 不需要"，理由是"这条腿一个音频样本都不用"——
      #   那句话在 `42fbc41`（这条腿刚建、默认还是 artifact 模式）时是对的：
      #   artifact 模式只下载 build-bundles 的产物，压根不碰 submodule。
      #
      #   `f130abe`（08-08）把默认改成了 checkout（本次代码现组装），这条腿
      #   从此会在本 job 里现跑 `scripts/build-bundle.mjs`；`d087b6e`（08-09）
      #   给它加了一条硬校验——组装出的包必须带 `vendor/whisper.cpp/samples/jfk.wav`，
      #   缺了就不允许降级放行（每一个包用户的自检都会卡在"没有测试音频"）。
      #   这里的 submodule 跳过没跟着这两次改动同步，于是 checkout 模式的默认路径
      #   从 `d087b6e` 落地那一刻起就没法走通——而这条腿只在 workflow_dispatch 上跑，
      #   直到 `[实测 run 31483864964]` 才第一次被看见（坏了两天，零信号）。
      #
      #   **不放宽 `d087b6e` 那条校验**（那是一次有意的加固），改这里的配置：
      #   把 submodule 补上，让前提能被满足。
      #
      #   只需要 `vendor/whisper.cpp`（build-bundle.mjs 只读它的 samples/jfk.wav，
      #   不碰另外三个 submodule），跟 `build-bundles.yml` / `e2e-notes.yml` /
      #   `e2e-import.yml` 一样写 `recursive` 而不是单独只 init 一个：
      #   `.gitmodules` 里四个 submodule 都标了 `shallow = true`，
      #   `[实测 run 31485554473 的 e2e-notes]` 四个（含 libsimple 嵌的 vcpkg）
      #   一起 shallow clone 在 Linux runner 上总共约 15 秒——"省好几分钟"那句
      #   过时了，实测代价并不高；跟三条已有的腿保持同一种写法，比再发明一种
      #   "只 init 一个 submodule" 的新写法更省认知成本。
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 在装任何东西之前记录 runner 自带什么。
      #   它是"我们装上了"与"它本来就在"的唯一分界线 —— 脚本里的屏蔽这一步
      #   只让借用**可见**，可见之后还得有个基线才说得清借的是什么。
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      # ── 取预编译包 ────────────────────────────────────────────────────────────
      #
      # build-bundles 是 workflow_dispatch 的，产物不在本次 run 里，所以要跨 run 取。
      # 挑哪一次的判据在 `scripts/ci/resolve-bundle-run.sh` 里（**只有一份**，
      # audit 与 mutations 两个 job 调的是同一个脚本 —— 这里原本是抄了两份的
      # shell，`[实测 run 31249523201]` 我只修了其中一份，另一份就把整条
      # linux 变异腿挂在了 `Artifact not found` 上）。
      # ── 路线 A（默认）：用**本次 checkout** 现组装一个预编译包 ──────────────
      #
      # 它仍然是"预编译包"：同一个 scripts/build-bundle.mjs 组装、包自带的 Node 起、
      # 屏蔽宿主 PATH —— 判据一个字没松。差别只是它来自**这棵树**，
      # 所以变异锚点与断言守的性质必然对得上。
      - name: 装依赖（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile

      # `pnpm -r build` 含 vite build：**CI runner 是一次性的**，PROTOCOL §7 禁的是
      # 共享开发树。缺了 apps/web/dist 的包用户打开是白页，build-bundles 也是这么做的。
      - name: 构建（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: pnpm -r build

      - name: 组装预编译包（现组装模式）
        id: assemble
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: node scripts/build-bundle.mjs --target '${{ matrix.target }}' --skip-archive

      # ── 路线 B：取 build-bundles 的产物（审计已发出去的那个包）──────────────
      - name: 解析 build-bundles 的 run id
        id: runid
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundlesRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: 下载预编译包
        if: ${{ inputs.bundleSource == 'artifact' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: bundle-artifact
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      # 解归档。判据在**解开之后**的那棵树上 —— 归档与解归档之间有它自己的坑
      # （glob 漏掉、tar 排除规则、符号链接没跟随），build-bundles 已经为此
      # 单独立了一步 verify-bundle.sh。
      - name: 解开预编译包 + 验结构（共享脚手架）
        id: bundle
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from bundle-artifact --out extracted \
            --require app/daemon/dist/main.js --require-node-runtime

      # ── 判据本身 ──────────────────────────────────────────────────────────────
      #
      # `--require-bundle`：拿不到包就当场红。**不许静默回退到源码树** ——
      # 那样这盏绿灯证明的是仓库能跑，而用户手里的是那个包。
      - name: 要求 2.1/2.2 端到端（预编译包 + 屏蔽宿主 PATH + 真 HTTP）
        shell: bash
        timeout-minutes: 45
        run: |
          node scripts/ci/e2e-runtime-audit.mjs \
            --bundle "${{ steps.assemble.outputs.bundle_dir || steps.bundle.outputs.bundle_dir }}" \
            --require-bundle \
            --port 19820 \
            ${{ (matrix.target == 'linux-x64' && format('{0}', inputs.resumeTest) != 'false') && '--resume-test' || '' }} \
            --undecided-out e2e-runtime-undecided-${{ matrix.label }}.json \
            2>&1 | tee e2e-runtime-${{ matrix.label }}.log

      - name: 留档
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-log-${{ matrix.label }}
          path: e2e-runtime-${{ matrix.label }}.log
          if-no-files-found: warn

      # ★ 覆盖面（undecided 计数）单独一份 artifact，供 attest job 跨平台求和后
      # 传给 emit-e2e-attestation.mjs --undecided。与上面的日志留档同形状——
      # 无条件、失败也传（这是展示用的覆盖面统计，不是判定）。
      - name: 留档（覆盖面计数）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-undecided-${{ matrix.label }}
          path: e2e-runtime-undecided-${{ matrix.label }}.json
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # 变异验证：**证明上面那些断言真的会红**
  # ══════════════════════════════════════════════════════════════════════════════
  #
  # 为什么必须单独有这个 job：本仓刚栽过两次假绿灯（断言的字段在夹具里恒为假、
  # 断言的是"报出来的值"而不是"实际用的值"）。一条**从来没有红过**的断言，
  # 和一条不存在的断言，对用户来说是同一个东西。
  #
  # 每条变异 = 「把某个安全性质拿掉 ⇒ 指定的那条断言必须变红」。
  # 变异跑在**包的独立副本**上（mkdtemp），原包一个字节不动 —— PROTOCOL §10：
  # 「最终状态干净」救不了「过程中别人跑了一次」。
  #
  # ⚠️ 变异 id 的清单**只有一份**，在脚本里（`--list-mutation-ids` 吐出来）。
  #    抄进 YAML 就会有第二份，加了新变异忘了同步的表现是"少跑一条"而不是报错。
  mutations:
    name: 变异验证（${{ matrix.label }}）
    # ★ 兜底（#91）：空串（`schedule` 触发）⇒ **跑**，与 `default: true` 一致；
    #   只有**显式**传 `mutations=false` 才不跑。写法理由见文件头那张三行表 ——
    #   `inputs.mutations` 直接当条件用时，空串是假，于是定时跑会**静默少跑**整个矩阵。
    #
    # ⚠️ 这个 job 被跳过时，下面的 `attest` **仍然会发凭证**，但凭证里会写明
    #   `mutations: skipped`。**跳过 ≠ 通过** —— 别把这里的跳过读成"变异过了"。
    if: ${{ format('{0}', inputs.mutations) != 'false' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：跑**全部**变异。它们验的是逻辑性质，与平台无关，
          # 在最便宜的 runner 上跑完是最划算的。
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
              only: '',
            }
          # macOS：只跑 `M-driver-lie`。
          #
          # ⚠️ 🔴 **下面这段理由是假的，而且方向完全反了**（2026-08-17 查清，留档不删）：
          #
          #   > 它的前提是「一个加速包装着、而这次探测没加载它」——
          #   > 而 Linux/Windows 的 runner 上加速包**装不上**（没有 GPU 硬件证据，
          #   > 这是正确行为），前提构造不出来，那条断言在那里只能是 UNKNOWN。
          #   > macOS 上 Metal 是 L1（每台 Mac 都有，无驱动可装），所以那格才验得了。
          #
          # 实测每一句都相反（`[CI 实测 run 31902178980]`，08-10 起每一轮同形）：
          #   · linux 加速包**装得上**（`✔ A-ACCEL-INSTALL whispercpp-vulkan-linux-x64
          #     → succeeded`），前提构造得出来，`M-driver-lie` 在那里**每轮都被抓住**；
          #   · win32 同样构造得出来（`vulkan installed=true probed=false`）；
          #   · **darwin 恰恰是唯一构造不出来的那个**：`metal installed=true probed=true`。
          #
          # darwin 构造不出来的**真实原因**（与 runner 无关，真机也一样）：
          # `libggml-metal.so` 是**随 macOS 核心（cpu）包一起发的**
          # （`vendor/manifests/backends.json` 里 `whispercpp-cpu-macos-arm64.providesFiles`
          # 含它；`scripts/build-whisper.sh` 的 T-146 段刻意如此，并有 `die` 兜底）。
          # 于是无论 `backendDir` 落到哪个包，Metal 的 ggml 模块都在里面 ⇒
          # `metal.probed` 恒为 true ⇒ 「装了但这次没探它」在 darwin 上**结构上不存在**。
          #
          # ⇒ 按裁决保持现状：**这一格在 darwin 上永远是 UNKNOWN，并且现在说得出为什么。**
          #   它的真正证明在 linux/win32（那里每轮都抓得住）。
          # ⚠️ 但由此得到一个如实的现状：**darwin 这一格至今没有证明过任何事**
          #   —— 它只跑这一条，而这一条在那里结构上验不了。要不要给它换一组变异、
          #   或者干脆不跑，是一个覆盖面/机器成本的取舍，**已单独上报，不在这次改动里**。
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
              only: 'M-driver-lie',
            }
    steps:
      # submodules: recursive —— 同一份理由见上面 audit job 的 checkout 步骤：
      # 这个 job 在 bundleSource=checkout（默认）时也会现跑 build-bundle.mjs，
      # 一样要过 jfk.wav 那条硬校验。两个 job 各自独立 checkout，缺一个都还是红。
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ── 路线 A（默认）：用**本次 checkout** 现组装一个预编译包 ──────────────
      #
      # 它仍然是"预编译包"：同一个 scripts/build-bundle.mjs 组装、包自带的 Node 起、
      # 屏蔽宿主 PATH —— 判据一个字没松。差别只是它来自**这棵树**，
      # 所以变异锚点与断言守的性质必然对得上。
      - name: 装依赖（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile

      # `pnpm -r build` 含 vite build：**CI runner 是一次性的**，PROTOCOL §7 禁的是
      # 共享开发树。缺了 apps/web/dist 的包用户打开是白页，build-bundles 也是这么做的。
      - name: 构建（现组装模式）
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: pnpm -r build

      - name: 组装预编译包（现组装模式）
        id: assemble
        if: ${{ inputs.bundleSource != 'artifact' }}
        run: node scripts/build-bundle.mjs --target '${{ matrix.target }}' --skip-archive

      # ── 路线 B：取 build-bundles 的产物（审计已发出去的那个包）──────────────
      - name: 解析 build-bundles 的 run id
        id: runid
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundlesRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: 下载预编译包
        if: ${{ inputs.bundleSource == 'artifact' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: bundle-artifact
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      - name: 解开预编译包 + 验结构（共享脚手架）
        id: bundle
        if: ${{ inputs.bundleSource == 'artifact' }}
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from bundle-artifact --out extracted \
            --require app/daemon/dist/main.js --require-node-runtime

      # 逐条跑。**一条存活就整步红** —— 存活的意思是"把安全性质拿掉，断言照样绿"，
      # 那条断言此刻等于不存在，修它比修产品更急。
      #
      # 端口每条错开：同一个 runner 上串行跑，但上一发的 daemon 退出有尾巴，
      # 撞端口会表现成"变异让 daemon 起不来"——一个与变异无关的红。
      - name: 逐条变异（每条都必须被抓住）
        shell: bash
        timeout-minutes: 60
        env:
          ONLY: ${{ matrix.only }}
        run: |
          set -uo pipefail
          ids=$(node scripts/ci/e2e-runtime-audit.mjs --list-mutation-ids)
          if [ -n "${ONLY:-}" ]; then ids="$ONLY"; fi
          echo "本轮要跑的变异："; echo "$ids" | sed 's/^/  /'
          port=19840
          rc=0
          survived=""
          caught=""
          unverified=""
          for m in $ids; do
            port=$((port+1))
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  变异 $m （port ${port}）"
            echo "════════════════════════════════════════════════════════════════"
            one=0
            node scripts/ci/e2e-runtime-audit.mjs \
              --bundle "${{ steps.assemble.outputs.bundle_dir || steps.bundle.outputs.bundle_dir }}" \
              --require-bundle --port "$port" --mutate "$m" 2>&1 | tee -a mutations-${{ matrix.label }}.log || one=$?
            # ★ 退出码是**三态**的（脚本文件头有表），这里必须照着分三档。
            #   此前这里写的是 `if node …; then 抓住 else 存活 fi` —— 只分两档，
            #   于是 `3 = 跑起来了但什么都没证明` 被并进了"存活"，
            #   报错说"断言证明不了任何事"，而真相是**前提根本没被构造出来**。
            #   （3 这个码是我自己后加的，却没同步改这个消费方 —— 就是这么漏的。）
            case "$one" in
              0)
                echo "  → 抓住了：这条断言确实有牙齿"
                caught="$caught $m"
                ;;
              3)
                # 不算通过，也不算失败 —— 但**绝不许安静地消失**：
                # 注解 + 汇总 + 步骤摘要，三处都写一遍。
                echo "::warning title=变异 $m 未被验证::目标断言在本 runner 上全是 UNKNOWN（前提构造不出来），这条变异这次什么都没证明 —— 既没被抓住，也不代表它存活"
                unverified="$unverified $m"
                ;;
              *)
                echo "::error::变异 $m **存活** —— 它对应的断言证明不了任何事（退出码 $one）"
                survived="$survived $m"
                rc=1
                ;;
            esac
          done
          echo ""
          echo "──────── 本格变异小结 ────────"
          echo "  抓住：${caught:-（无）}"
          echo "  未验证（前提构造不出来，不是存活）：${unverified:-（无）}"
          echo "  存活：${survived:-（无）}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### 变异验证（${{ matrix.label }}）"
              echo ""
              echo "- 抓住：\`${caught:-（无）}\`"
              echo "- **未验证**（前提构造不出来，**不是**存活，也**不是**通过）：\`${unverified:-（无）}\`"
              echo "- 存活：\`${survived:-（无）}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # ★ 把「哪几条什么都没证明」落盘，供 attest 作业写进凭证。
          #   此前它只活在日志与 step summary 里 —— 而凭证那一格只有 ran|skipped，
          #   于是 exit 3 被记成 `ran`（v0.7.3 已知边界第 13 条）。
          #   ⚠️ 无条件写、**存活也写**：这是覆盖面上报，不是判定；
          #      判定由下面的 `exit $rc` 与 attest 的 `if:` 管。
          node -e '
            const fs = require("fs");
            const ids = process.argv[1].split(/\s+/).filter(Boolean);
            fs.writeFileSync(process.argv[2], JSON.stringify({ unverified: ids }, null, 2) + "\n");
          ' "${unverified}" "e2e-runtime-unverified-${{ matrix.label }}.json"
          cat "e2e-runtime-unverified-${{ matrix.label }}.json"
          if [ $rc -ne 0 ]; then echo "存活的变异：$survived"; fi
          exit $rc

      # ★ 覆盖面（哪几条变异什么都没证明）单独一份 artifact。
      # `!cancelled()`：**失败也传** —— 这是覆盖面上报不是判定；而一次变异存活的跑里
      # 「另外那几条有没有被验过」恰恰是最想知道的。
      - name: 留档（未验证的变异）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-unverified-${{ matrix.label }}
          path: e2e-runtime-unverified-${{ matrix.label }}.json
          if-no-files-found: warn

      - name: 留档
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime-mutations-${{ matrix.label }}
          path: mutations-${{ matrix.label }}.log
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发一张「这条腿对着**这一批包**跑绿过」的凭证（契约见 D-17 §11）。
  #
  # 判定落在 artifact **名字** `e2e-attest-runtime-<bundleRunId>` 上，不在文件内容上：
  # 消费方（`release-upload.yml` 的 `e2e-gate`）只问名字在不在。名字里带 bundleRunId，
  # 所以**换一批包就是另一个名字，旧凭证自动失效** —— 在此之前，
  # 「我们跑过 e2e」是一个**没有宾语的句子**，`v0.3.0` 就是这么发出去的。
  #
  # ## 🔴 #102：**一条 failure 的腿发出过一张合格凭证** —— 下面这个 `if:` 是那次的修法
  #
  # `[实测]` e2e-runtime run `31568740737`（v0.7.1 发布过程中撞出来的）：
  #
  #   · 三平台审计 `success`、`变异验证（linux-x64）` **failure**（一条变异存活）；
  #   · run 的 conclusion 是 **failure**；
  #   · 而 `e2e 凭证` 这个 job **success**，`e2e-attest-runtime-31568189189`
  #     **照发了、未过期**（`gh api …/runs/31568740737/artifacts` 可复核）。
  #
  # 成因就是这一行：`needs:` 里**只有 `audit`**，变异 job 不在里面 ⇒
  # 三平台审计全绿 ⇒ attest 照跑照发。上面那句"`needs:` 已经管住了结果"当时是真的，
  # **但它管住的只是它列进去的那些结果** —— 而这条腿的判据④（文件头 :23）
  # 「每条关键断言都有对应的变异证明它会红」根本没被列进去。
  #
  # ⚠️ **今天没出人命，靠的是另一处巧合，不是这道闸**：`verify-e2e-attestation.mjs`
  #    只翻 `conclusion === 'success'` 的 run，而变异红把整条 run 判红了，
  #    所以那张凭证问不到（`[实测]` 拿 `--bundle-run 31568189189 --legs runtime` 跑闸门：
  #    **拒绝发布**）。但**设计要的是"凭证根本不存在"，不是"凭证存在但恰好查不到"**。
  #    而且那层巧合在**变异被跳过**时直接失效：`mutations=false` ⇒ 变异 job `skipped`
  #    ⇒ run conclusion 仍是 **success** ⇒ 凭证发出来**并且会被闸门接受**，
  #    而它对"断言有没有牙齿"一个字都没说。这才是今天真正敞着的那个口。
  #
  # ## 三态：跑了且绿 / 跑了但红 / 被跳过 —— **跳过 ≠ 通过**
  #
  #   | `needs.mutations.result` | 这个 job | 凭证 | 凭证里的 `mutations` 字段 |
  #   | `success`                | 跑       | 发   | `ran`                     |
  #   | `skipped`（mutations=false）| 跑    | 发   | **`skipped`**             |
  #   | `failure` / `cancelled`  | **不跑** | **不存在** | —                   |
  #
  # 「跑了但红」不需要在凭证里表达，因为**那种情况下凭证根本不会存在**；
  # 「被跳过」必须表达，因为凭证存在、而它证明的东西少了一整条判据。
  #
  # ## ⚠️ 这里用了 `!cancelled()`，而上一版注释写着"永远不要用" —— 为什么改口
  #
  # 那句话的**理由**仍然成立：`always()` / `!cancelled()` 会**解除默认的 `success()`**
  # （GitHub 文档原文：`A default status check of success() is applied unless you include
  # one of these functions.`），于是"部分跑"也能发凭证。但**不解除就表达不了三态** ——
  # `skipped` 的 need 在默认语义下会把本 job 一起跳掉，凭证就在 `mutations=false` 时
  # 整个消失，那是另一种坏（发布闸门直接卡死）。
  #
  # 所以规则从"不许用"改成**"用了就必须把每一条 `needs` 的 result 逐条写出来"**：
  #   · `needs.audit.result == 'success'` —— 补回被解除的那半条，一个平台都不能少；
  #   · `needs.mutations.result` 显式白名单 `success | skipped`，**其余一律不发**。
  # 这条"用了状态函数就必须逐条检查 needs"由 `scripts/ci/lint-workflows.mjs` 机械钉住
  # （漏一条 need 就红），三态的真值表由 `scripts/ci/selftest-workflow-gates.mjs`
  # **逐格模拟**（含把这里改回 `needs: [audit]` 时"审计绿+变异红 ⇒ 凭证照发"的历史复现）。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（仅 artifact 模式，三平台审计 + 变异验证都过才发）
    # ★★ `mutations` 必须在这里 —— #102 就是它不在这里。加/删 needs 时，
    #    下面 `if:` 里对应的 `needs.<名字>.result` 那一行**必须同步**（lint 会逼你）。
    needs: [audit, mutations]
    # ★★ 只有 `bundleSource=artifact` 才发凭证。
    #
    #   `checkout` 模式（默认）跑的是**本次代码现组装**的包，那是回归门禁；
    #   它证明不了"某一批已发布的包好"—— 两者不是同一堆字节。
    #   （顺带：这也是 `schedule` 触发时这一格被跳过的原因 —— 空 inputs ⇒
    #    `'' != 'artifact'` ⇒ 落回 checkout，与 `default: checkout` 逐字相同。）
    #
    #   ⚠️ 这条腿的输入叫 `bundlesRunId`（**多一个 s**，与另外三条腿不同）。
    #      名字拼错不会报错，只会让表达式求值成空串，于是凭证名变成
    #      `e2e-attest-runtime-`，消费方永远问不到 —— 那正是"看起来已认证"的假通过。
    #      所以这里绑的是**解析后的 job output**，不是输入本身。
    #
    # ★★ `bundlesRunId != ''`（#91 补，**有意的收紧**）：**没钉批次就不发凭证。**
    #    留空时三个平台各自跑 `resolve-bundle-run.sh` 按 artifact 名解析，可能落到
    #    **不同批**的包上，而凭证名只取 `needs.audit.outputs.bundle_run_id` 一个值
    #    （矩阵 job 的 output 由最后完成的那格写入，无一致性保证）⇒ 那种凭证是伪证。
    #    六条腿现在是同一条规矩（`e2e-allcomponents` 最早立的）。
    #    `[实测]` 发布实际用的就是钉死批次那条命令
    #    （run 31571491809 的日志里是 `resolve-bundle-run.sh 'bundle-linux-x64' '31570874689'`），
    #    所以标准发布路径一个字都不用改。
    if: >-
      ${{ !cancelled()
      && inputs.bundleSource == 'artifact'
      && inputs.bundlesRunId != ''
      && needs.audit.result == 'success'
      && (needs.mutations.result == 'success' || needs.mutations.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # ★ --expect-labels（求和用）与 --platforms（写凭证用）的唯一真源：两处都从
      #   这一个变量取值，不再各自抄一份字面量——把"两份重复"降到了"一份"。
      #
      #   ⚠️ 老实说清楚这份"唯一真源"止步于哪：它**不是**从上面 `audit` job 的
      #   `strategy.matrix.include`（第 93 行附近）自动算出来的——GitHub Actions
      #   没有现成的办法把一个 job 的 matrix 标签列表直接投影进另一个 job 的
      #   `env:`（要做到得另起一个"先算 matrix JSON 再 fromJSON() 消费"的
      #   前置 job，是比这次改动大得多的重构，本次没有做）。这里仍然是**手写**的
      #   一份字符串，加/删平台时要跟 `audit` 的 matrix **手动**保持一致。
      #
      #   忘了同步会不会被静默吞掉？不会——`sum-undecided.mjs` 本来就拿
      #   `--expect-labels` 跟目录里实际下到的文件做双向比对：matrix 多了一格
      #   而这里没跟着加，多出来的文件会被"未预期文件"分支逮住（对应 selftest 的
      #   B4 用例）；matrix 少了一格而这里没跟着删，则会被"缺失"分支逮住
      #   （对应 B1/B2 用例）。两种情况都不是"悄悄少算"，而是响亮警告 + 收敛成
      #   null，判据不受影响。
      PLATFORMS: linux-x64,darwin-arm64,win32-x64
      # ★ 变异矩阵的标签**与 PLATFORMS 不同** —— 变异只在两个平台上跑
      #   （linux 跑全部；darwin 只跑 `M-driver-lie`；**win32 根本不在变异矩阵里**）。
      #   两份清单必须分开写，合成一份会让 `collect-unverified-mutations.mjs`
      #   永远找不到 `e2e-runtime-unverified-win32-x64.json`，
      #   于是**每一轮都虚报一条未验证** —— 一个恒吵的守卫，和恒绿的一样没用。
      #   加/删变异平台时要跟 `mutations` 的 matrix 手动同步；
      #   `selftest-attestation-mutations.mjs` 有一条用例正面钉着这两者一致。
      MUT_LABELS: linux-x64,darwin-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 三个矩阵格各自留的覆盖面计数（e2e-runtime-undecided-<label>.json），
      # merge-multiple 摊平进同一个目录 —— 与 build-backends.yml 的
      # merge-manifest job 取 fragment 是同一个模式。
      - name: 下载三平台的覆盖面计数
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-runtime-undecided-*
          path: undecided
          merge-multiple: true

      # 任何一格对不上，sum-undecided.mjs 只会警告 + 把 undecided_flag 收敛成
      # 空字符串，**不会**让这一步失败——一个纯展示用的覆盖面统计出故障，
      # 不该连累下面"写凭证"这一步（那一步产出的 artifact 名字才是闸门真正认的信号）。
      - name: 求和覆盖面计数
        id: sum
        run: |
          node scripts/ci/sum-undecided.mjs \
            --dir undecided \
            --expect-labels "$PLATFORMS" \
            --file-template 'e2e-runtime-undecided-{label}.json' \
            --github-output "$GITHUB_OUTPUT"

      # ★ 变异未验证清单：把「哪几条什么都没证明」从变异 job 带过来。
      #
      #   ⚠️ 只在变异 job **真的跑过**时下载/汇总。它被跳过时下面的表达式直接选
      #   `skipped`，这两步的输出用不上（`if:` 让它们不跑，输出为空串）。
      - name: 下载各格的未验证变异清单
        if: ${{ needs.mutations.result != 'skipped' }}
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-runtime-unverified-*
          path: unverified
          merge-multiple: true
      - name: 汇总未验证的变异
        id: mut
        if: ${{ needs.mutations.result != 'skipped' }}
        run: |
          node scripts/ci/collect-unverified-mutations.mjs \
            --dir unverified \
            --expect-labels "$MUT_LABELS" \
            --file-template 'e2e-runtime-unverified-{label}.json' \
            --github-output "$GITHUB_OUTPUT"

      # ★ `--mutations`（#102；三态化 2026-08-17，关掉 v0.7.3 已知边界第 13 条）
      #
      #   `needs.mutations.result` 只分得出「跑没跑」；**跑了之后每条有没有结论**
      #   要靠上面那一步汇总出来的 `mutations_state`：
      #     · `skipped`        —— 变异 job 整轮没跑；
      #     · `ran`            —— 跑了，且**每一条都有结论**；
      #     · `ran-unverified` —— 跑了，但至少一条什么都没证明（同时附上是哪几条）。
      #
      #   此前这里写死 `success ⇒ ran`，于是**退出码 3（跑了但什么都没证明）
      #   被记成了 `ran`** —— darwin 那一格从 08-10 起每轮如此，而凭证一直说好消息。
      #
      #   `failure` / `cancelled` **到不了这里**（上面的 `if:` 已经把凭证挡掉了），
      #   所以 `emit-e2e-attestation.mjs` 不认别的值，一律 die ——
      #   万一哪天上面那道门被改松，这里会**当场炸**（凭证发不出去）。**炸比撒谎好。**
      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg runtime \
            --bundle-run "${{ needs.audit.outputs.bundle_run_id }}" \
            --platforms "$PLATFORMS" \
            --mutations "${{ needs.mutations.result == 'skipped' && 'skipped' || steps.mut.outputs.mutations_state }}" \
            ${{ steps.mut.outputs.unverified_flag }} \
            ${{ steps.sum.outputs.undecided_flag }} \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-runtime-${{ needs.audit.outputs.bundle_run_id }}
          path: dist/e2e-attest.json
          if-no-files-found: error
