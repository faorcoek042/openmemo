# 代理覆盖实测 —— 每晚一次，量「设置页说代理已生效」到底覆盖了哪几条出网路径
#
# ⚠️⚠️ **先读这一条（2026-09-06 订正）** ────────────────────────────────────────
#
# 下面从「它存在的唯一目的」到「首跑结果」那一大段，写的是 2026-08-11～08-23
# 之间的事：那时它**没有自动执行者**，标题里的"首跑"、正文里的"跑不跑得起来
# 没有人知道"都是当时的实况。**那个阶段已经结束了** —— 08-23 按过期判据的
# 出路 ① 挂上了 cron（见文件末尾「✅✅ 它绿了」一节），此后每晚自动跑。
#
# 那几段**保留**，因为它们记着这条腿是怎么从"暗着的脚本"走到"每晚一格"的，
# 而那个过程本身是判据的设计输入。但**别再把它们当现状读**。
#
# ⚠️ 这里**故意不写**"已经连绿了几天"「共几行」这类数字：抄下来的数字第二天就旧，
#    而本仓为「被抄写的实测数字」栽过三次（下面 791 行那处就是其中之一）。
#    **要现状就看这条 workflow 最近一次运行的第 5 节「结论」** —— 那张表是脚本
#    每轮自己打的，七条路径逐条列出来，绿了红了都以它为准，不以这里的注释为准。
#
# ── 它存在的唯一目的（**历史**：2026-08-11 的实况）─────────────────────────────
#
# `scripts/ci/proxy-coverage-audit.mjs` 写于 2026-08-08，
# `[实测 2026-08-11]` 全仓审计：**一个执行引用都没有** —— 没有 workflow、
# 没有 package.json 脚本项、没有任何链会调它。
#
# ⚠️ 此处原写着「有 **791 行**」。那个数字后来旧了（脚本又改过几轮），
#    而它对读者**没有任何用处** —— 删掉，不换成新的数字。
#
# ⚠️ **订正（2026-08-23）**：此处曾写着「**它从写完那天起一次都没跑过**」。
#    那句话**不准确**，而且是往严重的方向不准确。准确的说法是
#    **「它没有任何自动执行者」** —— 作者本人在 2026-08-08 手工跑过一次完整的，
#    `exit 0`，①②③⑤⑥⑦ 全绿、④ 记为 UNKNOWN-已由别处覆盖
#    （见 `f275deb` 提交正文的前后对照表，以及
#    `coordination/inbox/pending-rulings.md:42,177`）。
#    这个区别是要紧的：一句"从没跑过"会让下一个人以为**连能不能跑起来都不知道**，
#    从而更容易做出"删掉算了"的决定 —— 而事实是它跑通过，只是没人再跑第二次。
#
# 而 `HANDOFF.md` 曾经拿它当"代理覆盖每一条出网路径"的证据（已于 `6bc7a3b` 改正）。
#
# 所以（**当时**）真正的缺口不是"要不要自动跑"，是：
#
#   > **它在 CI 上跑不跑得起来，没有人知道。**
#
# ⚠️ 这个缺口**已经补上了**（08-23 首次在 CI 上跑绿，随后挂 cron）。
#    保留这句是为了记住缺口长什么样，不是为了描述现在。
#
# 直接挂到 `e2e-import` 那条绿腿上不行 —— 它要连外网、要真下载，本地预跑不了，
# 那就等于把一个没在 CI 上跑过的东西红着上线。
# **这个 workflow 是把未知变成已知的那一步，仅此而已。**
#
# ── 🔴 过期判据 · **第二版**（第一版滑掉了，滑法本身是这一版的设计输入）─────────
#
# **第一版原文（2026-08-11 写下，保留在这里，因为它没有错，错的是它住的地方）：**
#
#   > 到 v0.7.2 发布时，本 workflow 要么已被提升为自动跑的一格
#   > （`ci.yml` 的一个 step，或挂进 `e2e-import.yml`），
#   > 要么连同 `scripts/ci/proxy-coverage-audit.mjs` 一起删除。
#   > **停在这里不算一个终态。**
#   > 当前版本 `0.7.0`（`package.json` 是唯一事实来源）。
#
# **它是一条可证伪、有日期、有两条出路的好判据。然后仓库发了 0.7.2（08-13）、
#   0.7.3（08-15）、0.7.4（08-17），三次，没有任何一次注意到它。**
#
# 成因不是没人负责，是它**住在一个没有任何守卫会读的地方**：
#   · `check-doc-freshness.mjs` 是 1 条手写条目的表，只读 `D-19`；
#   · `check-pending-claims.mjs` 是 5 条手写条目的表，谁没被手工加进去谁就不存在；
#   · `check-comment-facts.mjs` 的扫描范围是 `*.ts/tsx/mjs/js/sql` + `docs/**.md`
#     —— **`.yml` 不在里面**；
#   · `lint-workflows.mjs` 读 workflow，但 YAML 注释在 `parse()` 那一步就被丢掉了；
#   · `version-bump.mjs`（发版动作本身）只写 `package.json` + `CHANGELOG.md`，
#     不查任何登记。
#
# → **第二版判据不写在这里，写在 `scripts/ci/check-workflow-expiry.mjs` 的登记册里，
#    由机器按 `package.json` 的版本号判，过期当场红。**
#    截止版本 **v0.7.6**，两条出路见那条登记。
#    `selftest-workflow-expiry.mjs` 的 A9 用"把时钟拨回 v0.7.2 + 第一版判据"
#    证明了这道门会红 —— 也就是说，同一件事不会再发生第二次。
#
# ⚠️ 顺延 `expiresAt` 不是出路。真要顺延，得在登记里写清楚
#    **这一轮变了什么，使得它不会再滑一次**（这一轮变的是：判据从注释搬进了守卫，
#    而且首跑那处吞掉自己错误的代码已经修了 —— 见下面「首跑结果」一节的订正）。
#
# ── 如果首跑发现它跑不起来，走删的路子，别留永久停车位 ────────────────────────
#
# ⚠️ **首跑红了也是收获**：「跑过一次并且红了」比「从没跑过」强得多。
# **不许为了让它绿去改它的断言** —— 它要是红在自己的逻辑上，那正是要知道的事。
#
# 若首跑证明**它根本跑不起来**，或**修它的代价大于它守的那点性质**：
# 照 ADR-017 那个先例 —— **删掉脚本与本文件，但把知识留档**
# （它验过哪几条出网路径、当时的结论是什么、为什么不再维护），
# 写进 `docs/adr/` 或对应的 inbox 回执。
# **别让"将来接上"变成一个永久停车位** —— 这正是它现在这个状态的成因。
#
# ── 它需要什么（首跑之前只能给上界，不许编确切数字）────────────────────────────
#
# - **真外网出口 + 真下载**：脚本自己写死了「装 media-tools + yt-dlp + whisper，
#   **ASR 不能省**」，理由在 `proxy-coverage-audit.mjs:392-396`：缺组件时 job 停在
#   `blocked`，yt-dlp 的 fetch 一次都没发生，而脚本会把"代理没看到请求"
#   **误读成"绕过了代理"** —— 一个假绿。
# - **一个 `openmemo-proxy-probe.test` 真的解析不了的 DNS 环境**（`:64`）。
#   带通配符解析的网络后面会假红。GitHub runner 正常，自建 runner 要当心。
# - **已构建的 dist**：`:248-252` 缺了就硬退出并提示 `pnpm build:safe`。
# - 它**自己 spawn daemon**、自己 `mkdtemp` 隔离数据目录、自己重定向
#   `OPENMEMO_POINTER_FILE`（`:255-267`）—— 所以它不需要人来搭台子，
#   这也是这批脚本里唯一一个做得到的。
#
# ── 📌 首跑结果（2026-08-11，run 31424996163）—— UNKNOWN 已变成事实 ────────────
#
# **确切下载量不再是 UNKNOWN：`[实测]` +551 MB**
# （root 58642 → 59192 MB；其中临时目录 7 → 558 MB，即下载物基本都落在隔离数据目录里）。
# 远低于此前只能给的上界参照（`backends.json` 14 条合计 1173 MB；
# `models-whisper.json` 30 条合计 27 GB —— 它只取其中一个）。**上界作废，以这个数为准。**
#
# **首跑结论：`failure`。而这正是这条 workflow 要买的信息** ——
# 「跑过一次并且红了」比「从没跑过」强得多。它红在**自己的逻辑上**，不是环境上：
#
#     ✘ 中断：ENOENT: no such file or directory,
#             open '/tmp/openmemo-proxy-audit-rzW8WF/clip.mp4'
#
# 前七步全绿（装包、起 daemon、装 media-tools/yt-dlp/whisper 都成了），
# 死在**第 2 步末尾自己造 fixture 那一段**（`proxy-coverage-audit.mjs:474-506`）：
#
#   ① `spawn(FFMPEG, …, { stdio: 'ignore' })` —— ffmpeg 的报错**被丢掉了**，
#      所以真正的原因在日志里根本看不到；
#   ② `p.on('close', r)` —— **任何退出码都当成功**，非零退出照样往下走；
#   ③ 紧接着 `readFileSync(out)` 盲读 —— 于是失败以一个**离成因很远**的 ENOENT 现形。
#
#   而实质原因多半是：它假设产品自带的那个 ffmpeg 支持 `lavfi` + `libx264` + `aac`，
#   但本产品的 media-tools 是**面向解码**的构建（同仓另有 `ffmpeg-lgpl-verify.yml`
#   专门在量解码覆盖面）。**编码器不在，合成 fixture 这条路就走不通。**
#
# ── 🔴 上面那条推断，实测之后**一半是错的**（run 32655294063，2026-08-23）─────────
#
#     ✘ 造 fixture 的 ffmpeg 退出码 8
#       ffmpeg stderr: `Unknown encoder 'libx264'` / `Encoder not found`
#       ★ 编码器实况：无 libx264　**有 libopenh264**　**有 mpeg4**　**有 aac**
#                     有 libmp3lame　有 pcm_s16le
#
#   **编码器好好地在，缺的只有 `libx264` 一个**，而它缺的原因是**许可证**、
#   不是"面向解码"：那个包的路径里就写着 `…-linux64-**lgpl**-8.1`，
#   而 libx264 是 GPL —— LGPL 构建里本来就不会有它。
#
#   ⚠️ 这条订正值得单独记，因为**旧推断会把下一个人带向错误的修法**：
#      照着"编码器不在"去做，结论是"换一条不依赖编码器的 fixture 路径"
#      （往仓库里塞一个二进制夹具之类）。真实的修法是**换一个编码器名字**。
#      那一行被 `stdio:'ignore'` 吞掉的 stderr，值 13 天。
#      → 已改成**按这台机器实际有的编码器挑**（libx264 → libopenh264 → mpeg4），
#        并把挑中的那个打印出来。
#
# ── ✅ ①②③ 已修（2026-08-23），而"实质原因"仍然只是推断 ────────────────────────
#
# 上面 ①②③ 那三处**已经改掉**（`proxy-coverage-audit.mjs` 造 fixture 那一段）：
# 现在会捕获 ffmpeg 的 stderr、按退出码判红、并且在失败时**顺带打印该 ffmpeg 的
# 编码器实况**（`libx264 / libopenh264 / mpeg4 / aac / libmp3lame / pcm_s16le`）。
#
# ⚠️ 这**不是**"为了让它绿去改断言"（那条禁令仍然有效，方向正好相反）：
#    它把一个**静默的**失败改成**大声的**失败。这一步该红照样红，
#    只是红的那句话会指着真正的成因，而不是指着一个空文件名。
#
# ★ 上一段那句「实质原因多半是…编码器不在」**至今仍然是推断，没有人查过**。
#   `stdio:'ignore'` 正是让它查不了的那个原因。下一次运行会**直接回答**它 ——
#   到时候请回来把"多半是"换成实测结论，别让下一个人继续照抄这条推断。
#
# ── 为什么裁决是「修」不是「删」（2026-08-23，已核过覆盖面）──────────────────
#
# 文件头下面那节写着「若首跑证明它根本跑不起来…就删掉并归档」。**不适用**：
# 它 2026-08-08 在开发机上跑通过（`exit 0`），CI 上死的是造 fixture 的脚手架，
# 不是那七条测量本身。而**删掉它会让四条性质一起变成没人证明**：
#
#   · ①②③（模型下载 / LLM 上游探测 / direct-http）——`[已核]` 今天只有
#     "`setGlobalDispatcher` 装了全局分发器，所以没有调用点绕得过去"这个**结构论证**，
#     **没有任何测试**真的验证过一条被代理的请求确实到达了代理。
#   · ⑦（设置页说"已生效"对**子进程**也成立，且 `mode:off` 之后真的关掉）——
#     **没有任何东西覆盖**。`proxyCoverage.test.ts` 钉的是构造点传没传 `proxy:`，
#     `ffmpegProxyEnv.test.ts` 钉的是 `buildChildEnv` 注不注环境变量；
#     **"改完设置不用重启就生效、关掉也立刻生效"这条时间性质，两者都碰不到。**
#
# 反过来，④⑤⑥ 确实已被 `ffmpegProxyEnv.test.ts` 与 `proxyCoverage.test.ts`
# （源码扫描 + 调用点钉死）覆盖 —— 那三条不是留着它的理由。**①②③⑦ 才是。**
#
# ── ✅✅ 它绿了（run 32656062961，2026-08-23）—— 过期判据按**出路 ①** 兑现 ────────
#
# 换掉写死的 `libx264` 之后，**七条路径第一次全部跑到**：
#
#     fixture 编码器：libopenh264 / aac（按这台机器实际有的挑）
#     ① 模型下载              ✅ 走代理
#     ② LLM API 调用          ✅ 走代理
#     ③ direct-http probe     ✅ 走代理
#     ④ ffprobe 远端读（子进程）  UNKNOWN（另有守卫：`ffmpegProxyEnv.test.ts`）
#     ⑤ yt-dlp probe（子进程）  ✅ 走代理
#     ⑥ yt-dlp fetch（子进程）  ✅ 走代理
#     ⑦ 改回 off 后立即生效      ✅ 立即生效（PATCH off → 代理看到 0 条）
#     ✔ 每一条出网路径都走代理，与设置页的声称一致。
#     `[实测]` 下载量 **551 MB**（root 59882 → 60433），与首跑那次逐字一致。
#
# 所以「在它至少跑绿过一次之前不许自动触发」这个前提**已经不成立了** ——
# 它跑绿了，于是按判据的出路 ① 挂上 cron。
# **判据不再挂在这里**：`check-workflow-expiry.mjs` 的登记册里那条已经删掉了，
# 因为有了自动触发器之后它就不再是一条"暗着的 workflow"。
name: proxy-coverage

on:
  schedule:
    # 每天 19:45 UTC，接在 ci-crossplatform（19:30）后面。
    # ⚠️ schedule 只在**默认分支**上触发 —— 这条 cron 在 PR 上验不了。
    # 阶梯：allcomponents 18:00 / runtime 18:15 / browser 18:30 / notes 18:45 /
    #       import 19:00 / record 19:15 / ci-crossplatform 19:30 / **本文件 19:45**。
    # 不是为了省钱（public 仓 $0），是别在同一时刻抢 runner 影响别人的 PR 判决。
    #
    # ⚠️ 本文件**没有 `inputs:`**，所以 #91 那条「`schedule` 下 `default:` 不生效、
    #    空 inputs 会静默少跑」的整族问题在这里不适用 —— 不是被遗漏了，是不存在。
    #    谁将来给它加 `inputs:`，请先读 `e2e-import.yml:35-52`，再回来补兜底。
    - cron: '45 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # ⚠️ 名字里**不写状态**（原来写的是"首跑：把从没跑过变成有结论"，
    #    挂上 cron 之后那句就成了假话，而 job 名是 Actions 页面上最先被读到的一行）。
    #    结论以本次运行第 5 节那张七行的表为准。
    name: 代理覆盖逐条实测（七条出网路径，结论见第 5 节）
    runs-on: ubuntu-24.04
    # 真下载 + 真转写，给足时间；超时本身也是一条要记录的结论。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # 脚本 `:248-252` 缺 dist 会硬退出，所以这一步是**真依赖**。
      - name: Build (workspace packages)
        id: build
        run: pnpm build:safe

      # ★ 把 UNKNOWN 变成事实：记录跑之前的占用，跑完再记一次，差值就是真实下载量。
      - name: Disk before
        id: disk_before
        run: |
          echo "root_mb=$(df -m --output=used / | tail -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "tmp_mb=$(du -sm /tmp 2>/dev/null | cut -f1)" >> "$GITHUB_OUTPUT"

      # ⚠️ 不加 `continue-on-error`：红了要如实红。
      #    「跑过一次并且红了」是有信息的结论，把它写成绿就等于白跑。
      - name: Proxy coverage audit
        id: audit
        run: node scripts/ci/proxy-coverage-audit.mjs

      # 无论上一步红绿都要量 —— 红着退出时的下载量同样是我们要的那个数。
      - name: Disk after (量出真实下载量，替换文件头里的 UNKNOWN)
        if: ${{ !cancelled() }}
        run: |
          AFTER_ROOT=$(df -m --output=used / | tail -1 | tr -d ' ')
          AFTER_TMP=$(du -sm /tmp 2>/dev/null | cut -f1)
          echo "磁盘占用（MB）  before_root=${{ steps.disk_before.outputs.root_mb }} after_root=${AFTER_ROOT}"
          echo "临时目录（MB）  before_tmp=${{ steps.disk_before.outputs.tmp_mb }} after_tmp=${AFTER_TMP}"
          echo "→ 真实下载/占用增量约 $((AFTER_ROOT - ${{ steps.disk_before.outputs.root_mb }})) MB（root）"
          echo "→ 其中临时目录增量约 $((AFTER_TMP - ${{ steps.disk_before.outputs.tmp_mb }})) MB"
          # ⚠️ 这里**不再**叫人把数字抄回文件头。抄回去的那一刻它就开始变旧，
          #    而旧数字读起来和新数字一模一样 —— 本仓为此栽过三次。
          #    要哪一天的数，就看哪一天这一步的输出。
          echo "（这个数每轮都在这里打印；**别抄回文件头**，抄过去就成了会变旧的假事实。）"
