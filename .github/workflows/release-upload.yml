# 把构建 / 镜像产物上传到一个**已经存在且已发布**的 GitHub Release，然后**从公开 URL
# 不带凭证重新下载一遍**复算 sha256。
#
# ══════════════════════════════════════════════════════════════════════════════════════
# ★★ 这个 workflow 能做什么、不能做什么（权限边界 —— 请把这一段当成合同来读）
# ══════════════════════════════════════════════════════════════════════════════════════
#
#   能做：
#     - 从**另一个 run** 的 artifact 里取产物（`actions: read`）
#     - 往一个**已经存在、已发布**的 release 上**新增**资产（`contents: write`，且只有
#       `upload` 这一个 job 有）
#     - 不带任何凭证从公开 URL 重新下载并复算 sha256（`verify` job，**没有** write）
#
#   不能做（不是"约定不做"，是代码里根本没有这些调用，且有守卫钉着）：
#     - 建 release（`POST /releases`）—— tag 不存在就失败，并告诉你去找人建
#     - 改 release（`PATCH`）—— 包括把 draft 改成 published
#     - 删资产 / `--clobber` 覆盖同名资产（`DELETE`）
#     - 改仓库可见性、改分支保护、push 代码、改 tag
#     `scripts/ci/lint-workflows.mjs` 有一组断言：
#       ① 顶层 `permissions` 必须是空的；② 只有 `upload` job 允许 `contents: write`；
#       ③ `verify` job 不许拿到 write，也不许被喂 token；
#       ④ `scripts/ci/release-*.mjs` 里不许出现 `gh release create/edit/delete`、
#          `--clobber`、`DELETE`/`PATCH`/`PUT`。
#
# ── 为什么这道闸是"开一格"而不是"开到最大" ────────────────────────────────────────────
#
# `pack-publish` 在 T-150 里**拒绝**给 mirror-model-blobs 加 `contents: write`：
#
#   > 建 release 是要人确认的对外动作，"让 CI 代劳"会把那道闸悄悄绕过去
#   > —— 绕过的还是同一道闸，只是换了个执行者。
#
# **那个拒绝当时是对的，现在也仍然对。** 用户 2026-08-06 的指令「编写 CI 让 CI 传」
# 开的是"上传"这一格。所以本 workflow 的设计目标不是"CI 拿到发布权"，而是
# **"CI 拿到的权力刚好够把字节送上去，一点都不多"**。
#
# ── 为什么必须让 CI 传（动机是实打实撞出来的）────────────────────────────────────────
#
# 2026-08-06，从这台开发机传那个 294 MB 的模型**反复失败**：`gh` 静默不完成、
# curl 直传报 `HTTP 404` 而请求体完整发出了 294,372,519 B。而 **runner 到 GitHub 的链路
# 是内网级的** —— 让产出产物的那台机器顺手把它送上去，比让它绕地球一圈再送回去更可靠。
#
# ── ⚠️ 重试必须串行且互斥（一小时换来的教训，写在这里免得下一个人再犯）──────────────
#
# 同一次事故里，操作者**连开三路后台重试却没有杀掉前面的**，于是三个进程
# **并发上传同一个文件并互相 `--clobber`**，跑了一个多小时都没有一次成功。
# 清干净之后**单跑一次就成功了**。
#
#   > **并发重试会把一个可恢复的失败变成一个永久的失败。**
#
# 两处落实：
#   - 脚本内：重试是 `for` + `await`，且每次重试前重新拉一遍资产列表（可能上一次已经成了）；
#   - 这里：`concurrency` 按 tag 分组 + `cancel-in-progress: false`。
#     ★ 特意**不**取消进行中的那一个 —— 取消一次进行中的上传，留下的正是
#     `state != uploaded` 的半截资产，而本 job 没有删除能力去收拾它。
name: release-upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在且**已发布**的 release tag（本 workflow 不会创建它；draft 会失败）'
        required: true
        type: string
      run_id:
        description: '产出待上传 artifact 的那个 run 的 id（例如 build-backends / mirror-model-blobs 的 run）'
        required: true
        type: string
      artifacts:
        description: '要取哪些 artifact（逗号分隔；留空 = 该 run 的全部）'
        required: false
        default: ''
        type: string
      dry_run:
        description: '只做检查与判定，不真的上传（用来先看一眼计划）'
        required: false
        default: false
        type: boolean

# ★ 顶层什么权限都不给。写权限只在下面那一个 job 上出现。
#
# 为什么不写在顶层：顶层的 `contents: write` 会**同时**落到 `verify` 上，
# 而 verify 存在的全部理由就是"不带凭证也能下下来"。一个手里攥着写权限的校验者，
# 证明不了匿名用户拿得到东西。**边界要能从 YAML 上一眼看出来，而不是靠读脚本。**
permissions: {}

concurrency:
  group: release-upload-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发布前闸门：**这一批包，四条 e2e 腿都对着它跑绿过了吗？**
  #
  # ## 它挡的是一次真事故
  #
  # `v0.3.0` 发出去之后才发现，四条 e2e 腿此前跑的**都是更早的包**
  # （全在 `aa92cba3` 之前）。是用户追问「确定各平台都验过了吗」才查出来的。
  # 与 `v0.2.0`「CI 从没执行过启动器」是**同一形状**：
  # **判据没有对准交付物，而且靠人记得。**
  #
  # 根因是一条容易被读漏的性质：
  #   **e2e 腿测的是「包」，不是「树」** —— 它绿只说明**那一批包**好；
  #   反过来 HEAD 修好了它也不会自己变绿，得先重新出包。
  # 所以"跑过 e2e"必须有个宾语。凭证名字里的 `bundleRunId` 就是那个宾语。
  #
  # ## 为什么放在这里，而不是做成一份给人看的清单
  #
  # 本仓已经立过判据：**「一个需要人记得去填的参数，等价于一个迟早不会被填的参数。」**
  # 清单同理。放成 `upload` 的 `needs:` 之后，**不通过就没有上传这回事** ——
  # 判定从"人记得检查"变成"机器拦得住"。
  #
  # ## 只对**包**生效
  #
  # 这个 workflow 也给 build-backends / mirror-model-blobs 传东西，那些不归 e2e 腿管。
  # 所以先看 run_id 里到底有没有 `bundle-*` 产物：没有就明说"这批不是包，跳过闸门"，
  # **并把这句话打出来** —— 一个静默跳过的闸门与没有闸门等价。
  # ═══════════════════════════════════════════════════════════════════════════════════
  e2e-gate:
    name: 发布前闸门（这批包跑过四条 e2e 腿吗）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # 只读，且只读 Actions —— 它只需要问"有没有那个 artifact 名字"。
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 这批产物是不是「包」
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.run_id }}/artifacts" \
            --jq '[.artifacts[]|select(.expired==false)|.name]|join(",")')
          echo "run ${{ github.event.inputs.run_id }} 的产物：[$names]"
          case ",$names," in
            *",bundle-"*|*",bundles-complete,"*) echo "is_bundle=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "is_bundle=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ★★ 发包之前：目录里指向**我们自己 release** 的地址必须都还活着。
      #
      # 2026-08-09 的事故：预编译包**内嵌** vendor/manifests，所以
      # **包出厂那一刻它要下载的 URL 就冻住了**。删掉一个 release 就永久打死
      # 所有还指着它的、已经在用户机器上的包 —— 用户只看到"点安装没反应"。
      # 实测后果：三平台 whisper.cpp 一族（含 GPU 加速）全部装不上。
      #
      # Manager 裁决「从现在起不删 release」。但判据不能是"记得别删"
      # （本仓立过：**跑错了也不会造成后果**才算修好）。所以这一步放在
      # 发包之前：**就算真有人删了，包也发不出去**，而不是等用户装不上。
      #
      # ⚠️ 它拦不住"人在本地敲 gh release delete"（仓库里没有服务端钩子）——
      # 那一侧由 `--tag` 模式服务（删之前问一句"还有谁指着它"）。
      # 这一步管的是**后果**：删了就发不出新包，事故止于此。
      - name: 目录指向的 release 必须还活着（内嵌清单 = 出厂即冻结）
        if: steps.kind.outputs.is_bundle == 'true'
        run: node scripts/ci/check-release-refs.mjs --assert-live

      # ── T-196：反方向的那一半 ──────────────────────────────────────────────
      #
      # 上面那条查的是「published 的地址还活着吗」。**反过来从来没人查**：
      # 一个包标着 `pending-ci`（"还没发布下载地址"），而地址其实早就能下了。
      #
      # `[用户真机 Windows v0.7.0]` 报「whisper.cpp Vulkan 后端没得下载安装使用」——
      # 真相不是下载失败，是**按钮恒灰、从来没发出过请求**：
      # 卡片读 `availability === 'pending-ci'` 就把按钮 disabled 掉。
      # 而那个包早在 v0.6.0 就在架上了；标记写下时是实话，**发完没翻**。
      # 从那一刻起清单上那句话就是假的，而全仓没有一处判据会发现它。
      #
      # ⚠️ 判据刻意**不是**「pending-ci 不许带 URL」——「包构建出来了、URL 已知、
      # 但还没上架」正是 pending-ci 带 URL 的合法用法，禁掉会挡住正常流程。
      # 判据钉的是后果：pending-ci 说的是"你现在下不到"，那就去下一下。
      # **真能下，这句话就是假的。**
      - name: pending-ci 的地址不许真的下得到（= 发完忘了翻标记）
        if: steps.kind.outputs.is_bundle == 'true'
        run: node scripts/ci/check-release-refs.mjs --assert-availability

      - name: 四条 e2e 腿的凭证核对
        if: steps.kind.outputs.is_bundle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-e2e-attestation.mjs --bundle-run "${{ github.event.inputs.run_id }}"

      # 不是包就说清楚为什么没查 —— 静默跳过的闸门等于没有闸门（PROTOCOL §11）。
      - name: （非包产物）说明为什么跳过
        if: steps.kind.outputs.is_bundle != 'true'
        run: |
          echo "这个 run 里没有 bundle-* / bundles-complete 产物 —— 不是一批包，"
          echo "e2e 闸门不适用（四条 e2e 腿验的是预编译包）。本次不做该项判定。"

  upload:
    name: 上传到已存在的 release（唯一一个有写权限的 job）
    # ★ 闸门不过就没有上传这回事 —— 判定从"人记得检查"变成"机器拦得住"。
    needs: [e2e-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      # ★ 这是整个仓库里唯一一处 `contents: write`。
      #   GitHub 没有比它更细的 release 权限刻度 —— 也就是说，"只能新增资产、不能建/改/删
      #   release" 这条**没法靠 token 的 scope 表达**，只能靠调用面收窄 + 守卫钉住。
      #   所以：release-upload.mjs 里只有两种请求（GET releases/tags/… 与 POST …/assets），
      #   lint-workflows.mjs 里有一条断言不许别的方法出现。
      contents: write
      # 取**另一个 run** 的 artifact 需要它。只读。
      actions: read
    steps:
      - uses: actions/checkout@v6

      # 脚本是零依赖的纯 node（和 emit-pack-manifest / mirror-model-blobs 同一个理由：
      # 为了传几个文件去装整个 workspace 不划算）。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 取产物（来自 run ${{ github.event.inputs.run_id }}）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-src
          names=""
          if [ -n "${{ github.event.inputs.artifacts }}" ]; then
            IFS=',' read -ra arr <<< "${{ github.event.inputs.artifacts }}"
            for a in "${arr[@]}"; do
              a="$(echo "$a" | xargs)"          # 去掉两边空格
              [ -n "$a" ] && names="$names -n $a"
            done
          fi
          # shellcheck disable=SC2086
          gh run download "${{ github.event.inputs.run_id }}" \
            --repo "${{ github.repository }}" --dir dist/release-src $names
          echo "── 取到的东西 ──"
          find dist/release-src -type f -printf '%12s  %p\n' | sort -k2

      # 这一步做四件事，任何一件不过就红：
      #   ① 现场复算每个文件的 sha256，与产物自带的 SHA256SUMS / pack fragment 比对
      #   ② 确认 release 存在、且不是 draft（不存在 / draft 都不替你修）
      #   ③ 逐个资产判定：不存在→传；已存在且一致→跳过并说明；已存在但不同→**失败**
      #   ④ 串行上传，重试前重新核对
      - name: 校验产物 → 判定 → 上传
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/release-upload.mjs \
            --repo "${{ github.repository }}" \
            --tag "${{ github.event.inputs.tag }}" \
            --from dist/release-src \
            --stage dist/release-stage \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 只把**清单**交给下一 job（几 KB），不把产物再倒一次手：
      # 校验那一步本来就该从 release 的公开 URL 取，而不是从我们手里的副本取。
      - uses: actions/upload-artifact@v6
        with:
          name: release-upload-plan
          path: |
            dist/release-stage/SHA256SUMS
            dist/release-stage/RELEASE-UPLOAD-PLAN.json
          if-no-files-found: error
          retention-days: 90

  verify:
    name: 不带凭证从公开 URL 重新下载并复算（会真的红）
    needs: upload
    # ★ dry_run 时**不跑**校验。这一行是实测出来的，不是设计洁癖：
    #
    #   第一版让它照跑，理由听起来很对（"它验的是 release 现在是什么，与我们传没传无关"）。
    #   `[CI 实测 run 31099024189]` 一跑就红：dry-run 计划里那个"本来要传"的资产当然
    #   不在 release 上，于是 verify 报 `HTTP 404`，整个 workflow failure ——
    #   **而什么问题都没有发生**。
    #
    #   也就是说：任何一次"有东西要传"的 dry-run 都会稳定地红。
    #   而「稳定红且原因已知」是最坏的一种红 —— 它训练所有人忽略这个 workflow，
    #   那正是本仓最贵的那类失败得以长期存活的土壤（`pack-publish` T-146 记过同一条）。
    #
    #   所以 dry-run 的语义收紧为：**只出计划，不对 release 的现状作任何断言。**
    #   要断言就跑真的那一次。
    #
    #   `success() &&` 是显式写出来的：一个 job 上有了 `if:` 之后，"依赖失败就跳过"
    #   这件事最好别靠记忆里的默认语义。
    if: ${{ success() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # ★ 只有 read，而且只是为了 checkout 出校验脚本本身。
      #   真正的保证在脚本里：`release-verify.mjs` 启动时会断言自己的环境里
      #   **没有** GITHUB_TOKEN / GH_TOKEN / GH_ENTERPRISE_TOKEN，有就当场失败。
      #   为什么要机器检查而不是写条规矩：某天有人为了修一个 401 会"顺手"
      #   在这一步补一行 `env: GITHUB_TOKEN: …` —— 那一刻这个 job 会继续绿，
      #   但它再也证明不了匿名可下（也就再也发现不了 draft release）。
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/download-artifact@v7
        with:
          name: release-upload-plan
          path: dist/release-stage

      # ⚠️ 这一步**刻意不设任何 token 环境变量**。别加。
      - name: 匿名重新下载 + 复算 sha256
        run: |
          node scripts/ci/release-verify.mjs \
            --plan dist/release-stage \
            --out dist/release-verify

      # ★ 用 coreutils 自己再验一遍 —— 一次完全独立于我们任何代码的复核。
      #
      # 之所以这条命令在这里**本来就是对的**（不需要 --ignore-missing、不需要读文档）：
      # `SHA256SUMS` 恰好列出这次要保证存在的那些资产，一个不多一个不少。
      # `pack-publish` T-150 踩过反面：三个分包共用一份 9 行清单，单独验一包时
      # `sha256sum -c` 输出 `5 listed files could not be read` + exit 1，
      # **而文件一个都没坏**。
      #   > 一个把"完全正常"报成"看起来像损坏"的验证工具，比没有验证工具更糟 ——
      #   > 它要么让人丢掉好产物，要么让人学会忽略输出，后者更贵。
      #   > **让最显然的那条命令本来就是对的。**
      - name: sha256sum -c（独立复核，不依赖本仓任何代码）
        working-directory: dist/release-verify
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 验证链的最后一环：**发布页正文里印的那三行 sha256，和 CI 算出来的一样吗？**
  #
  # ## 它补的是链条上唯一一处靠人手抄的东西
  #
  # 上面 `verify` 走完之后，我们已经知道「匿名从公开 URL 下到的字节 == CI 自己算的
  # `SHA256SUMS`」。这条链很结实 —— **但它从头到尾没有读过发布页正文一个字。**
  # 而用户真正会拿去核对的那三行，是**人手抄进正文的**。
  #
  #   ⇒ 抄错一位，`verify` 照样绿，`sha256sum -c` 照样绿，整条链上没有一处会红。
  #     用户拿页面上的数一核对不上，得出的结论会是"下载损坏了 / 被掉包了"，
  #     而字节其实是好的，只有那张纸印错了。
  #
  # v0.7.6 发版时这一步做了 —— 靠的是**在 `/tmp` 里临时写个脚本跑一遍**。
  # 本仓已经反复立过这条判据（上面 e2e 闸门那一段也写着同一句）：
  #
  #   > **「一个需要人记得去做的判据，等价于一个迟早不会被做的判据。」**
  #
  # ## ⚠️ 为什么它在**这个位置**（`needs: verify`，全流程最后一个 job）
  #
  # 它要同时拿到两样东西，而这两样东西只有到这一刻才都齐：
  #   ① **CI 那侧的 `SHA256SUMS`** —— `upload` 现算并作为 `release-upload-plan` 传下来的；
  #   ② **发布页正文** —— 它是发版的人写的，写在 release 上，不在任何 artifact 里。
  # 放在 `upload` 之前没有 ①；放进 `verify` 会给那个 job 带上 token，
  # 而 `verify` 存在的全部理由就是"手里没有凭证"（见它 permissions 上那段注释）。
  # 所以它是独立的一个 job，排在最后。
  #
  # ## ⚠️ 已知边界：它验的是**这一刻**的正文
  #
  # 之后再改正文（本仓的规矩是"订正只能追加"，所以正文**确实会**被再编辑）
  # **不在这道门的覆盖面内** —— `release-upload.yml` 是 dispatch-only，
  # 而 lint-workflows 的 T-154 ④ 明令它不许被 `release` 事件自动触发
  # （上传是对外动作，必须有人按）。要覆盖"事后编辑"得另开一条 `on: release` 的
  # workflow，那是另一件事，这里不假装已经做了。
  # ═══════════════════════════════════════════════════════════════════════════════════
  body-check:
    name: 发布页正文 ⟷ CI 的 SHA256SUMS（机器比对，会真的红）
    # dry-run 时 `verify` 被跳过 ⇒ 本 job 按默认的 success() 语义一起跳过。
    # 这是对的：dry-run 的语义是"只出计划，不对 release 的现状作任何断言"。
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # 只读。它读两样东西：checkout 出比对脚本，和 release 的正文。
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # CI 那一侧 —— `upload` 现算的清单，`verify` 刚刚拿它匿名复核过。
      - uses: actions/download-artifact@v7
        with:
          name: release-upload-plan
          path: dist/release-stage

      # 发布页那一侧。只读一次 release，不写任何东西。
      - name: 取发布页正文
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-body
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }}" \
            --jq '.body' > dist/release-body/body.md
          # 绿的时候也把量到的规模打出来 —— 一个只在红的时候说话的取数步骤，
          # 取回空串时看起来和"取到了"一模一样。
          echo "── 发布页正文 $(wc -c < dist/release-body/body.md) 字节 / $(wc -l < dist/release-body/body.md) 行"

      # 判据本体。地板在脚本里：**两侧任何一侧数到 0 条就红**，
      # 拒绝在空集上报绿（反向验证见 scripts/ci/selftest-compare-body.mjs）。
      - name: 机器比对（抄错一位就红）
        run: |
          node scripts/ci/compare-body-vs-ci.mjs \
            --body dist/release-body/body.md \
            --sums dist/release-stage/SHA256SUMS
