# F3「录音 → 转写 → 时间轴」端到端 —— **用预编译包，走产品自己的 HTTP / WebSocket**。
#
# ── 这条腿为什么存在 ────────────────────────────────────────────────────────────────
#
# 用户 2026-08-08，在真机上打开 v0.2.0 的包之后：
#
#   「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 他说得对。在这之前，CI 验的是「**产品能不能被脚本驱动着转出一段文本**」
# （`cold-start-audit` 第 7 节：`POST /api/notes/import` → 拿到非空文本）。
# 而交付出去的是「**人要用手打开并使用它**」。两者之间隔着一整条功能面：
# 浏览器推上来的那条 WebSocket、落盘的音频资产、波形、时间轴、搜索深链 ——
# **一条都没有在 CI 上跑过**。
#
# 所以判据从今天起是：**这条功能面在 CI 上、用预编译包、走产品自己的
# HTTP/WS 路径，端到端真的能用。**
#
# ── 它验什么（每条都是断言，不是打印）────────────────────────────────────────────
#
#   · 录音链路：`/ws/recorder` 真收到音频 → 落盘成**可播放**的资产（含 Range 回放）
#     → 建笔记。CI 里没有麦克风，所以**喂真实 PCM16**（那本来就是浏览器发的东西），
#     但**服务端一段都不绕过**：升级闸门、鉴权、RecorderSession、WAV 头回填、
#     资产入库、波形计算、离线重跑排队，全是产品自己的代码在真端口上跑。
#   · 转写：真 whisper-cli 子进程 → 分段 → **词级时间戳** → 落库 → 从 HTTP 读得出来。
#   · 重新转写：**换一个模型**再转一次，判据是「稿子自报的 modelId 真的变了」
#     **且**词级时间戳没丢（T-164 ④ 那次事故的回归护栏）。
#   · VAD：装了 / 没装两种都跑到；没装时必须是**明确降级**（有理由、仍转得出文本），
#     不是静默出错。
#   · 波形：与**独立算出来的**峰值逐桶逐值比对 —— 「每条波形都是编的」是真实事故，
#     所以判据不能是"有数据"（正弦波也有）。
#   · 时间轴：段落与音频同一条时间轴、有序不重叠（双向定位的前提）；
#     搜索命中带得出 `?t=` 要用的时间点，且它落在真实段落起点上。
#
# ── 三条纪律 ────────────────────────────────────────────────────────────────────
#
#   1. **用包，不用源码树。** 用户手里是那个包，源码树跑绿证明不了它。
#      所以这个 workflow **不 `pnpm install`、不 build** —— 它只下载 artifact 然后跑。
#      驱动脚本自己不依赖任何 npm 包（WebSocket 客户端是手写的 RFC 6455）。
#   2. **屏蔽宿主 PATH，并报出借了几个。** 借了就是失败。
#   3. **每条关键断言都有变异证明。** 断言实现在 `scripts/ci/e2e-record-assertions.mjs`，
#      变异证明在 `scripts/ci/selftest-e2e-record.mjs`（已挂进 `pnpm test:ci-scripts`，
#      每次 CI 都跑）。本仓刚栽过两次坏断言：一次字段在夹具里恒为假、
#      一次盯的是"报出来的预算"而不是"实际用的预算"。
#      判据不是"我写了断言"，是"**这条断言在事实为假时真的会红**"。

name: e2e-record

# ── ⚠️ 读 `inputs.*` 之前先读这一段（#91：`schedule` 下 `default:` 不生效）──────────
#
# **已实测**（scheduled run `31526070085`，2026-08-11 首跑）：`schedule` 触发的运行里
# `inputs.*` **全是空串（len=0）** —— `workflow_dispatch` 的 `default:` **不会**应用到
# `schedule`。不用再猜，也不用再验一遍。
#
# 空值下发生的不是红，是**静默少跑 / 悄悄换模式**（跳过的步骤不会让 job 变红）。
# 所以这条腿里每一处读 `inputs.X` 的地方都必须满足一条性质：
#
#   > **`inputs` 全空时的行为，必须与 `inputs` 取各自 `default:` 时逐字相同。**
#
# 这条性质由 `scripts/ci/selftest-workflow-gates.mjs` **对每一处 `${{ }}` 求值后逐点比对**
# （不是读一遍 YAML 说没问题），挂在 `pnpm test:ci-scripts` 上 —— 少一处兜底就红。
#
# ⚠️ 布尔输入的兜底写法是 `format('{0}', inputs.X) != 'false'`，**不是** `inputs.X || true`
#    也**不是** `inputs.X != 'false'`：GitHub 的 `==` 在类型不同时把两边转成数字
#    （`'' → 0`、`false → 0`），于是 **`'' == false` 为真**，空串与"用户显式关掉"分不开；
#    而 `||` 只看真假，会把显式的 `false` 一起覆盖掉。完整推导见 `e2e-runtime.yml` 文件头。
on:
  schedule:
    # 每天 19:15 UTC。⚠️ schedule 只在**默认分支**上触发 —— 这条 cron 在 PR 上验不了，
    # 所以上面那条「空 inputs ≡ default」的性质是**合并前唯一的证据**。
    # 六条腿依次错开 15 分钟（allcomponents 18:00 / runtime 18:15 / browser 18:30 /
    # notes 18:45 / import 19:00 / record 19:15）：不是为了省钱（public 仓 $0），
    # 是别在同一时刻抢 runner 影响别人的 PR 判决。
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      # ★ 必填，且**故意不给默认值**。
      #   给一个默认 run id 只会让它慢慢过期，然后某天变成"下载失败"这种
      #   与被测对象无关的红 —— 而那种红训练所有人忽略这盏灯。
      bundleRunId:
        description: '从哪个 build-bundles run 取包（run id）。这是"用户手里那个包"的唯一来源。'
        required: true
        type: string
      legs:
        description: 'Which platform to run'
        type: choice
        required: false
        default: all
        options: [all, linux, macos, windows]

permissions:
  contents: read
  # 跨 run 下载 artifact 需要它（download-artifact 带 run-id 时走 API）
  actions: read

concurrency:
  group: e2e-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 为什么要有这个 job：**跳过的平台不许报绿** ────────────────────────────────────
  #
  # 第一版是在**每个 step** 上挂 `if: legs=='all' || legs==matrix.leg`。
  # 第一次真跑（run 31246863443，`legs=linux`）的结果是：
  #     F3 端到端（darwin-arm64）: success
  #     F3 端到端（win32-x64）  : success
  # ——**两个平台一步都没跑，却都是绿的**。那正是本仓最贵的那类失败：
  # 一盏"我什么都没做，所以我成功了"的灯。
  #
  # 修不了的原因是 `jobs.<id>.if` **拿不到 `matrix` 上下文**（只有 github/needs/vars/inputs），
  # 所以没法在 job 级别按 leg 过滤。build-bundles.yml 的办法是写三个平行 job；
  # 这里的 step 有八条，抄三份等于把同一段逻辑放三个地方漂。
  # 改成先算出矩阵：**被过滤掉的平台根本不会有 job**，于是"没跑"在界面上
  # 就是"没有这一格"，而不是一个绿勾。
  plan:
    name: 算矩阵（跳过的平台不许变成绿勾）
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          # 用 env: 传入，不把 inputs 拼进脚本正文 —— 既避免表达式注入，
          # 也不用管这台 runner 的默认 shell 是 pwsh 还是 bash。
          #
          # ⚠️ 顺带记一条实测：这几行**在 `run:` 的块标量里**，也就是说它们是
          #    shell 脚本正文，不是 YAML 注释 —— GitHub 会在这里展开表达式。
          #    原本这里写了一对**空的**定界符当例子，结果整个 workflow 被拒收：
          #    `HTTP 422 failed to parse workflow: (Line: 99, Col: 14):
          #     An expression was expected`。
          #    对照：cold-start-audit.yml 第 202 行有同样一对空定界符却没事 ——
          #    因为**它在 YAML 注释里**（`#` 顶格，属于 YAML 层），进不到表达式解析。
          #    差别只在"这个 `#` 是 YAML 的还是 shell 的"，而 YAML 解析器两边都看不出问题：
          #    `scripts/ci/lint-workflows.mjs` 照常放行（它明写自己不校验表达式）。
          node -e '
            const all = [
              { runner: "ubuntu-24.04",  label: "linux-x64",    artifact: "bundle-linux-x64",   leg: "linux"   },
              { runner: "macos-26",      label: "darwin-arm64", artifact: "bundle-darwin-arm64", leg: "macos"   },
              { runner: "windows-2025",  label: "win32-x64",    artifact: "bundle-win-x64",     leg: "windows" },
            ];
            const legs = process.env.LEGS || "all";
            const include = legs === "all" ? all : all.filter((x) => x.leg === legs);
            // 空矩阵会让下游 job 直接报错，而那与"跳过"是两回事 —— 当场说清楚
            if (include.length === 0) {
              console.error(`::error::legs=${legs} 没有匹配到任何平台`);
              process.exit(1);
            }
            console.log(`选中 ${include.length} 个平台：${include.map((x) => x.label).join(", ")}`);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          '

  e2e:
    needs: plan
    # ⚠️ runner 版本**照抄 cold-start-audit.yml 与 build-bundles.yml 现用的那三个**：
    #    ubuntu-24.04 / macos-26 / windows-2025。
    #    任务书上写的是 `macos-14`，但全仓 8 个 workflow 里 `macos-14` 一次都没出现过，
    #    而 darwin 那个包**就是在 macos-26 上编出来的**。在 macos-14 上跑它会撞上
    #    另一件事（上游预编译 dylib 的 minos 高于 14），那是
    #    `check-bundle-macos-floors.mjs` 的地界，不是 F3 的 —— 混在一起只会得到
    #    一个说不清在红什么的红。这里如实沿用仓库现状，并把这条差异写在回执里。
    name: F3 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    # fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # `submodules: recursive` **不能省**：录音要推的音频是 whisper.cpp submodule 自带的
      # `vendor/whisper.cpp/samples/jfk.wav`（真人语音，11 秒）。
      # 不带 submodule 的 checkout 下，脚本会如实报「样本不存在」然后红 ——
      # cold-start-audit.yml 已经为这条栽过一次。
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # 驱动脚本跑在**宿主** node 上；被测的 daemon 跑在**包自带的** node 上。
      # 钉住 22 与仓库其余 workflow 一致（ADR-006 决策 7）。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 装任何东西之前先记录 runner 自带什么 —— 这是"我们装上了"与"它本来就在"
      # 的唯一分界线。
      - name: 宿主基线（屏蔽之前）
        shell: bash
        run: |
          for t in ffmpeg ffprobe yt-dlp whisper-cli sox python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      # ★★ 选 run 走**共享的那一份**：`scripts/ci/resolve-bundle-run.sh`。
      #
      #   这条腿以前**只认显式传入的 `bundleRunId`**，没传就直接死在
      #   download-artifact 的 `run-id:` 上（空字符串）。那不是"安全的默认"，
      #   而是把选 run 这件事推给了人 —— 人会去 Actions 页上挑"最近一次绿的"，
      #   而 `legs=linux` 那种单腿 run **也是绿的、只有一个平台的产物**
      #   （PROTOCOL §11：「跳过」不许渲染成「成功」）。
      #
      #   现在没传就自己往回找「**带我这条腿要的那个 artifact 且没过期**」的 run，
      #   判据与另外三条 e2e 腿逐字相同（同一个脚本）。
      - name: 选定 build-bundles run
        id: runid
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundleRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # ★ 判据的对象：**用户下载的那个包**，不是这棵源码树。
      - name: 取预编译包（build-bundles run ${{ steps.runid.outputs.id }} 的 artifact）
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: incoming
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      # 解归档并定位包根 —— 走**共享脚手架**（Manager 2026-08-08 裁决）。
      #
      # 这段「挑归档 → 解开 → 找包根」四条 e2e 腿以前各写一份 bash，
      # 同一类 shell 坑撞了三次，三次都是**假红**（包是好的，脚手架把步骤带走了）。
      # 现在统一到 `scripts/ci/resolve-bundle.mjs`：用 Node 是因为病因就是
      # shell 的 glob/退出码语义，而且它能被 `selftest-resolve-bundle.mjs`
      # 在本机逐个坏输入量一遍（已挂进 `pnpm test:ci-scripts`）。
      #
      # 顺带补上两条这条腿以前没有的护栏：**两个归档并存**、**解出多个顶层目录**
      # 以前都是 `head -1` 安静挑一个 —— 那样的绿灯追溯不到它验的是谁。
      #
      # `--require` 各腿自己声明：这条腿要用包自带的 Node 起 daemon，所以两样都要。
      - name: 解开归档 + 验结构（共享脚手架）
        id: unpack
        shell: bash
        run: |
          # ⚠️ `mkdir -p unpacked` 不能省：`scripts/ci/resolve-bundle.mjs`（共享脚手架）
          #    直接 `tar -C <out>` 而**没有先建这个目录**，于是三条 e2e 腿一起红在
          #    `EXTRACT_FAILED —— tar: unpacked: Cannot open: No such file or directory`
          #    （`[CI 实测]` e2e-record run 31250861440）。
          #    这一行是我这条腿的**解堵**，不是修复 —— 真正该修的是那个脚本自己
          #    建目录（它是别人的文件，已在回执里报给 Manager）。
          #    等它修好之后这一行是无害的（`-p` 幂等），可以删。
          mkdir -p unpacked
          node scripts/ci/resolve-bundle.mjs \
            --from incoming --out unpacked \
            --require app/daemon/dist/main.js --require-node-runtime

      # 变异证明先跑：它不需要包、不需要网络，几百毫秒。
      # 放在最前面是因为 —— **断言本身失效的话，后面那一大段绿灯毫无意义**。
      - name: 断言的变异证明（每条断言在事实为假时真的会红）
        run: node scripts/ci/selftest-e2e-record.mjs

      # 预检：WebSocket 客户端 + 闸门。**20 秒，跑在重活之前。**
      #
      # 这条腿的客户端是手写的 RFC 6455（为了让整条腿不依赖 npm install）。
      # 它写错的表现是"连不上 / 收不到消息" —— 与"产品坏了"长得一模一样。
      # 先单独把它钉住，红了就知道错在这一层，而不是等 40 分钟后从下载日志里猜。
      # 顺便反向确认闸门真的在拦（Host 用域名 → 403、不带 Origin → 403），
      # 否则后面"握手成功"那条绿灯证明不了什么。
      - name: 预检：WS 客户端 + 闸门（对着包里的 daemon）
        shell: bash
        run: |
          node scripts/ci/ws-client.smoke.mjs \
            --daemon "${{ steps.unpack.outputs.bundle_dir }}/app/daemon/dist/main.js" \
            --node "${{ steps.unpack.outputs.bundle_dir }}/runtime/node${{ matrix.leg == 'windows' && '.exe' || '' }}" \
            --port 19795

      # ★ 判据本体。
      #   要真下载几百 MB（后端包 + 3 个模型 + VAD）、真推 12 秒音频、真跑 3 遍转写。
      #   macOS runner 上 tiny 转 11 秒音频实测要 ~112s（虚拟化 3 核），
      #   所以窗口给到 75 分钟。
      - name: F3 端到端（屏蔽宿主 PATH，全程走 HTTP / WebSocket）
        timeout-minutes: 75
        shell: bash
        run: |
          node scripts/ci/e2e-record.mjs \
            --bundle "${{ steps.unpack.outputs.bundle_dir }}" \
            --undecided-out "e2e-record-undecided-${{ matrix.label }}.json" \
            --port 19790

      # ★ 覆盖面（undecided 计数）单独一份 artifact，供 attest job 跨平台求和后
      # 传给 emit-e2e-attestation.mjs --undecided（照抄 e2e-runtime.yml / e2e-browser.yml
      # 的同一模式，不另发明）。
      #
      # `!cancelled()`：**失败也要传**。这是展示用的覆盖面统计，不是判定；
      # 而一次红跑的未决清单恰恰是最想看的东西（"到底是验红了，还是压根没验到"）。
      # `if-no-files-found: warn`：脚本在写这个文件之前就崩了的话（比如 --bundle
      # 指的目录不是个包，直接 exit 2），少一格由下游 sum-undecided.mjs 收敛成 null，
      # 不该在这里再红一次。
      - name: 留档（覆盖面计数）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-record-undecided-${{ matrix.label }}
          path: e2e-record-undecided-${{ matrix.label }}.json
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发一张「这条腿对着**这一批包**跑绿过」的凭证（契约见 D-17 §11）。
  #
  # 判定落在 artifact **名字** `e2e-attest-record-<bundleRunId>` 上，不在文件内容上：
  # 消费方（`release-upload.yml` 的 `e2e-gate`）只问名字在不在。名字里带 bundleRunId，
  # 所以**换一批包就是另一个名字，旧凭证自动失效** —— 在此之前，
  # 「我们跑过 e2e」是一个**没有宾语的句子**，`v0.3.0` 就是这么发出去的。
  #
  # ## 这个 job 的 `if:` 管的是**模式**，绝不是**结果**
  #
  # `needs:` 已经管住了结果：任一平台失败/取消 → 本 job 被跳过 → **凭证根本不存在**
  # （GitHub 对带 `needs` 的 job 默认要求 needs 全部 success，普通布尔表达式不会解除它）。
  # 下面那个 `if:` 只用来排除**这张凭证没有意义**的模式。
  # ⚠️ **不许在没有逐条 `needs.*.result` 检查的情况下改成 `always()` / `!cancelled()`**
  #    —— 那会解除默认的 success 要求，于是"部分跑/跑挂了"也能发出凭证。
  #    这条规则 2026-08-12 从"永远不要用"细化成了现在这句：`e2e-runtime` 的 attest
  #    **必须**用 `!cancelled()`，因为那是唯一能把 needs 的 `skipped`（变异被跳过）
  #    与 `failure`（变异红）分开对待的办法 —— 默认语义下两者都会把凭证一起跳掉。
  #    代价是那份 success 清单从**自动**变成**手写**，所以
  #    `scripts/ci/lint-workflows.mjs` 现在机械地钉着：用了状态函数，就得把
  #    `needs:` 里每一个名字的 `.result` 都写进 `if:`，漏一条就红。
  #    **这条腿今天不需要那样做**（它没有可跳过的 need），保持默认语义即可。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（三平台全跑且全绿才发）
    needs: [e2e]
    # ★★ 只有 `legs=all` 才发凭证。
    #
    #   这条腿可以只跑一个平台（`legs=linux`）。那种 run 里 `needs: [e2e]` 照样成功，
    #   但它**只验了一个平台** —— 发一张写着三平台的凭证就是假话。
    #   `plan` job 的名字已经写明「跳过的平台不许变成绿勾」，这里是同一条判据
    #   在凭证这一侧的延续。
    #
    #   ⚠️ 这里**直接绑 `inputs.bundleRunId`**，没有去读 job output：
    #      这条腿的 `bundleRunId` 是**必填无默认**的（作者写明"给默认只会让它慢慢过期"），
    #      所以输入本身就是权威值，`resolve-bundle-run.sh` 对非空入参原样回显。
    #      这样就**一行都不用改它原有的 job**。
    #
    # ★★ 第二个条件 `bundleRunId != ''`（#91 补）：**没钉批次就不发凭证**。
    #    `required: true` 只是 **dispatch 表单**上的约束，`schedule` 触发时它一个字都不管
    #    （`[实测 run 31526070085]`：schedule 下 inputs 全空）。空串会一路传到
    #    `--bundle-run ""`，让 `emit-e2e-attestation.mjs` die —— 也就是把「这次没钉批次」
    #    渲染成一个**看起来像闸门坏了**的红。写成显式的门，让它**跳过**而不是炸，
    #    并且与 `e2e-allcomponents` 那条同款规则（"自动解析的 run 不发凭证"）对齐。
    #    ⚠️ 对手动 dispatch 这一条**一个字都没改**（`required: true` 保证它非空）。
    #    ⚠️ `legs` 这一半补 `|| 'all'`，与 `plan` job 里 `LEGS || "all"` 同一口径 ——
    #       否则 schedule 下 `plan` 跑满三个平台、而这里因为 `'' != 'all'` 跳过，
    #       两处读同一个输入却给出两种默认，那种不一致迟早会被谁"顺手对齐"成错的那边。
    if: ${{ inputs.bundleRunId != '' && (inputs.legs || 'all') == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # `--expect-labels`（求和用）与 `--platforms`（写凭证用）的唯一真源
      # ——照抄 e2e-browser.yml 的同一模式。GitHub Actions 没有现成办法把上面
      # `e2e` job 的 matrix 标签自动投影进这里，所以它仍是手写的一份字符串；
      # 但**忘了跟 matrix 同步不会被静默吞掉**：`sum-undecided.mjs` 拿它跟目录里
      # 实际下到的文件做双向比对，多一格被「未预期文件」逮住、少一格被「缺失」
      # 逮住，两种都是响亮警告 + 收敛成 null，判定不受影响。
      PLATFORMS: linux-x64,darwin-arm64,win32-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ═══════════════════════════════════════════════════════════════════════════════
      # ★ `--undecided`：这条腿本轮有几条断言**跑了但什么都没证明**
      #
      # 在此之前这一格是 `null`（"这条腿还没接线"），而闸门下游
      # （`verify-e2e-attestation.mjs`）里 `null` 和 `0` 差一个字：
      # **`0` = 查过了，一条未决都没有；`null` = 没查**。六条腿全是 null 的时候，
      # 这句"跑绿过"读起来就像"全验过"。
      #
      # ## 为什么是**真的去数**，不是照 e2e-import.yml 那样写死一个 0
      #
      # import 腿写死 0 是有论证的（它把"环境没准备好"主动判成 FAIL，结构上不产生
      # 未决）。record 腿**乍看也成立**：它每一处"跳过某条断言"的分支，旁边都有一条
      # `judge(ok:false)` 判红兜着 —— 而一次判红的运行里 `needs: [e2e]` 会让本 job
      # 直接不跑，凭证根本不会发出来。也就是说"绿跑里未决恒为 0"几乎是对的。
      #
      # **几乎**。那个论证有**一个洞**，就在 `e2e-record.mjs` 的 `retranscribe()` 里：
      # 重转之后如果笔记上 `role=original` 的资产整个不见了，"重转没把原始录音弄丢"
      # 那条探针会跳过，而后面第 10 节取时长的地方有 `?? 兜底值`、不会红 ——
      # 这一轮会**绿着走完，却少验了一条**。所以这里的数**不是恒为 0**，
      # 是"通常为 0，但有一条真的能在绿跑里冒出来"。
      #
      # 更要紧的是：**"恒为 0"是一句会过期的话，而一个真的去数的管道不会。**
      # 写死 0 的话，哪天有人在脚本里加了一处新的未决，凭证还是会说 0 ——
      # 那时候这个 0 就从"我们查过"变成了"我们以为查过"。数出来的 0 不会这样烂掉。
      #
      # ## 它数的是什么、不数什么
      #
      # `e2e-record.mjs` 的台账现在有三种条目，三个互不相通的写入口：
      #   · `judge()`     → 判决，决定红绿
      #   · `undecided()` → 断言**没能被评估**（前提构造不出来）—— 只有它进这个数
      #   · `note()`      → 纯描述性观测（"流式吐了几条 partial"、"anchors 回了 200"），
      #                     本来就不是断言，**永远不计入未决**
      # 这三者以前有两类挤在同一个 `observe()` 里（都是 `ok: null`），照 `ok === null`
      # 去数会把"我记了一笔"算成"我没验到" —— **报一个虚高的未决数比不报更糟**：
      # 不报至少是诚实的空缺，虚高是一句假话。
      # ═══════════════════════════════════════════════════════════════════════════════

      # 三个矩阵格各自留的覆盖面计数（e2e-record-undecided-<label>.json），
      # merge-multiple 摊平进同一个目录 —— 与 e2e-runtime / e2e-browser 的 attest job
      # 同一个模式。
      - name: 下载三平台的覆盖面计数
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-record-undecided-*
          path: undecided
          merge-multiple: true

      # 任何一格对不上，sum-undecided.mjs 只会警告 + 把 undecided_flag 收敛成空字符串，
      # **不会**让这一步失败 —— 一个纯展示用的覆盖面统计出故障，不该连累下面
      # 「写凭证」这一步（那一步产出的 artifact 名字才是闸门真正认的信号）。
      - name: 求和覆盖面计数
        id: sum
        run: |
          node scripts/ci/sum-undecided.mjs \
            --dir undecided \
            --expect-labels "$PLATFORMS" \
            --file-template 'e2e-record-undecided-{label}.json' \
            --github-output "$GITHUB_OUTPUT"

      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg record \
            --bundle-run "${{ inputs.bundleRunId }}" \
            --platforms "$PLATFORMS" \
            ${{ steps.sum.outputs.undecided_flag }} \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-record-${{ inputs.bundleRunId }}
          path: dist/e2e-attest.json
          if-no-files-found: error
