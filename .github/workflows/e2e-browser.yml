# 真浏览器里点按钮 —— 我们缺的就是这一层。
#
# ── 为什么这条腿存在（用户 2026-08-08，真机 Windows v0.3.0）────────────────────────
#
#   > 「点击去安装模型，完全没有任何反应。」
#   > 「测速也没有任何反应。」
#
# 当时已经有四条 e2e 腿，**一条都看不见这类问题** —— 因为**它们一次都没有点过界面**。
# 全部走 HTTP：按钮死了、事件没绑上、前端抛异常，**API 照样 200、断言照样全绿**。
#
# 这是同一形状的第三次：
#   ① CI 从没执行过启动器      → v0.2.0 双击打不开
#   ② CI 从没经历过空数据目录  → 组件装不上
#   ③ **CI 从没点过一下**      → 按钮无反应
# 三次都是**判据没有对准用户真正会做的动作**。
#
# ── 判据（刻意只有一条）─────────────────────────────────────────────────────────
#
#   > **点下去要么发生该发生的事，要么给出看得懂的错误 —— 不许没有反应。**
#
# ⚠️ **刻意不追求覆盖所有页面**。贪多会让它慢到没人跑，而一条没人跑的腿等于没有。
# 先把"点击 → 有反应"这条最基本的性质钉住；它已经足够抓住用户报的那两条。
#
# ── 这条腿**做不到**什么（如实写在这里，不假装覆盖）──────────────────────────────
#
#   · 系统级权限弹窗（麦克风授权）—— 无头浏览器里被自动允许/拒绝，测不出真实体验
#   · 真实的文件选择对话框、把文件从桌面拖进来
#   · 操作系统的通知、托盘、双击启动器
#   · GPU/驱动相关的真实渲染差异
#
# 这几项要靠人工清单，见 `coordination/inbox/e2e-browser.md`。

name: e2e-browser

on:
  workflow_dispatch:
    inputs:
      # ⚠️ 拼法**照抄 `e2e-notes`**（同一个人写的另一条腿）：
      #    `assembleFromSource`(bool) + `bundleRunId`。
      #    `e2e-runtime` 用的是 `bundleSource`(choice) + `bundlesRunId`（**多一个 s**）。
      #    两套拼法并存本身就是个坑 —— 名字拼错不会报错，只会让表达式求值成空串，
      #    于是凭证名变成 `e2e-attest-browser-linux-`，消费方永远问不到，
      #    表现为"看起来已认证"的假通过。既然只能选一套，就选与我另一条腿一致的那套，
      #    并在下面把**解析后的真值**抬成 job output 再用，不直接引用输入。
      assembleFromSource:
        description: '默认 true = 用本次 checkout 现场组装跑回归门禁。设为 false 则对 bundleRunId 指定的发布产物做审计（**只有这种模式才发凭证**）。'
        required: false
        default: true
        type: boolean
      bundleRunId:
        description: '仅当 assembleFromSource=false 时有意义：对哪一次 build-bundles 的 artifact 做审计。留空 = 最近一次成功的那个。'
        required: false
        default: ''
        type: string
      diagnoseDownload:
        # ★ 一次性诊断，**刻意不进门禁**：填一个模型 id（如 asr/whisper-large-v2-q8_0）
        #   就会在下载它的整个过程里每 200ms 采一次 DOM，回答
        #   「downloading 期间百分比/字节/速度/ETA 到底有没有一个在变」。
        #   门禁腿装的是 5.3 MB 小包，`[CI 实测 run 31314976975]` 三平台**没有一个**
        #   采到「下载中」—— 窗口不够，那一位就永远答不了。
        #   留空 = 整段跳过，所以它不可能拖慢门禁。
        description: '一次性诊断：填模型 id 则在其 downloading 期间逐帧采样界面数字（留空=不跑）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    # ── 平台矩阵 ────────────────────────────────────────────────────────────────
    #
    # ⚠️ 这条腿**曾经只跑 ubuntu**，理由是「按钮有没有反应是前端代码的性质，
    #    同一份 JS 三平台一致」。那个理由**在调查阶段成立，在给用户发包的阶段不够**：
    #
    #    · 用户正在 **Windows** 上用，他报的两个死按钮就是在 Windows 上撞到的；
    #      我们修好之后**只在 Linux 上验过**。
    #    · "跨平台一致"这个假设本仓刚被打脸过：另一位在 Windows 上撞到
    #      「把路径插进 JS 字符串、`D:\a\...` 的反斜杠破坏了 require」——
    #      **Linux 和 macOS 过了是运气不是正确。**
    #    · 浏览器层同样有平台差异：字体与 DPI 影响可见性判定、路径分隔符、
    #      剪贴板权限模型、`open`/`start` 的行为。
    #
    #    所以铺开。**Windows 优先**（用户在那儿），macOS 次之。
    #
    # fail-fast: false —— 一个平台红不该掩盖另一个平台的事实。
    name: 真浏览器点按钮（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner 版本照抄 build-bundles / cold-start-audit 现用的那一组
          - { runner: windows-2025, label: win32-x64, artifact: bundle-win-x64 }
          - { runner: ubuntu-24.04, label: linux-x64, artifact: bundle-linux-x64 }
          - { runner: macos-26, label: darwin-arm64, artifact: bundle-darwin-arm64 }
    # 把**实际用到的**那一批包的 run id 抬到 job 级，供 attest 绑定。
    # ⚠️ 矩阵下 job output 由最后完成的那一格写入；这里三格解析出的是**同一个** run id
    #    （同一个输入、同一段逻辑），所以取哪一格都一样。
    outputs:
      bundle_run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ⚠️ 从这里往下，凡是 `run:` 的都显式写 `shell: bash`。
      #    Windows runner 默认是 **pwsh**，而本文件里全是 POSIX 写法 ——
      #    本仓已经为这条栽过一次（`/tmp/install.log` 被 pwsh 解析成 `D:\tmp\install.log`）。
      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm@10.15.0

      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile

      # ★ playwright 走**全局安装**，刻意不进 package.json。
      #   进 devDependencies 就要动 pnpm-lock.yaml —— 那是共享文件，
      #   而这棵树上同时有好几路 agent 在干活。版本钉死，不用 latest。
      - name: 装 playwright（不进 package.json）
        shell: bash
        run: |
          npm install -g playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium

      # 网页产物必须是**这次 checkout 编出来的**，否则点的是别人留下的旧界面。
      # CI runner 是一次性的，PROTOCOL §7 禁的是共享开发树，这里不适用。
      - name: 构建（含 apps/web/dist —— 缺了用户打开是白页）
        if: ${{ inputs.assembleFromSource }}
        shell: bash
        run: pnpm -r build

      # ── artifact 模式：对**已经发出去的那批字节**跑 ────────────────────────
      #
      # 这条腿此前**只有现组装一种模式** —— 它证明的是"这次 checkout 的界面能点"，
      # 而用户下载到的是 `build-bundles` 出的那批包。两者之间隔着整条打包流水线。
      # `v0.4.0` 就是在"界面能不能点"零证据的情况下发出去的（第五类盲区）。
      - name: 解析要用哪个 build-bundles run
        id: pick
        if: ${{ !inputs.assembleFromSource }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.bundleRunId }}
        run: |
          set -euo pipefail
          if [ -n "$WANT" ]; then
            RUN_ID="$WANT"
          else
            RUN_ID="$(gh run list --workflow=build-bundles.yml --status=success \
                        --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::找不到任何成功的 build-bundles run —— 无法取得预编译包。"
            exit 1
          fi
          # 「最近一次成功的 run」不等于「那次 run 里有我要的 artifact」：
          # 跳过 2/3 条腿的 run 其 conclusion 仍是 success（PROTOCOL §11）。
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                 --jq '.artifacts[].name' | grep -qx '${{ matrix.artifact }}'; then
            echo "::error::run $RUN_ID 里没有 ${{ matrix.artifact }} —— 多半是只跑了部分平台的 build-bundles"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' || true
            exit 1
          fi
          echo "用的 run id：$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 下载预编译包
        if: ${{ !inputs.assembleFromSource }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/bundles
          gh run download "${{ steps.pick.outputs.run_id }}" --name "${{ matrix.artifact }}" --dir dist/bundles
          ls -la dist/bundles

      # 解包走**共享脚手架**（同一类 shell 坑撞过三次之后提出来的那一份）
      - name: 解开归档 + 验结构（共享脚手架）
        id: extract
        if: ${{ !inputs.assembleFromSource }}
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from dist/bundles --out extracted \
            --require app/apps/web/dist/index.html --require-node-runtime

      # ── 判据本身 ───────────────────────────────────────────────────────────
      #
      # **空数据目录**：用户报的两个按钮都只在"还没装东西"的状态下才出现
      # （`AsrModelPicker` 只有一个 ASR 模型都没装时才渲染那个 CTA）。
      # 预装好组件再去点，那个分支根本不会出现 —— 而"CI 从没经历过空数据目录"
      # 正是本轮第二次事故的成因。脚本自己 `mkdtemp`，不碰任何既有数据目录。
      #
      # 脚本内含**变异证明**：给按钮挂一个捕获阶段的监听器让它"还在但点不动"，
      # 要求同一条断言当场变红。红不了就说明这条腿看不见问题，整步失败。
      - name: 真浏览器点按钮 + 变异证明
        timeout-minutes: 30
        shell: bash
        run: |
          # ★ 全局安装的位置**不要写死**。`[CI 实测 run 31262130079]` 我写死了
          #   /usr/lib/node_modules，而 setup-node 管理的 npm 全局前缀不在那儿，
          #   于是这条腿红在「找不到 playwright」——脚本拒绝跳过是对的（§11），
          #   但那次红是**我的路径错**，不是产品的问题。用 `npm root -g` 问出来。
          # ⚠️ Windows 上 `npm root -g` 回的是**原生路径**（`C:\npm\...`，反斜杠）。
          #    Git Bash 里拿它去 `test -d` 会失败，而 Node 本身**认正斜杠** ——
          #    所以统一转成正斜杠再用。这正是"别假设跨平台一致"的一个具体例子：
          #    同一行命令在三个平台上回的东西形状不同。
          export PLAYWRIGHT_MODULE="$(npm root -g | tr '\\' '/')/playwright"
          echo "PLAYWRIGHT_MODULE=$PLAYWRIGHT_MODULE"
          if [ ! -d "$PLAYWRIGHT_MODULE" ]; then
            echo "::error::全局 playwright 不在 $PLAYWRIGHT_MODULE"
            ls "$(npm root -g | tr '\\' '/')" || true
            exit 1
          fi
          if [ "${{ inputs.assembleFromSource }}" = "true" ]; then
            echo "== 回归门禁模式：用本次 checkout 现组装的界面 =="
            node scripts/ci/e2e-browser-audit.mjs --port 19980 \
              ${{ (inputs.diagnoseDownload != '' && matrix.label == 'win32-x64') && format('--diagnose-download {0}', inputs.diagnoseDownload) || '' }}
          else
            echo "== 发布审计模式：对 build-bundles run ${{ steps.pick.outputs.run_id }} 的包 =="
            node scripts/ci/e2e-browser-audit.mjs --port 19980 \
              --bundle "${{ steps.extract.outputs.bundle_dir }}"
          fi

      # 失败时把现场留下来 —— 「点了没反应」这类问题，事后看日志远不如看截图
      - name: 失败时留下截图
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-shots
          path: |
            /tmp/om-e2e-browser-*/shots/**
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 凭证：「这条腿对着**那一批包**跑绿过」
  #
  # 判定落在 artifact **名字**上（`emit-e2e-attestation.mjs` 的设计）：消费方
  # （`release-upload.yml` 的 `e2e-gate`）只问名字在不在，不下载、不解析、不相信内容。
  # 名字里带 bundleRunId，所以换一批包 = 换一个名字 = 旧凭证自动失效。
  #
  # ## ⚠️ 腿名从 `browser-linux` 改回 `browser` —— 一次**刻意的、可见的**扩权
  #
  # 它曾经叫 `browser-linux`，因为那时这条腿**只跑 ubuntu**，而闸门给的是
  # "这批包可以发"的保证 —— 一张叫 `browser` 的凭证读起来像"三平台都验过"。
  # **一个不说明覆盖面的凭证，会让闸门给出比实际更强的保证。**
  #
  # 现在三平台都真的跑通了（`[CI 实测 run 31295977228]` 对着
  # `build-bundles 31268366005`：win32 / linux / darwin 各 11 条断言 + 4 条变异证明、
  # 0 失败），所以名字跟着覆盖面走，改回 `browser`。
  #
  # ⚠️ **顺序不能反**：先验证、再改名。名字是对外的承诺，
  #    先改名后验证就是"先承诺再看能不能做到"。
  #    同理，将来若哪个平台掉了，名字要**跟着缩回去**。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（仅 artifact 模式，三平台全绿才发）
    needs: [browser]
    # ★ 只有 artifact 模式才发凭证：现组装的绿**不能给一批已发布的字节背书**，
    #   两者之间隔着整条 build-bundles 流水线。
    # ⚠️ 这个 `if:` 管的是**模式**，绝不是**结果**。`needs:` 已经管住了结果
    #   （带 needs 的 job 默认要求 needs 全部 success）。
    #   **永远不要改成 always() / !cancelled()** —— 那会解除默认的 success 要求，
    #   于是"部分跑/跑挂了"也能发出凭证，而这正是本机制要挡的那件事。
    if: ${{ !inputs.assembleFromSource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg browser \
            --bundle-run "${{ needs.browser.outputs.bundle_run_id }}" \
            --platforms linux-x64,darwin-arm64,win32-x64 \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-browser-${{ needs.browser.outputs.bundle_run_id }}
          path: dist/e2e-attest.json
          if-no-files-found: error
