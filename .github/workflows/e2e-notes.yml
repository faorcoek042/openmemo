# F4（思维导图）+ F5（笔记管理与检索）的端到端验收 —— **用预编译包，在三个平台上，走真 HTTP**。
#
# ── 这个 workflow 存在的理由 ────────────────────────────────────────────────────────
#
# 用户 2026-08-08 下载 v0.2.0 预编译包在真机上用，Windows 双击报错、macOS 被拦、
# 界面打不开。他的原话：
#
#   > 「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 他是对的。在此之前 CI 对 F4/F5 的覆盖只有一句话能概括：**产品能不能被脚本驱动着
# 转出一段文本**。导图生成、四种导出、增删改查、中文检索、时间点跳转 —— 一条都没有
# 在干净机器上、用预编译包、走产品自己的 HTTP 路径跑过。
#
# 所以判据从今天起只有这一条：
#
#   > **在 CI 上、用预编译包、走产品自己的 HTTP 接口，这条功能面真的能用。**
#
# ── 为什么必须先跑一遍 cold-start-audit ─────────────────────────────────────────────
#
# F4 的硬前提是「这条笔记有转写稿」（`runMindmapJob` 没有转写稿会 blocked: NO_TRANSCRIPT）。
# 造这个前提要真下载后端包与模型、真跑一次 ASR —— 而 `cold-start-audit.mjs` 已经把
# 这条路走通并守住了。**这里不另写一份。** 判据只要有两份实现就会漂成两条
# （PROTOCOL 的老规矩），而且另写一份的话，绿灯证明的是那份新脚本。
#
# 两步共用同一个 `--root`：冷启动那步把数据目录留在那儿，E2E 那步接着用。
#
# ── 为什么不许"取不到 artifact 就现场编一个" ────────────────────────────────────────
#
# 那会变成一盏假绿灯：报告上写着「预编译包验过了」，实际验的是本次 checkout 现编的东西。
# 取不到就**红**，并说清是取不到，不是功能坏了。要故意验 HEAD 的话有单独的开关，
# 而且它会在日志里大声说明本轮验的不是发布产物。

name: e2e-notes

on:
  workflow_dispatch:
    inputs:
      # ── 两种模式，用途**不同**，别把其中一种当成另一种的替身 ──────────────────────
      #
      # ① `assembleFromSource: true`（**默认**）＝ **回归门禁**
      #    用本次 checkout 现场组装一个包，再对它跑全部断言。
      #    它仍然是"预编译包"：同一个 `scripts/build-bundle.mjs` 组装、包自带的 Node 起、
      #    走产品自己的 HTTP —— 与用户下载的那个东西**同一条生产线**，只是更新。
      #
      # ② `assembleFromSource: false` ＋ `bundleRunId` ＝ **发布审计**
      #    对着某一次 build-bundles 的 artifact（用户真正下载的那个）跑同一套断言。
      #
      # ★ 为什么默认是 ①（这一条是本轮学到的，写下来免得下一个人再撞）：
      #   本轮修掉「软删之后 GET 仍回 200」之后，E2E 里多了一条
      #   「已删除的笔记必须回 404」。而 v0.2.0 那个 artifact 是**修复之前**编出来的 ——
      #   拿新断言去量旧产物，它**理应**红。
      #
      #   这不是 bug，是两件事：**「HEAD 有没有回归」和「某个已发布的包有没有这个毛病」
      #   是两个不同的问题，不该共用一个默认值。**
      #   默认取"最近一次成功的 artifact"会让门禁的含义随别人什么时候跑 build-bundles
      #   而漂移 —— 那正是本仓最怕的那种"结论取决于机器状态"。
      #
      #   所以：默认回答"HEAD 好不好"；要审计某个发布产物时，**显式**指定 run。
      #   模式 ② 对着旧包报红是**有价值的信息**（"这个发布确实带着那个毛病"），
      #   不要因为它红就去把断言删掉。
      assembleFromSource:
        description: '默认 true = 用本次 checkout 现场组装包跑回归门禁。设为 false 则改对 bundleRunId 指定的发布产物做审计。'
        required: false
        default: true
        type: boolean
      bundleRunId:
        description: '仅当 assembleFromSource=false 时有意义：对哪一次 build-bundles 的 artifact 做发布审计。留空 = 最近一次成功的那个。'
        required: false
        default: ''
        type: string

# 需要 actions: read 才能跨 workflow 下载 build-bundles 的 artifact。
# 其余一律只读：这个 workflow 不建 release、不推 commit、不改任何远端状态。
permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # 三个平台的 runner 版本**照抄 cold-start-audit.yml 现用的那一份**（ubuntu-24.04 /
    # macos-26 / windows-2025）。让两个 workflow 的平台口径分叉，等于让"某平台验过了"
    # 这句话失去意义。
    #
    # fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。中文分词这条尤其：
    # Windows 上有 `simple.dll` vs `libsimple.dll` 的命名陷阱，那一格的答案
    # **只能由 Windows 那条腿给出**。
    name: F4/F5 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # 把**实际用到的**那一批包的 run id 抬到 job 级，供下面的 attest 绑定。
    # （只在发布审计模式下有值；现场组装模式那一步被 if: 跳过，输出为空。）
    outputs:
      bundle_run_id: ${{ steps.pick.outputs.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
            }
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
            }
          - { runner: windows-2025, label: win32-x64, target: win-x64, artifact: bundle-win-x64 }
    steps:
      # submodules 不能省：冷启动那步的转写样本是 whisper.cpp 自带的
      # vendor/whisper.cpp/samples/jfk.wav。cold-start-audit.yml 已经为此栽过一次
      # （三个平台一模一样的一行「样本不存在 —— submodule 没 checkout？」）。
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 在装任何东西**之前**记录 runner 自带什么。这是"我们装上了"与"它本来就在"
      # 的唯一分界线；E2E 脚本自己也会屏蔽这些名字，但屏蔽前的基线只有这里有。
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          echo "== runner 自带的同名工具 =="
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # cold-start-audit.mjs 要用宿主 node 跑 scripts/selfcheck.mjs，并 import
      # packages/{runtime,pipeline}/dist —— 所以这些 dist 必须存在。
      # ★ `build:safe` 而不是 `pnpm -r build`：后者含 vite build（PROTOCOL §7）。
      #   这里也**不需要** apps/web/dist —— 网页 bundle 从包里来，不从这次 checkout 来。
      - name: Build（build:safe —— 不碰 apps/web/dist）
        run: pnpm build:safe

      # ── 取预编译包 ────────────────────────────────────────────────────────────
      #
      # 默认取 build-bundles 最近一次成功 run 的 artifact —— 那才是用户下载的那个东西。
      # 取不到就红，**绝不静默回落到现场组装**（那会让报告说的和实际验的是两回事）。
      - name: 解析要用哪个 build-bundles run
        id: pick
        if: ${{ !inputs.assembleFromSource }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.bundleRunId }}
        run: |
          set -euo pipefail
          # ★★ 判定「哪一次 run 里有我要的产物」**只有一份实现**：
          #    `scripts/ci/resolve-bundle-run.sh`。
          #
          #    这里以前是这段逻辑的另一份拷贝，而且是**最危险的那个版本**：
          #    它取「最近一次 success」然后只做一次存在性检查，**取不到就红**。
          #    `[实测 run 31249135458]` 那一次三条腿里两条 skipped（只跑了 macOS），
          #    conclusion 照样 success —— 于是这条腿在 linux/win 上稳定红，
          #    而那个红读起来像"包坏了"，其实是"取包这一步选错了 run"。
          #
          #    共享脚本的判据是「**这次 run 里有我要的 artifact，且没过期**」，
          #    并且会**往回找**而不是认死最近一次：一次只跑单平台的 run 不该
          #    连累另外两个平台的 e2e。
          #    （PROTOCOL §11：「跳过」不许渲染成「成功」——
          #      所以不能拿 conclusion 当判据，要拿产物本身当判据。）
          RUN_ID=$(bash scripts/ci/resolve-bundle-run.sh "${{ matrix.artifact }}" "$WANT")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 下载预编译包 artifact
        if: ${{ !inputs.assembleFromSource }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/bundles
          gh run download "${{ steps.pick.outputs.run_id }}" \
            --name "${{ matrix.artifact }}" --dir dist/bundles
          echo "== 取回来的东西 =="
          ls -la dist/bundles

      # 现场组装：只有显式打开 assembleFromSource 才走这条，而且大声说明后果。
      - name: （备选）现场组装一个包 —— 本轮验的不是发布产物
        id: assemble
        if: ${{ inputs.assembleFromSource }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::assembleFromSource=true —— 本轮验的是本次 checkout 现编的包，不是 build-bundles 发出去的那个。"
          pnpm --filter @openmemo/web build
          # ⚠️ **不要给 `--out` 传相对路径。** `[CI 实测 run 31250696962]` 三平台全红在
          #   `tar -cJf bundle-artifact/... openmemo-...`：`build-bundle.mjs` 归档那一步是
          #   `execFileAsync('tar', [flag, out, NAME], { cwd: OUT_ROOT })` —— `cwd` 已经切进
          #   `OUT_ROOT`，而 `out` 仍是相对 `OUT_ROOT` 拼出来的，于是 tar 去找
          #   `bundle-artifact/bundle-artifact/...`，目录不存在。
          #   那是 `build-bundle.mjs` 的一个潜伏 bug（**不是我的文件，没动它**），
          #   用默认 `dist/bundles` 就绕开了：共享脚手架本来就吃得下"归档旁边有暂存目录"
          #   （selftest 的 A2 就是这个形状）。
          node scripts/build-bundle.mjs --target "${{ matrix.target }}"
          ls -la dist/bundles

      # ── 解开归档 + 验结构：走**共享脚手架** ───────────────────────────────────
      #
      # 「挑归档 → 解开 → 找包根 → 验结构」这段，四条 e2e 腿以前各写一份 bash，
      # 同一类 shell 坑**撞了三次**（`ls` 多 glob 在 `set -e` 下的退出码 ×2、
      # `cp` 被暂存目录噎住 ×1），三次都是**假红**：包好好地打出来了，
      # 是脚手架自己把步骤带走了。Manager 2026-08-08 裁决：提成共享的一份。
      #
      # 用 Node 而不是 bash/composite action，理由见 `resolve-bundle.mjs` 文件头 ——
      # 一句话：**病因就是 shell 的 glob/退出码语义**，换掉它这一整类 bug 才消失；
      # 而且 `scripts/ci/` 下的脚本能被 `selftest-resolve-bundle.mjs` 在本机
      # 逐个坏输入量一遍，并挂进 `pnpm test:ci-scripts`——composite action 里的 bash 不能。
      #
      # `--require` 是**各腿自己声明**的：这条腿要用包自带的 Node 起 daemon，
      # 所以两样都要。不替别的腿猜。
      - name: 解开归档 + 验结构（共享脚手架）
        id: extract
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from dist/bundles --out extracted \
            --require app/daemon/dist/main.js --require-node-runtime

      # ── 把包里的 ext/ 摊开 ────────────────────────────────────────────────────
      #
      # 这一步只观测、不判红绿，但它回答的是本轮最容易静默坏的那个问题：
      # Windows 上上游归档里叫 `simple.dll`（MSVC 不加 lib 前缀），而加载侧
      # `defaultExtensionPaths()` 找的是 `libsimple.dll`。这一格错了的后果**不是报错，
      # 是中文两字词搜索静默返回 0 条**。判红绿的是 E2E 脚本里那条真搜索，
      # 这里只是把现场留给下一个人看。
      - name: 包里的 ext/ 实况（libsimple 命名陷阱的现场）
        shell: bash
        run: |
          echo "== ${{ steps.extract.outputs.bundle_dir }}/ext =="
          ls -la "${{ steps.extract.outputs.bundle_dir }}/ext" || echo "(没有 ext 目录)"
          echo
          echo "== runtime/ =="
          ls -la "${{ steps.extract.outputs.bundle_dir }}/runtime" || true

      # ── 前置：真下载后端包与模型、真转写一次 ─────────────────────────────────
      #
      # 这一步跑的是**别人已经守住的那套判据**（屏蔽宿主 PATH + 真下载 + 真转写出
      # 非空文本），不是我另写的。它同时把 F4 的硬前提造出来：一条带转写稿的笔记。
      # `--root` 显式给死，下一步接着用同一个数据目录。
      - name: 前置：冷启动 + 真转写（造出 F4 需要的转写稿）
        timeout-minutes: 60
        shell: bash
        run: |
          node scripts/ci/cold-start-audit.mjs \
            --bundle "${{ steps.extract.outputs.bundle_dir }}" \
            --root "${{ runner.temp }}/e2e-notes-shared" \
            --port 19700 --transcribe

      # ── 判据本身 ─────────────────────────────────────────────────────────────
      #
      # F4：真走 OpenAI 兼容链路生成导图（对面是本地假端点 —— 不花用户一分钱，
      #     产品侧一段不绕）、可编辑、四种导出各自真发 HTTP 拿回正文并断言内容。
      # F5：增删改查、文件夹筛选、星标 + 分页边界（真造 56 条跨过第 50 条）、
      #     中文两字词检索、?t= 的服务端半条链。
      # 每条关键断言都配一条变异证明；最后另起一个没有 libsimple 的实例，
      # 要求同一条中文检索断言**变红**。
      - name: F4/F5 端到端（预编译包 + 真 HTTP + 变异证明）
        timeout-minutes: 45
        shell: bash
        run: |
          node scripts/ci/e2e-notes-audit.mjs \
            --bundle "${{ steps.extract.outputs.bundle_dir }}" \
            --data-dir "${{ runner.temp }}/e2e-notes-shared/data" \
            --port 19960 --llm-port 19961 --mutation-port 19970

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发一张「这条腿对着**这一批包**跑绿过」的凭证（契约见 D-17 §11）。
  #
  # 判定落在 artifact **名字** `e2e-attest-notes-<bundleRunId>` 上，不在文件内容上：
  # 消费方（`release-upload.yml` 的 `e2e-gate`）只问名字在不在。名字里带 bundleRunId，
  # 所以**换一批包就是另一个名字，旧凭证自动失效** —— 在此之前，
  # 「我们跑过 e2e」是一个**没有宾语的句子**，`v0.3.0` 就是这么发出去的。
  #
  # ## 这个 job 的 `if:` 管的是**模式**，绝不是**结果**
  #
  # `needs:` 已经管住了结果：任一平台失败/取消 → 本 job 被跳过 → **凭证根本不存在**
  # （GitHub 对带 `needs` 的 job 默认要求 needs 全部 success，普通布尔表达式不会解除它）。
  # 下面那个 `if:` 只用来排除**这张凭证没有意义**的模式。
  # ⚠️ **永远不要把它改成 `always()` / `!cancelled()`** —— 那会解除默认的 success 要求，
  #    于是"部分跑"也能发出凭证，而这正是本机制要挡的那件事。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（仅发布审计模式，三平台全绿才发）
    needs: [e2e]
    # ★★ 只有**发布审计**模式才发凭证。
    #
    #   `assembleFromSource=true`（默认）跑的是**本次 checkout 现场组装**的包 ——
    #   那是回归门禁，证明的是"当前代码组装出来的东西好"。
    #   它**不能给一批已经发布的包背书**：两者根本不是同一堆字节。
    #   拿现场组装的绿去发凭证，等于让闸门相信一件它没验过的事 ——
    #   而这个闸门存在的全部理由就是挡住这种"看起来验过了"。
    if: ${{ !inputs.assembleFromSource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg notes \
            --bundle-run "${{ needs.e2e.outputs.bundle_run_id }}" \
            --platforms linux-x64,darwin-arm64,win32-x64 \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-notes-${{ needs.e2e.outputs.bundle_run_id }}
          path: dist/e2e-attest.json
          if-no-files-found: error
