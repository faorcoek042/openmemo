# F4（思维导图）+ F5（笔记管理与检索）的端到端验收 —— **用预编译包，在三个平台上，走真 HTTP**。
#
# ── 这个 workflow 存在的理由 ────────────────────────────────────────────────────────
#
# 用户 2026-08-08 下载 v0.2.0 预编译包在真机上用，Windows 双击报错、macOS 被拦、
# 界面打不开。他的原话：
#
#   > 「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 他是对的。在此之前 CI 对 F4/F5 的覆盖只有一句话能概括：**产品能不能被脚本驱动着
# 转出一段文本**。导图生成、四种导出、增删改查、中文检索、时间点跳转 —— 一条都没有
# 在干净机器上、用预编译包、走产品自己的 HTTP 路径跑过。
#
# 所以判据从今天起只有这一条：
#
#   > **在 CI 上、用预编译包、走产品自己的 HTTP 接口，这条功能面真的能用。**
#
# ── 为什么必须先跑一遍 cold-start-audit ─────────────────────────────────────────────
#
# F4 的硬前提是「这条笔记有转写稿」（`runMindmapJob` 没有转写稿会 blocked: NO_TRANSCRIPT）。
# 造这个前提要真下载后端包与模型、真跑一次 ASR —— 而 `cold-start-audit.mjs` 已经把
# 这条路走通并守住了。**这里不另写一份。** 判据只要有两份实现就会漂成两条
# （PROTOCOL 的老规矩），而且另写一份的话，绿灯证明的是那份新脚本。
#
# 两步共用同一个 `--root`：冷启动那步把数据目录留在那儿，E2E 那步接着用。
#
# ── 为什么不许"取不到 artifact 就现场编一个" ────────────────────────────────────────
#
# 那会变成一盏假绿灯：报告上写着「预编译包验过了」，实际验的是本次 checkout 现编的东西。
# 取不到就**红**，并说清是取不到，不是功能坏了。要故意验 HEAD 的话有单独的开关，
# 而且它会在日志里大声说明本轮验的不是发布产物。

name: e2e-notes

# ── ⚠️ 读 `inputs.*` 之前先读这一段（#91：`schedule` 下 `default:` 不生效）──────────
#
# **已实测**（scheduled run `31526070085`，2026-08-11 首跑）：`schedule` 触发的运行里
# `inputs.*` **全是空串（len=0）** —— `workflow_dispatch` 的 `default:` **不会**应用到
# `schedule`。不用再猜，也不用再验一遍。
#
# 空值下发生的不是红，是**静默少跑 / 悄悄换模式**（跳过的步骤不会让 job 变红）。
# 所以这条腿里每一处读 `inputs.X` 的地方都必须满足一条性质：
#
#   > **`inputs` 全空时的行为，必须与 `inputs` 取各自 `default:` 时逐字相同。**
#
# 这条性质由 `scripts/ci/selftest-workflow-gates.mjs` **对每一处 `${{ }}` 求值后逐点比对**
# （不是读一遍 YAML 说没问题），挂在 `pnpm test:ci-scripts` 上 —— 少一处兜底就红。
#
# ⚠️ 布尔输入的兜底写法是 `format('{0}', inputs.X) != 'false'`，**不是** `inputs.X || true`
#    也**不是** `inputs.X != 'false'`：GitHub 的 `==` 在类型不同时把两边转成数字
#    （`'' → 0`、`false → 0`），于是 **`'' == false` 为真**，空串与"用户显式关掉"分不开；
#    而 `||` 只看真假，会把显式的 `false` 一起覆盖掉。完整推导见 `e2e-runtime.yml` 文件头。
on:
  schedule:
    # 每天 18:45 UTC。⚠️ schedule 只在**默认分支**上触发 —— 这条 cron 在 PR 上验不了，
    # 所以上面那条「空 inputs ≡ default」的性质是**合并前唯一的证据**。
    # 六条腿依次错开 15 分钟（allcomponents 18:00 / runtime 18:15 / browser 18:30 /
    # notes 18:45 / import 19:00 / record 19:15）：不是为了省钱（public 仓 $0），
    # 是别在同一时刻抢 runner 影响别人的 PR 判决。
    - cron: '45 18 * * *'
  workflow_dispatch:
    inputs:
      # ── 两种模式，用途**不同**，别把其中一种当成另一种的替身 ──────────────────────
      #
      # ① `assembleFromSource: true`（**默认**）＝ **回归门禁**
      #    用本次 checkout 现场组装一个包，再对它跑全部断言。
      #    它仍然是"预编译包"：同一个 `scripts/build-bundle.mjs` 组装、包自带的 Node 起、
      #    走产品自己的 HTTP —— 与用户下载的那个东西**同一条生产线**，只是更新。
      #
      # ② `assembleFromSource: false` ＋ `bundleRunId` ＝ **发布审计**
      #    对着某一次 build-bundles 的 artifact（用户真正下载的那个）跑同一套断言。
      #
      # ★ 为什么默认是 ①（这一条是本轮学到的，写下来免得下一个人再撞）：
      #   本轮修掉「软删之后 GET 仍回 200」之后，E2E 里多了一条
      #   「已删除的笔记必须回 404」。而 v0.2.0 那个 artifact 是**修复之前**编出来的 ——
      #   拿新断言去量旧产物，它**理应**红。
      #
      #   这不是 bug，是两件事：**「HEAD 有没有回归」和「某个已发布的包有没有这个毛病」
      #   是两个不同的问题，不该共用一个默认值。**
      #   默认取"最近一次成功的 artifact"会让门禁的含义随别人什么时候跑 build-bundles
      #   而漂移 —— 那正是本仓最怕的那种"结论取决于机器状态"。
      #
      #   所以：默认回答"HEAD 好不好"；要审计某个发布产物时，**显式**指定 run。
      #   模式 ② 对着旧包报红是**有价值的信息**（"这个发布确实带着那个毛病"），
      #   不要因为它红就去把断言删掉。
      assembleFromSource:
        description: '默认 true = 用本次 checkout 现场组装包跑回归门禁。设为 false 则改对 bundleRunId 指定的发布产物做审计。'
        required: false
        default: true
        type: boolean
      bundleRunId:
        description: '仅当 assembleFromSource=false 时有意义：对哪一次 build-bundles 的 artifact 做发布审计。留空 = 最近一次成功的那个。'
        required: false
        default: ''
        type: string

# 需要 actions: read 才能跨 workflow 下载 build-bundles 的 artifact。
# 其余一律只读：这个 workflow 不建 release、不推 commit、不改任何远端状态。
permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # 三个平台的 runner 版本**照抄 cold-start-audit.yml 现用的那一份**（ubuntu-24.04 /
    # macos-26 / windows-2025）。让两个 workflow 的平台口径分叉，等于让"某平台验过了"
    # 这句话失去意义。
    #
    # fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。中文分词这条尤其：
    # Windows 上有 `simple.dll` vs `libsimple.dll` 的命名陷阱，那一格的答案
    # **只能由 Windows 那条腿给出**。
    name: F4/F5 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # 把**实际用到的**那一批包的 run id 抬到 job 级，供下面的 attest 绑定。
    # （只在发布审计模式下有值；现场组装模式那一步被 if: 跳过，输出为空。）
    outputs:
      bundle_run_id: ${{ steps.pick.outputs.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-24.04,
              label: linux-x64,
              target: linux-x64,
              artifact: bundle-linux-x64,
            }
          - {
              runner: macos-26,
              label: darwin-arm64,
              target: darwin-arm64,
              artifact: bundle-darwin-arm64,
            }
          - { runner: windows-2025, label: win32-x64, target: win-x64, artifact: bundle-win-x64 }
    steps:
      # submodules 不能省：冷启动那步的转写样本是 whisper.cpp 自带的
      # vendor/whisper.cpp/samples/jfk.wav。cold-start-audit.yml 已经为此栽过一次
      # （三个平台一模一样的一行「样本不存在 —— submodule 没 checkout？」）。
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 在装任何东西**之前**记录 runner 自带什么。这是"我们装上了"与"它本来就在"
      # 的唯一分界线；E2E 脚本自己也会屏蔽这些名字，但屏蔽前的基线只有这里有。
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          echo "== runner 自带的同名工具 =="
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # cold-start-audit.mjs 要用宿主 node 跑 scripts/selfcheck.mjs，并 import
      # packages/{runtime,pipeline}/dist —— 所以这些 dist 必须存在。
      # ★ `build:safe` 而不是 `pnpm -r build`：后者含 vite build（PROTOCOL §7）。
      #   这里也**不需要** apps/web/dist —— 网页 bundle 从包里来，不从这次 checkout 来。
      - name: Build（build:safe —— 不碰 apps/web/dist）
        run: pnpm build:safe

      # ── 取预编译包 ────────────────────────────────────────────────────────────
      #
      # 默认取 build-bundles 最近一次成功 run 的 artifact —— 那才是用户下载的那个东西。
      # 取不到就红，**绝不静默回落到现场组装**（那会让报告说的和实际验的是两回事）。
      - name: 解析要用哪个 build-bundles run
        id: pick
        if: ${{ format('{0}', inputs.assembleFromSource) == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.bundleRunId }}
        run: |
          set -euo pipefail
          # ★★ 判定「哪一次 run 里有我要的产物」**只有一份实现**：
          #    `scripts/ci/resolve-bundle-run.sh`。
          #
          #    这里以前是这段逻辑的另一份拷贝，而且是**最危险的那个版本**：
          #    它取「最近一次 success」然后只做一次存在性检查，**取不到就红**。
          #    `[实测 run 31249135458]` 那一次三条腿里两条 skipped（只跑了 macOS），
          #    conclusion 照样 success —— 于是这条腿在 linux/win 上稳定红，
          #    而那个红读起来像"包坏了"，其实是"取包这一步选错了 run"。
          #
          #    共享脚本的判据是「**这次 run 里有我要的 artifact，且没过期**」，
          #    并且会**往回找**而不是认死最近一次：一次只跑单平台的 run 不该
          #    连累另外两个平台的 e2e。
          #    （PROTOCOL §11：「跳过」不许渲染成「成功」——
          #      所以不能拿 conclusion 当判据，要拿产物本身当判据。）
          RUN_ID=$(bash scripts/ci/resolve-bundle-run.sh "${{ matrix.artifact }}" "$WANT")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 下载预编译包 artifact
        if: ${{ format('{0}', inputs.assembleFromSource) == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/bundles
          gh run download "${{ steps.pick.outputs.run_id }}" \
            --name "${{ matrix.artifact }}" --dir dist/bundles
          echo "== 取回来的东西 =="
          ls -la dist/bundles

      # 现场组装：只有显式打开 assembleFromSource 才走这条，而且大声说明后果。
      - name: （备选）现场组装一个包 —— 本轮验的不是发布产物
        id: assemble
        if: ${{ format('{0}', inputs.assembleFromSource) != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::assembleFromSource=true —— 本轮验的是本次 checkout 现编的包，不是 build-bundles 发出去的那个。"
          pnpm --filter @openmemo/web build
          # ⚠️ **不要给 `--out` 传相对路径。** `[CI 实测 run 31250696962]` 三平台全红在
          #   `tar -cJf bundle-artifact/... openmemo-...`：`build-bundle.mjs` 归档那一步是
          #   `execFileAsync('tar', [flag, out, NAME], { cwd: OUT_ROOT })` —— `cwd` 已经切进
          #   `OUT_ROOT`，而 `out` 仍是相对 `OUT_ROOT` 拼出来的，于是 tar 去找
          #   `bundle-artifact/bundle-artifact/...`，目录不存在。
          #   那是 `build-bundle.mjs` 的一个潜伏 bug（**不是我的文件，没动它**），
          #   用默认 `dist/bundles` 就绕开了：共享脚手架本来就吃得下"归档旁边有暂存目录"
          #   （selftest 的 A2 就是这个形状）。
          node scripts/build-bundle.mjs --target "${{ matrix.target }}"
          ls -la dist/bundles

      # ── 解开归档 + 验结构：走**共享脚手架** ───────────────────────────────────
      #
      # 「挑归档 → 解开 → 找包根 → 验结构」这段，四条 e2e 腿以前各写一份 bash，
      # 同一类 shell 坑**撞了三次**（`ls` 多 glob 在 `set -e` 下的退出码 ×2、
      # `cp` 被暂存目录噎住 ×1），三次都是**假红**：包好好地打出来了，
      # 是脚手架自己把步骤带走了。Manager 2026-08-08 裁决：提成共享的一份。
      #
      # 用 Node 而不是 bash/composite action，理由见 `resolve-bundle.mjs` 文件头 ——
      # 一句话：**病因就是 shell 的 glob/退出码语义**，换掉它这一整类 bug 才消失；
      # 而且 `scripts/ci/` 下的脚本能被 `selftest-resolve-bundle.mjs` 在本机
      # 逐个坏输入量一遍，并挂进 `pnpm test:ci-scripts`——composite action 里的 bash 不能。
      #
      # `--require` 是**各腿自己声明**的：这条腿要用包自带的 Node 起 daemon，
      # 所以两样都要。不替别的腿猜。
      - name: 解开归档 + 验结构（共享脚手架）
        id: extract
        shell: bash
        run: |
          node scripts/ci/resolve-bundle.mjs \
            --from dist/bundles --out extracted \
            --require app/daemon/dist/main.js --require-node-runtime

      # ── 把包里的 ext/ 摊开 ────────────────────────────────────────────────────
      #
      # 这一步只观测、不判红绿，但它回答的是本轮最容易静默坏的那个问题：
      # Windows 上上游归档里叫 `simple.dll`（MSVC 不加 lib 前缀），而加载侧
      # `defaultExtensionPaths()` 找的是 `libsimple.dll`。这一格错了的后果**不是报错，
      # 是中文两字词搜索静默返回 0 条**。判红绿的是 E2E 脚本里那条真搜索，
      # 这里只是把现场留给下一个人看。
      - name: 包里的 ext/ 实况（libsimple 命名陷阱的现场）
        shell: bash
        run: |
          echo "== ${{ steps.extract.outputs.bundle_dir }}/ext =="
          ls -la "${{ steps.extract.outputs.bundle_dir }}/ext" || echo "(没有 ext 目录)"
          echo
          echo "== runtime/ =="
          ls -la "${{ steps.extract.outputs.bundle_dir }}/runtime" || true

      # ── 前置：真下载后端包与模型、真转写一次 ─────────────────────────────────
      #
      # 这一步跑的是**别人已经守住的那套判据**（屏蔽宿主 PATH + 真下载 + 真转写出
      # 非空文本），不是我另写的。它同时把 F4 的硬前提造出来：一条带转写稿的笔记。
      # `--root` 显式给死，下一步接着用同一个数据目录。
      # `--allow-known-gaps`：只在**发布审计**模式（!assembleFromSource）传 ——
      # 那种模式下 --bundle 指向一次更早冻结下来的 build-bundles artifact，而
      # cold-start-audit.mjs 调用的 selfcheck.mjs 永远是本次 checkout 的 HEAD，
      # 二者结构性地不该逐 id 同源（新 check id 老 artifact 天生吐不出来）。
      # 回归门禁模式（assembleFromSource=true）下 --bundle 也是本次现场组装的，
      # 理应同源，不传这个开关 —— meta.sameSource 仍是无豁免的硬判据。
      # 见 scripts/ci/selfcheck-known-gaps.json 文件头。
      - name: 前置：冷启动 + 真转写（造出 F4 需要的转写稿）
        timeout-minutes: 60
        shell: bash
        run: |
          node scripts/ci/cold-start-audit.mjs \
            --bundle "${{ steps.extract.outputs.bundle_dir }}" \
            --root "${{ runner.temp }}/e2e-notes-shared" \
            --port 19700 --transcribe \
            ${{ format('{0}', inputs.assembleFromSource) == 'false' && '--allow-known-gaps' || '' }}

      # ── 判据本身 ─────────────────────────────────────────────────────────────
      #
      # F4：真走 OpenAI 兼容链路生成导图（对面是本地假端点 —— 不花用户一分钱，
      #     产品侧一段不绕）、可编辑、四种导出各自真发 HTTP 拿回正文并断言内容。
      # F5：增删改查、文件夹筛选、星标 + 分页边界（真造 56 条跨过第 50 条）、
      #     中文两字词检索、?t= 的服务端半条链。
      # 每条关键断言都配一条变异证明；最后另起一个没有 libsimple 的实例，
      # 要求同一条中文检索断言**变红**。
      - name: F4/F5 端到端（预编译包 + 真 HTTP + 变异证明）
        timeout-minutes: 45
        shell: bash
        run: |
          node scripts/ci/e2e-notes-audit.mjs \
            --bundle "${{ steps.extract.outputs.bundle_dir }}" \
            --data-dir "${{ runner.temp }}/e2e-notes-shared/data" \
            --port 19960 --llm-port 19961 --mutation-port 19970 \
            --undecided-out "e2e-notes-undecided-${{ matrix.label }}.json"

      # ★ 覆盖面（undecided 计数）单独一份 artifact，供 attest job 跨平台求和后
      # 传给 emit-e2e-attestation.mjs --undecided（照抄 e2e-browser.yml 的同一模式）。
      #
      # 无条件上传、**失败也传**：这是覆盖面统计不是判定。判定早已由 `needs: [e2e]`
      # 管住 —— 红的 run 里 attest 作业根本不跑，这份文件也就没人读。
      # 而红的 run 里**照样落盘**是有意的：它让「这一轮到底有几条没验到」在事后
      # 读日志时说得出来，而不是只剩一句"红了"。
      - name: 留档（覆盖面计数）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-notes-undecided-${{ matrix.label }}
          path: e2e-notes-undecided-${{ matrix.label }}.json
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发一张「这条腿对着**这一批包**跑绿过」的凭证（契约见 D-17 §11）。
  #
  # 判定落在 artifact **名字** `e2e-attest-notes-<bundleRunId>` 上，不在文件内容上：
  # 消费方（`release-upload.yml` 的 `e2e-gate`）只问名字在不在。名字里带 bundleRunId，
  # 所以**换一批包就是另一个名字，旧凭证自动失效** —— 在此之前，
  # 「我们跑过 e2e」是一个**没有宾语的句子**，`v0.3.0` 就是这么发出去的。
  #
  # ## 这个 job 的 `if:` 管的是**模式**，绝不是**结果**
  #
  # `needs:` 已经管住了结果：任一平台失败/取消 → 本 job 被跳过 → **凭证根本不存在**
  # （GitHub 对带 `needs` 的 job 默认要求 needs 全部 success，普通布尔表达式不会解除它）。
  # 下面那个 `if:` 只用来排除**这张凭证没有意义**的模式。
  # ⚠️ **不许在没有逐条 `needs.*.result` 检查的情况下改成 `always()` / `!cancelled()`**
  #    —— 那会解除默认的 success 要求，于是"部分跑/跑挂了"也能发出凭证。
  #    这条规则 2026-08-12 从"永远不要用"细化成了现在这句：`e2e-runtime` 的 attest
  #    **必须**用 `!cancelled()`，因为那是唯一能把 needs 的 `skipped`（变异被跳过）
  #    与 `failure`（变异红）分开对待的办法 —— 默认语义下两者都会把凭证一起跳掉。
  #    代价是那份 success 清单从**自动**变成**手写**，所以
  #    `scripts/ci/lint-workflows.mjs` 现在机械地钉着：用了状态函数，就得把
  #    `needs:` 里每一个名字的 `.result` 都写进 `if:`，漏一条就红。
  #    **这条腿今天不需要那样做**（它没有可跳过的 need），保持默认语义即可。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（仅发布审计模式，三平台全绿才发）
    needs: [e2e]
    # ★★ 只有**发布审计**模式才发凭证。
    #
    #   `assembleFromSource=true`（默认）跑的是**本次 checkout 现场组装**的包 ——
    #   那是回归门禁，证明的是"当前代码组装出来的东西好"。
    #   它**不能给一批已经发布的包背书**：两者根本不是同一堆字节。
    #   拿现场组装的绿去发凭证，等于让闸门相信一件它没验过的事 ——
    #   而这个闸门存在的全部理由就是挡住这种"看起来验过了"。
    # ★★ 第二个条件 `bundleRunId != ''`（#91 补，**这是一次有意的收紧**）：
    #    **没钉批次就不发凭证。**
    #
    #    这条腿的 `bundleRunId` 是**可选**的，留空时三个平台各自去解析"最近一次带本平台
    #    产物的成功 run"，完全可能落到**不同批**的包上；而凭证名只取
    #    `needs.<job>.outputs.bundle_run_id` **一个**值（矩阵 job 的 output 由最后完成的
    #    那一格写入，没有任何一致性保证）。于是留空跑出来的凭证会写着"三平台验过 run X"，
    #    而其中某些平台验的根本不是 X —— **那不是覆盖面不足，那是伪证**。
    #    与 `e2e-allcomponents` 拒绝为自动解析的 run 发凭证是同一条判据。
    #
    #    ⚠️ 代价：`assembleFromSource=false` 但不给 `bundleRunId` 的跑法，从此不发凭证。
    #       `verify-e2e-attestation.mjs` 的 DISPATCH_HINT 给的命令本来就钉批次。
    if: >-
      ${{ format('{0}', inputs.assembleFromSource) == 'false'
      && inputs.bundleRunId != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # ★ `--expect-labels`（求和用）与 `--platforms`（写凭证用）的唯一真源：两处都从
      #   这一个变量取值，照抄 e2e-browser.yml / e2e-runtime.yml 的同一模式。
      #   加/删平台要跟上面 matrix 手动同步 —— 但忘了同步**不会被静默吞掉**：
      #   `sum-undecided.mjs` 拿 `--expect-labels` 跟目录里实际下到的文件做双向比对，
      #   多一格被「未预期文件」逮住、少一格被「缺失」逮住，两种都是响亮警告 +
      #   收敛成 null，绝不悄悄少算。
      #   ⚠️ 此前这里是写死的 `--platforms linux-x64,darwin-arm64,win32-x64`，
      #      与 matrix 是两份手抄。收成一份不改变判定，只是少一处会漂的地方。
      PLATFORMS: linux-x64,darwin-arm64,win32-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # ═══════════════════════════════════════════════════════════════════════════════
      # ★ 覆盖面这一格：**曾经写死 `--undecided 0`，现在真的去数**
      #
      # 闸门下游（`verify-e2e-attestation.mjs`）把三种取值说成三句不同的话：
      # **`0` = 查过了，一条未决都没有；`null` = 这条腿还没接线；`N` = 有 N 条没验到**。
      #
      # ## 那个写死的 0 **曾经**是对的（#77 的论证，原样留着 —— 删说法不删事实）
      #
      # 因为那时**这条腿结构上没有第三态可数**。`e2e-notes-audit.mjs` 的总表只有五种
      # 状态（PASS / FAIL / MUT-OK / MUT-BAD / ABORTED），**没有一种表示「跑了但
      # 什么都没证明」**。每一处「前提在这台 runner 上构造不出来」都被**主动换成了
      # FAIL**，当时逐条核过：
      #
      #   · 第 3 节数据目录里没有带转写稿的笔记 → `throw`（文件头 §75 明写
      #     「当场红并说清是前置步骤没跑，**不假装跳过**」）
      #   · 转写稿是空的 → `ok(trSegs.length > 0, …)` 抛
      #   · 第 11 节从转写稿里挑不出探针词 → F5-e1／F5-e2 的 `ok()` 抛
      #   · 「非空虚前提」在本文件里是**一等公民**：删除前搜得到、starred 总数真的
      #     超过一页、tool.* 自检项非空 —— 每一条空集都有一条会红的守卫兜着，
      #     而不是空集判通过
      #
      # 而一条判红的腿，`needs: [e2e]` 会让本 attest 作业**直接不跑**。所以当时不存在
      # 「三平台都绿、但暗地里有几条没验到」这种需要 undecided 去描述的状态。
      # 上面这些事实**今天仍然成立**：`check()` 那一侧一个字都没变。
      #
      # ## 🔴 **它从什么时候起不再成立**：#64 的后续，`mutation()` 开始产出 `MUT-UNKNOWN`
      #
      # 当年那段论证自己写过一句预言：
      #
      #   > 只要有人给 `results` 加一个新状态来表示「这条断言没能被评估」，这个 0 就
      #   > 变成假话。（「恒为 0」是一句会过期的话；一条会红的断言不会。）
      #
      # **那一天到了。** 但要说清它**实际是怎么被发现的** —— 因为这里曾经写着
      # 「那根桩（出现计划外 status 就当场红）正是为此立的，**它按设计工作了**」，
      # 而那是一句**假话**，就躺在它自己要订正的那段论证旁边：
      #
      #   🔴 **那根桩结构上不可能判红。** `MUT-UNKNOWN` 进 `results` 和它进
      #   `KNOWN_STATUSES` 是**同一个 commit**（`2266899`）里的两行 ——
      #   之前的树上没有这个状态、之后的树上它已被登记，
      #   `unexpectedStatuses` 在**任何存在过的树上都是空集**。它一次都没响过。
      #
      # 真实发生的是：#64 的作者**读到了那段散文**、把它写进 commit 正文
      # （「⚠️ e2e-notes-audit.mjs 没动 —— 它需要一次单独裁决」）、把 notes 留给下一轮。
      # ⇒ **那根桩起的是路标的作用，不是警报的作用。**
      #
      # 这不是说它没用 —— **一段让下一个人停下来看一眼的散文，本身就有价值**，
      # 这一次它确实起了作用。只是别把"有人读到了"说成"守卫响了"：
      # 前者靠的是人还在读注释，后者才是机器兜底。**两者的可靠性不是一回事。**
      #
      # 触发它的改动：`mutation()` 不再把**任何**抛出读成「如期变红」。Playwright/HTTP
      # 超时、daemon 抖动、端口被抢 —— 这些「腿自己炸了」的抛出此前冒充「断言有牙齿」
      # （browser 腿的 `B10` 就是这么来的，规模见 `e2e-notes-audit.mjs` 里那段的口径），
      # 现在判 `MUT-UNKNOWN`。
      # 本腿这 10 条变异里有 3 条跑真 HTTP，**结构上产得出未决了**。
      #
      # ⇒ 写死的 0 变成假话 ⇒ 接上真管道（`--undecided-out` → `sum-undecided.mjs`）。
      #    这**不是**给那根桩开例外，是把它守着的那段论证换成了新的一段。
      #
      # ## 与 record 腿的差别（当年那条腿为什么反过来要真去数）
      #
      # record 腿的论证有一个洞：`retranscribe()` 里有一处跳过**没有 judge 兜住**，
      # 能在「整轮全绿」里发生。本腿逐个核过每一个 `check()`／`mutation()` 调用点，
      # **没有这种洞**：它们要么在 try 块顶层，要么在第 13 节那个内层 try 里，
      # 而内层 try 抛出去会被外层 catch 接住 → `failed += 1` + 一行 ABORTED。
      # 这条差别今天已经不重要了 —— **两条腿现在都真的在数。**
      # ═══════════════════════════════════════════════════════════════════════════════
      # 三个矩阵格各自留的覆盖面计数（e2e-notes-undecided-<label>.json），
      # merge-multiple 摊平进同一个目录 —— 与 e2e-browser.yml 的 attest job 同一模式。
      - name: 下载三平台的覆盖面计数
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-notes-undecided-*
          path: undecided
          merge-multiple: true

      # 任何一格对不上，sum-undecided.mjs 只会警告 + 把 undecided_flag 收敛成
      # 空字符串（⇒ emit 收到它自己的默认值 `null`），**不会**让这一步失败 ——
      # 一个纯展示用的覆盖面统计出故障，不该连累下面「写凭证」那一步
      # （那一步产出的 artifact 名字才是闸门真正认的信号）。
      #
      # ★ `--reduce` 用**默认的 `sum`**，这是一次有意的选择，不是没看见那个参数：
      #   本腿的未决是「**某台 runner 上**那条变异炸了」——三格各自独立的事实，该相加。
      #   `agree` 是给「三格是同一件事的三次观察」用的（`e2e-allcomponents` 那种
      #   平台无关的缺口清单，相加会把同一个东西数三遍）。本腿不是那种形状。
      - name: 求和覆盖面计数
        id: sum
        run: |
          node scripts/ci/sum-undecided.mjs \
            --dir undecided \
            --expect-labels "$PLATFORMS" \
            --file-template 'e2e-notes-undecided-{label}.json' \
            --github-output "$GITHUB_OUTPUT"

      # ★ 变异那一轴（2026-08-17）：这条腿的变异**跑在与断言同一次脚本调用里**，
      #   所以「哪几条什么都没证明」早就在上面那份覆盖面文件里（`unverified` 那一格）——
      #   只是此前**没有往凭证上传**，于是凭证写着 `mutations: null`＝「这条腿没接这个字段」。
      #   一条每轮真跑变异的腿，凭证却说这条轴没接线 —— 与 runtime 那边
      #   「跑了但没证明、写成 ran」是同一个病的镜像面。
      #
      #   ⚠️ 复用同一份 artifact、同一个目录：不新开一条管道，就少四个会漂的名字。
      #      但这是**削减，不是消除** —— 另开一条管道要新添五个手抄的名字，复用之后是
      #      **五个收成了一个**：覆盖面文件里那个 JSON 键 `unverified`
      #      （`collect-unverified-mutations.mjs` 读的就是它）。
      #      而收成的这一个，在 2026-08-17 之前**一个守卫都没有**：改了名 ⇒ 读不出 ⇒
      #      按它自己的裁决收敛成 `ran-unverified` ⇒ 退出码 0 ⇒ 没有一盏灯会红。
      #      现在由 `selftest-undecided-wiring.mjs` 的 R8 守着（`unknowns` 那一格是 R7）。
      - name: 汇总未验证的变异
        id: mut
        run: |
          node scripts/ci/collect-unverified-mutations.mjs \
            --dir undecided \
            --expect-labels "$PLATFORMS" \
            --file-template 'e2e-notes-undecided-{label}.json' \
            --github-output "$GITHUB_OUTPUT"

      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg notes \
            --bundle-run "${{ needs.e2e.outputs.bundle_run_id }}" \
            --platforms "$PLATFORMS" \
            --mutations "${{ steps.mut.outputs.mutations_state }}" \
            ${{ steps.mut.outputs.unverified_flag }} \
            ${{ steps.sum.outputs.undecided_flag }} \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-notes-${{ needs.e2e.outputs.bundle_run_id }}
          path: dist/e2e-attest.json
          if-no-files-found: error
