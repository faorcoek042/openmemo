# 冷启动依赖来源审计：**这些依赖到底是不是现场下载的？**
#
# ── 为什么这个 workflow 存在 ──────────────────────────────────────────────────────
#
# 用户原话：「鉴于之前经历，我怕了你，再检查下是不是都是现场下载的各个依赖？」
#
# 他的担心有实据。这台开发机上至少四次"能跑"靠的是**机器的历史沉积**：
#   · whisper 靠搬迁前留下的 .so 链
#   · 数据目录指针靠机器上一个全局文件
#   · apps/web/dist 靠别人刚构建的产物
#   · 867 条测试全绿，靠本机恰好只装了 node 24（CI 的 node 22 当场红）
#
# **在开发机上查这件事是循环论证** —— 那台机器已经装好了一切，而它正是不该信的那台。
# 干净 runner 是接 GitHub 换来的能力，这个 workflow 就是来用它的。
#
# ── 三个问题 ────────────────────────────────────────────────────────────────────
#
#   1. 从哪个 URL 下载？        2. 版本钉死了吗？       3. 有没有 sha256 校验？
#
# 静态部分由 `scripts/ci/dependency-audit.mjs` 回答（读 manifest）；
# `--live` 让它对每个 URL 发一次**真实请求**，并把 8 MB 以下的小文件**真下载下来重算
# sha256** 与 manifest 比对 —— 那才叫证据，读代码推断的不算。
#
# ── 触发方式：手动 ──────────────────────────────────────────────────────────────
#
# 它要真下载几百 MB 并跑一次完整冷启动，不适合每次 push 都来一遍。
# 值得重跑的时机：改了 manifest、改了 downloader、升级了 pnpm 依赖。

name: cold-start-audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-start-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # ★ T-145 第二轮：从只跑 ubuntu 扩到三平台。
    #
    #   用户接 GitHub 的**全部理由**就是「在别的系统上跑」，而 §6 当时只覆盖
    #   ubuntu-24.04 —— 也就是说"依赖都是现场下载的"这个结论只在一个平台上成立。
    #   而今天已经两次证明非 Linux 上有 Linux 永远看不见的东西：
    #     · macOS 的 MODULE 用 `.so` 不是 `.dylib` → 打出一个**绿灯的空包**
    #     · Windows 上 `{mode:0o600}` 写下去读回来是 `666`（token 全用户可读）
    #   冷启动这条路径同样没理由假设三个平台一致。
    #
    #   fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。
    name: 依赖来源 + 冷启动（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, label: linux-x64 }
          - { runner: macos-26, label: darwin-arm64 }
          - { runner: windows-2025, label: win32-x64 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 在装任何东西**之前**记录 runner 自带什么。
      #   ⚠️ 我原本以为 ubuntu runner 自带 ffmpeg —— **第一次真跑证伪了**：
      #      ffmpeg/ffprobe/yt-dlp/whisper-cli 全都不在 PATH 上，
      #      自带的只有 sqlite3 / python3 / cmake。
      #   这一步照留：结论不能建立在"这款镜像今天恰好没装"上，
      #   而且它正是"我们装上了"与"它本来就在"的唯一分界线。
      # ★ 用 bash 显式指定 shell —— Windows runner 的默认 shell 是 pwsh，
      #   而这段是 POSIX 写法。（cold-start-audit.mjs 里的 which 是纯 Node 实现的，
      #   不依赖这一步；这里只是把镜像自带什么留个人可读的记录。）
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          echo "== runner 自带的同名工具 =="
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3 cmake; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done
          echo
          echo "== 版本 =="
          ffmpeg -version 2>/dev/null | head -1 || true
          python3 --version 2>/dev/null || true

      # ① 静态审计：manifest 里每一个下载文件的 URL / 钉死情况 / sha256。
      #    这一步不需要装依赖，所以放在最前面 —— 后面任何一步挂了，它的结论仍然成立。
      - name: 依赖来源静态审计
        run: node scripts/ci/dependency-audit.mjs

      # ② 同一份审计 + 真实网络：每个 URL 发一次 Range 请求，
      #    并把 8 MB 以下的文件**真下载重算 sha256**。
      #    ⚠️ 网络失败不改变退出码（抖动不该变成门禁红），但会在报告里明确标出。
      - name: 依赖来源实测（真实 HTTP + 小文件 sha256 复算）
        if: ${{ !cancelled() }}
        run: node scripts/ci/dependency-audit.mjs --live --verify-under 8

      - name: Install pnpm
        if: ${{ !cancelled() }}
        run: npm install -g pnpm@10.15.0

      # ③ npm 侧是**第二条获取通道**，不受本仓 manifest 的 sha256 约束。
      #    装完之后直接从 node_modules 里把真实 URL 抠出来 —— 这是运行期证据，不是读文档。
      - name: Install（并记录 postinstall 下载了什么）
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log

      # ★ T-145：这一步的语义变了。
      #   原本它是去把 ffmpeg-static / youtube-dl-exec 的真实下载 URL 抠出来当证据；
      #   **那两个包已经被删掉了**（它们是第二条、松的那条获取通道：无校验和，
      #   youtube-dl-exec 连版本都不钉，打的是 releases/latest）。
      #   所以现在它变成一条**反向断言**：这两个名字不该再出现在 node_modules 里。
      #   留着它而不是删掉，是因为「装依赖时会不会有二进制偷偷进来」这个问题
      #   本身没有过期 —— 过期的只是答案。
      - name: 反向核实：npm 侧不该再下载任何二进制
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          echo "== onlyBuiltDependencies 现在是什么 =="
          sed -n '/^onlyBuiltDependencies:/,/^[^ #]/p' pnpm-workspace.yaml || true
          echo
          echo "== ffmpeg-static / youtube-dl-exec 是否还在 node_modules 里 =="
          bad=0
          for p in ffmpeg-static youtube-dl-exec; do
            hits=$(find . -path "*/node_modules/$p/package.json" 2>/dev/null | head -3)
            if [ -n "$hits" ]; then
              echo "  ✘ $p 仍然存在："
              echo "$hits" | sed 's/^/      /'
              bad=1
            else
              echo "  ✔ $p 不存在"
            fi
          done
          echo
          echo "== 有没有别的二进制混进来（>5MB 的可执行文件）=="
          find node_modules -type f -size +5M \( -perm -u+x -o -name '*.node' -o -name '*.exe' \) 2>/dev/null \
            | head -20 | while read -r f; do printf '   %10s  %s\n' "$(wc -c < "$f")" "$f"; done
          exit $bad

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build:safe

      # ④ ★ 真跑一次冷启动：全新数据目录 + **屏蔽宿主同名工具**。
      #    不屏蔽的话，产品在 PATH 上找到 runner 自带的 ffmpeg，
      #    "装上了" 和 "借到了" 在最终效果上就长得一模一样 —— 那正是要查的形状。
      - name: 冷启动（全新数据目录，屏蔽宿主工具）
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: node scripts/ci/cold-start-audit.mjs --port 19700

      # ⑤ 对照组：**不屏蔽**再跑一次。两次的差集 = "如果用户机器上没有这些东西，
      #    会多坏掉哪些功能"。这一步单独存在，是为了让"借用"这件事有个可比的基准。
      - name: 对照组：不屏蔽宿主工具再跑一次
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: node scripts/ci/cold-start-audit.mjs --port 19710 --no-mask
