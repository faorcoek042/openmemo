# 目录里**每一个**组件都真下一遍。
#
# ── 这条腿为什么存在（用户 2026-08-09 的原话）──────────────────────────────────────
#
#   **「你有没有测试过每个组件的下载？是不是又偷懒了？」**
#
# 答案是"没有"。`e2e-coldstart` 只装了其中几个（ffmpeg、whisper 引擎、一个 ASR 模型）
# 就往下走了 —— 而目录里有 **25 个后端包 + 35 个模型变体**，
# **没有任何一条腿把它们逐个下过一遍**。他问得对。
#
# ── 判据分两层（理由：贵的那一半不该换来覆盖面的缺口）────────────────────────────
#
# 全量真下是 **39.4 GB**（`[实测]` 由清单求和；仅"每组最小变体"也要 20.6 GB），
# 而 runner 可用磁盘只有十几 GB —— 全下一遍在每次 CI 上做不到。
# 但"下不动"不该变成"只测小的"（那等于没测）。所以：
#
#   **A 层**：每一个组件的**每一个镜像**都真发一次 Range 请求（只取 64 KB）——
#            **100% 覆盖，不抽样**。断言可达 + 总长度与清单一致 + 魔数对得上。
#            它抓的正是用户撞上的那一类：下载源不可达 / URL 失效 / 文件被换掉。
#   **B 层**：走产品自己的完整安装路径（下载→校验→解包→落位→记录→真的可用）。
#            后端包**全部适用的**每次都装；模型按预算挑，**并把这轮抽了谁、漏了谁逐条打印**。
#            `mode=full` 则一个不落（几十 GB，只在手动触发时用）。
#
# ── ⚠️ 这条腿结构上给不出的保证（腿自己的输出里也写了）──────────────────────────
#
# **CI 可达 ≠ 用户可达。** runner 就在 GitHub 自己的网络里，`github.com` 对它永远是通的；
# 而用户 `[真机实测，中国网络]` 装 `whispercpp-cpu-win-x64` 是
# `0 B / 4.0 MB`、「下载源无法访问 (1/3)」。**这条腿很可能全绿而用户仍然装不上。**
# 能在 CI 上诚实回答的那一半是**镜像结构**：只有 github 一个来源的组件，
# 在中国就是装不上的 —— 这一条与从哪儿跑无关。

name: e2e-allcomponents

# ── 每天一次的定时跑：**先只装这一条，而且这一跑是去问一个问题的** ────────────────
#
# ## 为什么六条腿里先只给这一条加 cron
#
# 两个确证实例（notes 从改名那刻起坏着、runtime 坏了两天）都是**靠有人恰好手动跑**
# 才发现的 —— 六条腿全是 `workflow_dispatch`，没有一条随 push 或定时跑。所以要定时跑。
#
# 但 `[实测]` 查下来有个**能让定时跑变成比现状更坏**的坑：
#
# > `inputs` 上下文只在 `workflow_dispatch` / `workflow_call` 时被填充。
# > **`workflow_dispatch` 的 `default:` 不会应用到 `schedule` 触发的运行上**，
# > 而"取不存在的属性 ⇒ 空字符串"。
#
# 而六条腿是**部分设防、且不一致**的。空值下会发生的不是红，是**绿**：
# `e2e-browser` 会跳过现场组装、改走 bundleRunId 为空的 artifact 分支；
# `e2e-runtime` 的变异矩阵（默认 true）整个不跑。
# **跳过的步骤不会让 job 变红** ⇒ 一条每天跑、每天绿、但**测得比手动跑浅**的检查。
# 那不只是没解决问题，是造出一个**让所有人以为有人在跑**的东西。
#
# 这个前提**验不了**：文档页截断拿不到确切措辞、仓里零 `schedule` 先例、
# 而 `schedule` 只在默认分支触发 ⇒ PR 上测不了。三条路都堵死。
#
# **所以先只装这一条，因为它是唯一在关键参数上已经设防的：**
#   · `plan` 作业：`const legs = process.env.LEGS || "all"`
#   · 判据本体：`--mode "… || 'sample'"`、`--model-budget-mb "… || '2600'"`
# **即使上面的判断成立，它也掉不进 `full` 模式** —— 这正是选它的理由。
#
# ## ✅ 2026-08-12：那一跑回来了，上面那个前提**成立**，五条腿的 cron 已铺开（#91）
#
# `[实测 scheduled run 31526070085]`（2026-08-11 首跑；cron 写 18:00 UTC，实际
# 19:05 UTC 才触发 —— **晚约 65 分钟是 GitHub 排队常态，不是 cron 坏了**）：
#
#     github.event_name    = 'schedule'
#     inputs.mode          = ''    len=0
#     inputs.modelBudgetMb = ''    len=0
#     inputs.legs          = ''    len=0
#     inputs.bundleRunId   = ''    len=0
#
# ⇒ **`workflow_dispatch` 的 `default:` 不适用于 `schedule` 触发的运行。**已确证，
#   不用再猜。上面那段"这个前提验不了"**保留**：它记的是当时的处境，
#   而不是一个还没答案的问题 —— **删说法不删事实**。
#
# ⚠️ 下面那个"观测 inputs"的步骤当初是**加可见，不是加设防**，并且刻意**没有**给
#    attest 作业里那处 `--mode "${{ inputs.mode }}"` 补默认值 ——
#    **补上就把待测的现象消灭了**。现在现象已经测到，那处**已经补上 `|| 'sample'`**
#    （见本文件 attest 作业里那段 🧨→✅ 的注释，理由与拆除日期都写在那儿）。
#    观测步骤**保留**：它是这条结论的证据产地，也是下次 GitHub 改语义时最先说话的地方。
#
# 🔴 原来这里写着「**拿到这一跑的事实之前，不许把 cron 铺到其余五条腿上**」。
#    **事实已拿到 ⇒ 这条禁令解除**，其余五条腿的 cron 于 2026-08-12 一并加上，
#    错开 15 分钟依次启动：allcomponents 18:00 / runtime 18:15 / browser 18:30 /
#    notes 18:45 / import 19:00 / record 19:15（UTC）。
#    ⚠️ 解除的前提不只是"知道了 inputs 是空"，还包括**五条腿逐个补完兜底**，
#       并且「空 inputs 的行为 ≡ `default:` 的行为」这条性质被
#       `scripts/ci/selftest-workflow-gates.mjs` **逐点求值比对**钉住（挂在
#       `pnpm test:ci-scripts`）。**光知道现象、不补兜底就铺 cron，才是当初禁的那件事。**
#
# ## 红了谁会看见 —— 三条可审计的事实（第 2 条已于 2026-08-11 确认）
#
# 1. **谁收到**：GitHub 对 `schedule` 失败的通知**发给创建该 workflow 的用户**；
#    若他人修改了 cron，则改发给**该修改者**（GitHub 官方文档原文）。
#    也就是**提交这条 cron 的那个账号**。
# 2. **它依赖什么**：该账号**打开了 Actions 的通知**。
#    ✅ **已确认**：用户本人确认其 Actions 通知是开着的，会收到邮件 / App 通知。
#    **确认来源**：用户本人（经 Manager 转达）。**确认日期**：2026-08-11。
#    （此前这里写的是"没有被验证过"。**前提一旦被证实，就得把结论写回来** ——
#     留着一句已经不成立的"未验证"，下一个人要么重做一遍这轮确认，
#     要么反过来以为这条链子是断的。**把已经知道的事写回去，和一开始不说假话一样重要。**）
# 3. **如果这条断了会怎样**：定时跑照常跑、照常红，**而没有人知道** ——
#    于是我们只是把"没人跑"换成了"没人看"，**回到正要治的那个病**。
#    ⚠️ 第 2 条已确认**不代表这句作废**：通知设置**将来可能被关掉**，
#    而那一天不会有任何东西提示我们。这句是第 2 条的过期谓词，**保留**。
#
# ## 成本（实测，不是估的）
#
# 六条腿全部每天跑一次：**85 job-分钟/天、2,550 job-分钟/月**
# （注意：GitHub **按 job 向上取整到整分钟**计费，六条腿是 **26 个 job** 不是 6 个；
#  串行墙钟只有 34.7 分钟/天，拿墙钟当成本会低估 2.4 倍）。
# 本仓是 **public + 全 GitHub 托管标准 runner ⇒ $0，没有分钟额度**。
# ⚠️ **若仓库将来转为 private，这条会变成约 $91/月，其中 macOS 占 79%** ——
#    那是一个会改变结论的条件，写在这里省得后人重算。
#
# ## 时间与串行
#
# 18:00 UTC（约北京时间凌晨 2 点）。将来铺开时其余五条**错开 15 分钟依次启动**，
# 天然串行、零编排 —— 不是为了省钱（$0），是**别在同一时刻抢 runner 影响别人的 PR 判决**。
# 不建编排器的硬理由：`GITHUB_TOKEN` 触发的 `workflow_dispatch` **不产生新的 run**
# （GitHub 防递归），做编排就得引 PAT ⇒ 那是新基础设施。
#
# ## 顺带留档：browser 那条腿的抖动赔率（省得下次有人重做这轮推理）
#
# `[实测]` 对同一 SHA 全默认参数连跑 4 次，**12 个平台 job 全绿**（含此前红过的 win32-x64）。
# 能下的结论**只有**：真实红率若为 50%，连出 4 绿的概率仅 6.25% ⇒ **可排除"掷硬币"**；
# 但红率若为 10%，连出 4 绿的概率是 66% ⇒ **排除不了"偶发"**。
# 一侧 95% 置信上界 ≈ **53%**。**要把上界压到 10% 以下需要约 28 跑。**
# 结论：**不是高频抖动，发版当天预算一次重跑即可**；那 28 跑**不做**，
# 因为它不改变这句结论（收窄一个不影响行动的区间 = 把精确当目的）。
on:
  schedule:
    # 每天 18:00 UTC。⚠️ schedule 只在**默认分支**上触发。
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      bundleRunId:
        description: '从哪个 build-bundles run 取包。留空 = 自动找最近一个带该 artifact 的成功 run。'
        required: false
        type: string
      legs:
        description: 'Which platform to run'
        type: choice
        required: false
        default: all
        options: [all, linux, macos, windows]
      mode:
        description: 'sample = 模型按预算抽（每 role 至少一个，抽了谁/漏了谁都打印）；full = 全部 35 个变体（几十 GB）'
        type: choice
        required: false
        default: sample
        options: [sample, full]
      modelBudgetMb:
        description: 'sample 模式下模型的下载预算（MB）'
        required: false
        default: '2600'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-allcomponents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先算矩阵：**被过滤掉的平台根本不会有 job**。
  # 在 step 上挂 if 会让跳过的平台报「成功，零步骤」—— PROTOCOL §11 点名的假绿，
  # 我自己在 e2e-record 上栽过一次。
  plan:
    name: 算矩阵（跳过的平台不许变成绿勾）
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # ★★ 一次性观测：**schedule 触发下 `inputs.*` 到底是什么？**
      #
      # 这一步**只打印，不改任何行为** —— 它存在的唯一目的，是把一个
      # **验不了的前提**（`workflow_dispatch` 的 `default:` 会不会应用到 schedule 运行上）
      # 变成一条**可读的事实**。三条验证路都堵死：文档页截断、仓里零 schedule 先例、
      # schedule 只在默认分支触发所以 PR 上测不了。**那就只能让它自己说一次。**
      #
      # ⚠️ 刻意打印**原始值**，不带任何 `|| 'default'` 兜底 ——
      #    兜底会把待测的现象消灭掉。用 `${#VAR}` 打长度，是为了让
      #    **"空串"和"字面量 sample"在日志里不可能被看混**。
      #
      # 读法：若 `event_name=schedule` 时 `mode` 长度为 0 ⇒ 判断成立
      #       （默认值不生效），其余五条腿铺开前必须逐个补兜底；
      #       若长度为 6（`sample`）⇒ 判断不成立，可以直接铺开。
      - name: 观测 inputs 在本次触发下的真实取值（只打印，不改行为）
        shell: bash
        env:
          RAW_MODE: ${{ inputs.mode }}
          RAW_BUDGET: ${{ inputs.modelBudgetMb }}
          RAW_LEGS: ${{ inputs.legs }}
          RAW_BUNDLE: ${{ inputs.bundleRunId }}
        run: |
          echo "── inputs 原始取值观测（本步骤不影响后续行为）──"
          echo "github.event_name    = '${{ github.event_name }}'"
          echo "inputs.mode          = '${RAW_MODE}'    len=${#RAW_MODE}"
          echo "inputs.modelBudgetMb = '${RAW_BUDGET}'  len=${#RAW_BUDGET}"
          echo "inputs.legs          = '${RAW_LEGS}'    len=${#RAW_LEGS}"
          echo "inputs.bundleRunId   = '${RAW_BUNDLE}'  len=${#RAW_BUNDLE}"
          echo "──"
          echo "若 event_name=schedule 且 mode 的 len=0 ⇒ dispatch 的 default 不适用于 schedule，"
          echo "其余五条腿在铺开 cron 之前必须逐个补兜底（尤其 browser 的 assembleFromSource、"
          echo "runtime 的 mutations —— 它们空值下会**静默少跑**而不是变红）。"

      - id: pick
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          node -e '
            const all = [
              { runner: "ubuntu-24.04", label: "linux-x64",    artifact: "bundle-linux-x64",    leg: "linux"   },
              { runner: "macos-26",     label: "darwin-arm64", artifact: "bundle-darwin-arm64", leg: "macos"   },
              { runner: "windows-2025", label: "win32-x64",    artifact: "bundle-win-x64",      leg: "windows" },
            ];
            const legs = process.env.LEGS || "all";
            const include = legs === "all" ? all : all.filter((x) => x.leg === legs);
            if (include.length === 0) { console.error(`::error::legs=${legs} 没有匹配到任何平台`); process.exit(1); }
            console.log(`选中 ${include.length} 个平台：${include.map((x) => x.label).join(", ")}`);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          '

  allcomponents:
    name: 全组件下载（${{ matrix.label }}）
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 这条腿要下几 GB。先把可用磁盘打出来 —— 下不动时第一个要看的就是它。
      - name: 可用磁盘（下几 GB 之前先看一眼）
        shell: bash
        run: df -h . || true

      - name: 定位 build-bundles run
        id: runid
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(bash scripts/ci/resolve-bundle-run.sh '${{ matrix.artifact }}' '${{ inputs.bundleRunId }}')
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: 取预编译包（build-bundles run ${{ steps.runid.outputs.id }} 的 artifact）
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: incoming
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}

      - name: 解开归档 + 验结构（共享脚手架）
        id: unpack
        shell: bash
        run: |
          mkdir -p unpacked
          node scripts/ci/resolve-bundle.mjs \
            --from incoming --out unpacked \
            --require app/daemon/dist/main.js --require-node-runtime

      # ★ 判据本体。A 层约 150 次网络探测 + B 层几 GB 真下载，窗口给足。
      - name: 每一个组件都真下一遍
        timeout-minutes: 90
        shell: bash
        run: |
          node scripts/ci/e2e-allcomponents.mjs \
            --bundle "${{ steps.unpack.outputs.bundle_dir }}" \
            --port 19830 \
            --undecided-out "e2e-allcomponents-undecided-${{ matrix.label }}.json" \
            --mode "${{ inputs.mode || 'sample' }}" \
            --model-budget-mb "${{ inputs.modelBudgetMb || '2600' }}"

      # ★ 覆盖面（undecided 计数）单独一份 artifact，供 attest 作业归并后传给
      # emit-e2e-attestation.mjs --undecided。文件形状与另外四条腿逐字相同。
      #
      # `!cancelled()`：失败也传 —— 一次红跑的未决清单恰恰最想看。
      # `if-no-files-found: warn`：脚本没跑到统计那一步时**故意不写文件**
      # （见 e2e-allcomponents.mjs 的 finally：`llmGapIds === null` 时一个字都不写，
      #  因为「没数」和「数出来是 0」必须分得开），少一格由下游如实收敛成 null，
      # 不该在这里再红一次。
      - name: 留档（覆盖面计数）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-allcomponents-undecided-${{ matrix.label }}
          path: e2e-allcomponents-undecided-${{ matrix.label }}.json
          if-no-files-found: warn

      # 几 GB 的东西留在 runner 上没意义；脚本自己也清，这里再兜一次。
      - name: 清理（跑完自己清）
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf unpacked incoming || true
          df -h . || true

  # ── 发布闸门凭证 ──────────────────────────────────────────────────────────────
  #
  # Manager 2026-08-09：「修完要能守住 —— 让"某一族包全平台装不上"当场红，
  # 那就把它接进发布闸门的腿列表，别让它只是一条手动跑的腿。」
  #
  # ★ 两个条件缺一不可，而且第二个是这条腿**独有**的：
  #   ① `legs=all` —— 只跑了一个平台却发一张写着三平台的凭证，那是假话。
  #   ② **`bundleRunId` 非空** —— 这条腿的 `bundleRunId` 是**可选**的（留空会自动
  #      找最近一个带该 artifact 的成功 run）。而 `resolve-bundle-run.sh` 是
  #      **按 artifact 名**找的，三个平台完全可能各自解析到**不同批**的包。
  #      那种 run 里"三平台都绿"是真的，但它们**验的不是同一批包** ——
  #      拿它去发一张钉着某个 bundleRunId 的凭证就是伪证。
  #      所以自动解析的 run **不发凭证**，要凭证就得把批次钉死。
  attest:
    name: e2e 凭证（三平台全跑、全绿、且钉死同一批包才发）
    needs: [allcomponents]
    # ★★ 这个作业**被跳过是常态，不是坏了** —— 在作业列表里它和"跑过了"长得一样，
    #    而本仓刚为这件事付过代价（#89：一条 lint 红让 gate 里 7 道守卫静默 skipped，
    #    **跳过的作业和跑过的作业在结果里长得一模一样**）。所以在这里写明白。
    #
    # 门是 `legs == 'all' && bundleRunId != ''`。而 `bundleRunId` **没有 `default:`**
    # （见上面 `inputs` 定义）⇒ 留空就是空串 ⇒ **任何没有显式钉批次的 run，
    # 这一格都会跳过**。也就是说：
    #
    #   · `schedule` 触发（inputs 为空）→ 跳过
    #   · **默认参数的手动 dispatch → 同样跳过**（今天四次实测均为 skipped）
    #
    # ⚠️ 所以"定时跑不发凭证"**不是 schedule 特有的效果**，它只是这条既有规则的
    #    一个实例：**没钉批次就不发凭证。** 别把它读成"定时跑坏了"或"schedule 少做了事"。
    #
    # 为什么这是对的（理由就在上面 :277-279 那段）：`bundleRunId` 为空时
    # `resolve-bundle-run.sh` 按 artifact 名各自解析，三个平台**可能验的不是同一批包**；
    # 那种 run 里"三平台都绿"是真的，但拿它去发一张钉着某个批次的凭证**就是伪证**。
    # **要凭证就得把批次钉死** —— 这是设计，不是缺陷。
    if: ${{ inputs.legs == 'all' && inputs.bundleRunId != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # ═══════════════════════════════════════════════════════════════════════════════
      # ★ `--undecided`：这条腿本轮有几条断言**跑了但什么都没证明**
      #
      # ## ① 这个数是什么：`role=llm` 的那几个变体
      #
      # `vendor/manifests/models-llm.json` 里有 5 个 `role=llm` 变体
      # （qwen3-4b-q4_k_m / qwen3-4b-q5_k_m / qwen3-8b-q4_k_m / qwen3-1.7b-q8_0 /
      #  gemma-3-4b-it-q4_k_m）。本腿的 B 层「真装一遍」是**从 `/api/models/catalog`
      # 枚举出来的**，而那个端点**不列 role=llm**（它们归 `/api/llm/models` 那条线）。
      # 所以这 5 个**一次都没被装过** —— 用户能不能装上，这条腿说不出话。
      # 脚本第 1 节早就把这句话用 `[未验证]` 打进日志了，但它此前**只活在日志里**：
      # 凭证的 `undecided` 是 `null`，闸门读出来是"这条腿没上报覆盖面"。
      #
      # ## ② 为什么它**永远是 5**（不是抽样波动）
      #
      # 它数的是清单里 `role=llm` 的条目数，**与 `--mode` / `--model-budget-mb`
      # 一个字的关系都没有**。抽样跳过的那些模型**不进这个数**，理由三条：
      #   · A 层已经逐个探过它们的每一个镜像（脚本里明写）；
      #   · `mode=sample` 已经是它的专属字段，闸门也已经念出来了
      #     （"抽样=sample（**不是全量**）"）—— 再报一遍是同一个事实说两遍，
      #     而说两遍会**稀释**它；
      #   · `undecided` 的语义是「**某条断言**没能被评估」。抽样跳过的模型在台账里
      #     根本没有逐个断言，只有一条对 picked 集合的聚合 judge ——
      #     **它们是样本更小，不是判据没跑。** 而且那个数会随一个调参旋钮乱跳，
      #     那种数字训练人忽略它。
      #
      # ## ③ ⚠️ 它什么时候**应该变成 0** —— 别让它变成一件没人再看的家具
      #
      # **一个永远是 5、永不变化的数，和一个乱跳的数一样会训练人忽略它。**
      # 报 5 严格优于沉默（今天这 5 个一个字都没有），但它是**诚实的过渡态，不是终点**。
      # 真正该修的是那条路本身够不着：要么 `/api/models/catalog` 把 role=llm 也列出来，
      # 要么本腿另外走一遍 `/api/llm/models` 把它们真装一遍。
      # **那一天这个数会自己变成 0** —— 因为它是数出来的，不是写死的。
      # 如果哪天你发现它还是 5 而上面那条路已经修好了，那说明脚本里
      # `llmGapIds` 那一处没跟上，去改脚本，不要来改这里的数字。
      #
      # ## 归并口径：`--reduce agree`，**不是** `sum`
      #
      # 另外三条腿（runtime/browser/record）的未决是**每个平台各自独立**的，所以求和。
      # 这条腿不是：那 5 个来自 `models-llm.json` —— **一个与平台无关的文件**，
      # 三个包里装的是同一份。求和会得到 15，也就是**把同一个文件数了三遍**。
      # 所以用 `agree`：要求三格报同一个值，取那个公共值。
      # ⚠️ 三格不一致**不是噪声，是信号**（三个平台读到的清单真的不同）——
      #    那时 `sum-undecided.mjs` 收敛成 null 并大声说，**绝不挑一个当代表**。
      #
      # ## ⏱ 这个数多久才看得到（免得下一个人以为它已经在生效了）
      #
      # 本作业的门是 `legs == 'all' && bundleRunId != ''`，而 `bundleRunId`
      # **没有 `default:`** ⇒ **只有显式钉了批次的 run 才会走到这里**。
      # `schedule` 触发和默认参数的手动 dispatch **都跳过**，所以那些跑里
      # 看不到这个数 —— 那不是它没接上，是这条腿本来就"没钉批次不发凭证"。
      # ═══════════════════════════════════════════════════════════════════════════════
      - name: 下载三平台的覆盖面计数
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-allcomponents-undecided-*
          path: undecided
          merge-multiple: true

      # 任何一格对不上（缺失/读不出/三格不一致），sum-undecided.mjs 只会警告 +
      # 把 undecided_flag 收敛成空字符串，**不会**让这一步失败 —— 一个纯展示用的
      # 覆盖面统计出故障，不该连累下面「写凭证」这一步（那一步产出的 artifact
      # 名字才是闸门真正认的信号）。
      - name: 归并覆盖面计数（agree：同一件事的三次观察，不相加）
        id: sum
        run: |
          node scripts/ci/sum-undecided.mjs \
            --dir undecided \
            --expect-labels linux-x64,darwin-arm64,win32-x64 \
            --file-template 'e2e-allcomponents-undecided-{label}.json' \
            --reduce agree \
            --github-output "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════════════════
      # 🧨→✅ 下面那句 `--mode` 曾经是**一颗没引信的雷**（`--mode "${{ inputs.mode }}"`，
      #        没有 `|| 'sample'` 兜底）。**2026-08-12 已拆除**，理由如下 ——
      #        删的是那条"先别补"的说法，**不删它当初存在的事实**。
      #
      # ## 当初为什么刻意不补（这句留着，它是一条判据，不是一句过时的话）
      #
      # 那个不一致是**故意**的：同一个 workflow 上面判据本体那处
      # （`--mode "${{ inputs.mode || 'sample' }}"`）有兜底，这里没有。
      # 因为当时要测的现象就是「`schedule` 触发时 `inputs` 到底是什么」，
      # 而 **补上默认值就把待测的现象消灭了** —— 那样永远不会知道答案。
      # **先让它说话，再决定要不要给它戴嘴套。**
      #
      # ## 事实已经拿到了，所以现在补
      #
      # `[实测 scheduled run 31526070085]`（2026-08-11 首跑，18:00 UTC 的 cron
      # 实际 19:05 UTC 才触发 —— GitHub 排队常态，不是 cron 坏了）：
      #
      #     github.event_name    = 'schedule'
      #     inputs.mode          = ''    len=0
      #     inputs.modelBudgetMb = ''    len=0
      #     inputs.legs          = ''    len=0
      #     inputs.bundleRunId   = ''    len=0
      #
      # ⇒ **`workflow_dispatch` 的 `default:` 不适用于 `schedule` 触发的运行。**
      #    结论已经拿到，观测点的使命结束，嘴套现在可以戴上了。
      #
      # ## 它此前为什么没炸：**安全性不在它自己身上**
      #
      # `inputs.mode` 为空时这里会传 `--mode ""`，而 `emit-e2e-attestation.mjs`
      # 只认 `sample|full`，收到空串会 `die()` —— **凭证根本发不出去**。
      # 它碰不到那条路，靠的是**另外两处的巧合**：
      #
      #   ① 本作业的门 `if: legs == 'all' && bundleRunId != ''`；
      #   ② `bundleRunId` **没有 `default:`**（见本文件 `inputs` 定义）。
      #
      # 两者合起来 ⇒ 任何没有显式钉批次的 run（`schedule`、以及**默认参数的手动
      # dispatch**）在这一格就被跳过了，`--mode ""` 那一行根本没机会执行。
      # **这两处巧合今天仍然成立，兜底不是替换它们，是不再依赖它们。**
      #
      # ## 补完之后，"什么时候会炸"这张清单还剩什么
      #
      # 原来那三件事（给 `bundleRunId` 加 `default:` / 放松 `if:` 里的
      # `bundleRunId != ''` / 让 schedule 满足这道门）现在**都不会再炸在 `--mode` 上**。
      # 但它们仍然会让**这条腿在没钉批次的情况下发凭证** —— 那是伪证，见下面
      # `if:` 那一段。清单没消失，只是它守的东西换了一件。
      #
      # ⚠️ 「空 inputs 的行为 ≡ `default:` 的行为」这条性质现在由
      #    `scripts/ci/selftest-workflow-gates.mjs` 对每一处 `${{ }}` 求值后逐点比对，
      #    挂在 `pnpm test:ci-scripts` 上：把这里的 `|| 'sample'` 删掉会**当场红**。
      # ═══════════════════════════════════════════════════════════════════════════════
      - name: 写凭证
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg allcomponents \
            --bundle-run "${{ inputs.bundleRunId }}" \
            --platforms linux-x64,darwin-arm64,win32-x64 \
            ${{ steps.sum.outputs.undecided_flag }} \
            --mode "${{ inputs.mode || 'sample' }}" \
            --out dist/e2e-attest.json
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-allcomponents-${{ inputs.bundleRunId }}
          path: dist/e2e-attest.json
          if-no-files-found: error
