# 跨平台探针：把 TypeScript 那一套（build / typecheck / test）**真的搬到 macOS 与 Windows 上跑一遍**。
#
# ── 为什么它和 ci.yml 是两个文件 ────────────────────────────────────────────────────
#
# `ci.yml` 是**门禁**：它只跑 ubuntu-24.04，必须是绿的，红了就是有人把主线弄坏了。
# 本文件是**探针**：它第一次跑几乎肯定是红的 —— 因为 `platform` T-141 §3 数出来全仓
# **42 处** `process.platform` / `os.platform()` 分支，其中 **34 处（81%）在开发机上
# 永远走不到**，而 CI 在此之前只做二进制构建，**一行 TS 测试都没跑过**。
# 那 34 条分支从写下来那天起没有被任何自动化执行过一次。
#
# 把两者分开是刻意的：**探针的红不能拖着门禁一起红**，否则唯一的结局是有人给它加
# `continue-on-error` —— 那就正好变成本仓最贵的那类 bug（失败被写成成功）。
#
# ── 关于 `if: ${{ !cancelled() }}` ─────────────────────────────────────────────────
#
# 下面几步带了 `if: ${{ !cancelled() }}`。**这和 build-backends 的 C4 不是一回事**，
# 区别必须写清楚，否则下一个人会照着 C4 的教训把它删掉（或者反过来照它写出一个 C4）：
#
#   · C4（真 bug）：`merge-manifest` 用 `if: always()` 让**产出步骤**在上游全挂时照跑，
#     于是写出 `packs: []` 还 **upload 成功、workflow 绿灯** —— 失败被写成了成功。
#   · 这里（不是 bug）：`!cancelled()` 只让**后面的观测步骤仍然执行**。
#     失败的那一步**依然是失败**，job 的 conclusion **依然是 failure**，
#     没有任何步骤是 `continue-on-error`，也没有任何产物被声称为"好的"。
#
# 目的很具体：一次 dispatch 想把 macOS / Windows 上**所有**坏点一次列全，
# 而不是每轮只看到最靠前的那一个然后再排队 20 分钟。**探针的价值就在信息密度**。
#
# ⚠️ 判据：如果哪天有人想把这个 workflow 当门禁用，**必须先把 `!cancelled()` 全删掉**。

name: ci-crossplatform

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-xplat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu 这一行是**对照组**，不是冗余：没有它，macOS/Windows 的红分不清是
          # "平台问题"还是"这一版代码本来就坏"。
          - { runner: ubuntu-24.04, label: linux-x64 (control) }
          - { runner: macos-26, label: darwin-arm64 }
          - { runner: windows-2025, label: win32-x64 }
          # ★ T-145 第二轮裁掉（用户 2026-08-05：「macos-x64 我用不到」）：
          #   - { runner: macos-15-intel, label: darwin-x64 }
          #   第一轮它跑过一次，结论是**和 darwin-arm64 逐条一致**
          #   （bash 3.2 / 大小写不敏感 / 同一条 pipeline 测试红），
          #   没有任何一条事实是只有 Intel Mac 才看得到的 —— 删掉不丢信息。
          #   要恢复把上面那行放回来即可。
    steps:
      # submodules 不拉：TS 侧一行都不需要 vendor/ 里的 C++ 源码。
      - uses: actions/checkout@v6

      # ADR-006 决策 7：Node 基线 22。**必须和 ci.yml 一致** ——
      # T-145 第一轮就是被这条咬到的：本机 Node 24 与 CI Node 22 的
      # `node --test` 默认发现规则不同，本机 868 全绿而 CI 当场红。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 放在 install **之前**：它只依赖 node，装依赖挂了也还能拿到这份事实表。
      #   这是本仓第一次在真 macOS / 真 Windows 上取得这些数据。
      - name: Platform facts (仪表，不是门禁)
        run: node scripts/ci/platform-facts.mjs

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages)
        if: ${{ !cancelled() }}
        run: pnpm build:safe

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # ★ T-171 补：此前本 workflow **没有 lint**，于是「跨平台门禁」在 lint 这一格上
      #   等于不存在 —— `ci.yml`（ubuntu-24.04）是全仓唯一自动触发的 workflow，
      #   它绿了只说明 **Linux 上**的 eslint 绿。
      #
      #   为什么 lint 也需要跨平台跑（不是凑数）：eslint 的一部分判定与**文件系统**有关，
      #   而三个平台在这上面不一样 —— import 解析走真实路径（macOS/Windows 大小写不敏感，
      #   Linux 敏感 ⇒ `import './Foo'` 引 `foo.ts` 在 Linux 红、另两个平台绿），
      #   glob 展开与路径分隔符也不同。`[未验证]` 本机只有 Linux，这条预测要靠一次真 dispatch
      #   来证实或推翻 —— 照本文件末尾那条 `check:sources` 的先例，跑完请回来更新这段话。
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm -r test

      # ★ T-171 补：此前本 workflow 也**没有 `test:ci-scripts`**。
      #
      #   ⚠️ **这一步在 macOS / Windows 上很可能是红的，而那正是要它的理由**（探针不是门禁）。
      #   `[未验证，需真机]` 预测与判据：`pnpm test:ci-scripts` 串了 7 个自检，其中
      #   `selftest-buildbox.sh` / `selftest-build-whisper.sh` 是 **bash 脚本**，用到
      #   `mktemp` / `sed` / `grep` / `ldd`。Windows runner 上 `bash` 是 Git Bash，
      #   前三个有、**`ldd` 没有**；macOS 上 `sed` 是 BSD 版，`sed -i` 的参数与 GNU 不兼容。
      #   所以预期形状是「Linux 绿、另两个平台在这一步红」。
      #
      #   为什么仍然接进来而不是等修好：这 7 个自检守的是 `build-backends.yml` 的判定逻辑，
      #   而那个 workflow **本来就要在三个平台上跑**。自检只在 Linux 上跑过，
      #   等于「用 Linux 的行为去证明 Windows 上的判定是对的」—— 本仓最贵的那类假绿。
      #   先让它红出来，再决定是修脚本还是按平台收窄。**红了不要加 continue-on-error**
      #   （文件头 ⚠️ 那条判据），要么修，要么把这段话改成实测结论。
      - name: CI scripts self-test
        if: ${{ !cancelled() }}
        run: pnpm test:ci-scripts

      # ── ⛔ `pnpm format:check` **刻意没有接**，这里也不接，`ci.yml` 里也不接 ──────────
      #
      # `[T-171 实测 2026-08-07]` `npx prettier --check .` → **481 个文件不合格**
      # （历史记录：审计记 403、T-169 实测 476 —— 两个都已过期，别再引用那两个数）。
      #
      # 今天接进任何 workflow = 造一条**永远红**的门禁。而本仓自己写过判据：
      #   **「一条永远红的守卫等于一条被删掉的守卫，而且会训练人忽略红灯。」**
      # 顺序必须是「先把 481 个文件统一格式化 → 再上门禁」，反过来做只会让人给它加
      # `continue-on-error`，那就正好变成本文件头 ⚠️ 那条判据禁止的东西。
      #
      # → 这是一条**已登记的欠债**，不是被忘掉的。要清它请单开一个任务：
      #   一次 `pnpm format` 会碰几百个文件，与任何并行改动都必然冲突，
      #   所以它得独占一个提交窗口（PROTOCOL §10 推论：这类改动要么一次到位，要么申报窗口）。

      # T-141 §3 第 30 条预测过：这一步用 POSIX `find`，而 Windows 的 `FIND.exe` 是
      # grep 类工具，语义完全不同 → catch → 返回 [] → "没找到任何源码目录" → exit 1。
      # 放在最后单独一步，就是为了让那条预测**要么被证实、要么被推翻**。
      #
      # ★ 那条预测已经被证实、并且**已经修好**（T-147，`0588091`）：
      #   `check-tracked-sources.mjs` 不再调宿主 `find`，改用 Node 自己走目录 +
      #   `git check-ignore --stdin`。三平台实测同一个数：`✔ 95 个源码目录`
      #   （win32 见 run 31038276704）。所以这一步**现在应当是绿的，三个平台都是**。
      #
      # 这行说明本身是被更新过的 —— 它曾经写着「预期在 Windows 上红」，而它已经绿了。
      # 一句描述得很具体的过期说明比没有说明更能误导人：下一个看见它的人会以为
      # 这里的红是正常的，从而**不去查一个真的红**。过期的说明要更新，不是留着。
      - name: Tracked-sources guard (三平台都应为绿 —— T-141 §3 第 30 条已由 T-147 修复)
        if: ${{ !cancelled() }}
        run: pnpm check:sources
