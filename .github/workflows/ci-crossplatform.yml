# 跨平台探针：把 TypeScript 那一套（build / typecheck / test）**真的搬到 macOS 与 Windows 上跑一遍**。
#
# ── 为什么它和 ci.yml 是两个文件 ────────────────────────────────────────────────────
#
# `ci.yml` 是**门禁**：它只跑 ubuntu-24.04，必须是绿的，红了就是有人把主线弄坏了。
# 本文件是**探针**：它第一次跑几乎肯定是红的 —— 因为 `platform` T-141 §3 数出来全仓
# **42 处** `process.platform` / `os.platform()` 分支，其中 **34 处（81%）在开发机上
# 永远走不到**，而 CI 在此之前只做二进制构建，**一行 TS 测试都没跑过**。
# 那 34 条分支从写下来那天起没有被任何自动化执行过一次。
#
# 把两者分开是刻意的：**探针的红不能拖着门禁一起红**，否则唯一的结局是有人给它加
# `continue-on-error` —— 那就正好变成本仓最贵的那类 bug（失败被写成成功）。
#
# ── 关于 `if: ${{ !cancelled() }}` ─────────────────────────────────────────────────
#
# 下面几步带了 `if: ${{ !cancelled() }}`。**这和 build-backends 的 C4 不是一回事**，
# 区别必须写清楚，否则下一个人会照着 C4 的教训把它删掉（或者反过来照它写出一个 C4）：
#
#   · C4（真 bug）：`merge-manifest` 用 `if: always()` 让**产出步骤**在上游全挂时照跑，
#     于是写出 `packs: []` 还 **upload 成功、workflow 绿灯** —— 失败被写成了成功。
#   · 这里（不是 bug）：`!cancelled()` 只让**后面的观测步骤仍然执行**。
#     失败的那一步**依然是失败**，job 的 conclusion **依然是 failure**，
#     没有任何步骤是 `continue-on-error`，也没有任何产物被声称为"好的"。
#
# 目的很具体：一次 dispatch 想把 macOS / Windows 上**所有**坏点一次列全，
# 而不是每轮只看到最靠前的那一个然后再排队 20 分钟。**探针的价值就在信息密度**。
#
# ── 🔴 订正（2026-08-23）：上面那句"一次列全"此前**是假的**，而且假了很久 ───────────
#
# `!cancelled()` 只治**步骤之间**的截断。**步骤内部**还有两层，此前没人数过：
#
#   ① `pnpm -r test` 的 **bail** —— pnpm 在第一个失败的包上就停。
#      `[实测 run 32651393827，2026-08-23，master d72dc34]` win32 停在
#      `packages/pipeline`（12 红）⇒ 排在它后面的 `apps/web`（559 条）与
#      `apps/daemon`（785 条）**当天一条都没跑**。这一格报出来的"12 条红"
#      不是 Windows 的真实数字，而真实数字**当时没有任何人知道**。
#      → 已改为 `pnpm -r --no-bail test`。
#   ② `pnpm test:ci-scripts` 是一条 **35 环的 `&&` 链** —— 断在第一环。
#      `[实测，两次真跑一致]` win32 断在第 6 环（`selftest-elf-glibc`），
#      macOS 断在第 7 环（`selftest-pack-deps`）⇒ 后面 28 / 29 个自检
#      **从来没有在这两个平台上执行过一次**。
#      → 已改为 `node scripts/ci/run-selftests-all.mjs`（同一份清单，跑完再汇总）。
#
# ⚠️ **这两条截断的共同后果，正是本仓最贵的那类 bug**：
#    「没跑」和「跑了并通过」在这一格的输出里长得一模一样。
#    一个自称"把坏点一次列全"的探针，实际上每轮只列出**最靠前的那一个**。
#
# ⚠️ 判据：如果哪天有人想把这个 workflow 当**合并门禁**用（`push` / `pull_request`），
#    **必须先把 `!cancelled()` 全删掉**。
#    `schedule` 不在此列 —— 定时跑不挡任何人合并，而它恰恰最需要"一次列全"。
#    这条区分由 `scripts/ci/lint-workflows.mjs` 钉成断言，不是靠这段话。

name: ci-crossplatform

# ── 为什么加 cron（2026-08-23）───────────────────────────────────────────────────────
#
# 此前本文件是 `workflow_dispatch:` **only**。净效果实测过一次，代价很具体：
# run `31389910051`（2026-08-10）红着挂了 **12 天没有任何人知道**，
# 而同一段时间里主门禁 `ci.yml` 一直是绿的。
#
# ★ 而这 12 天里发生的事比"没人看"更坏：**那面红旗在说谎，并且越说越有底气。**
#   它宣称的红是 `apps/web/src/test/components.test.tsx` 的两个未用 import
#   —— 那条**在一天之内就被 `ci.yml` 拦下并修好了**。
#   12 天后重跑（run `32651393827`）：**control 与 lint 三平台全绿**，
#   而 macOS / Windows 上另有两组**真的、当天仍然存在的**红。
#   → **一次 dispatch 的结论不会随代码更新而失效，它会随代码更新而变成假话。**
#     这是"手动触发的探针"独有的失效形态：陈旧的红与新鲜的红长得一模一样，
#     而人只会看见最上面那一行日期。
#
# 六条 e2e 腿因为同一个病在 2026-08-12 铺了 cron（`e2e-allcomponents.yml:38-39`：
# 两个确证实例都是靠有人恰好手动跑才发现的）。**本文件当时不在那批里，只是因为
# 当时没人把它算进去** —— 不是因为它不需要。
#
# 时间取 **19:30 UTC**，接在六条腿的 15 分钟阶梯后面
# （allcomponents 18:00 / runtime 18:15 / browser 18:30 / notes 18:45 /
#   import 19:00 / record 19:15 / **本文件 19:30**）：
# 不是为了省钱（public 仓 $0），是别在同一时刻抢 runner 影响别人的 PR 判决。
#
# ⚠️ 本文件**没有 `inputs:`**，所以 #91 那条「`schedule` 下 `default:` 不生效、
#    空 inputs 会静默少跑」的整族问题在这里不适用 —— 不是被遗漏了，是不存在。
#    谁将来给它加 `inputs:`，请先读 `e2e-import.yml:35-52` 那段，再回来补兜底。
on:
  schedule:
    # 每天 19:30 UTC。⚠️ schedule 只在**默认分支**上触发 —— 这条 cron 在 PR 上验不了。
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-xplat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu 这一行是**对照组**，不是冗余：没有它，macOS/Windows 的红分不清是
          # "平台问题"还是"这一版代码本来就坏"。
          - { runner: ubuntu-24.04, label: linux-x64 (control) }
          - { runner: macos-26, label: darwin-arm64 }
          - { runner: windows-2025, label: win32-x64 }
          # ★ T-145 第二轮裁掉（用户 2026-08-05：「macos-x64 我用不到」）：
          #   - { runner: macos-15-intel, label: darwin-x64 }
          #   第一轮它跑过一次，结论是**和 darwin-arm64 逐条一致**
          #   （bash 3.2 / 大小写不敏感 / 同一条 pipeline 测试红），
          #   没有任何一条事实是只有 Intel Mac 才看得到的 —— 删掉不丢信息。
          #   要恢复把上面那行放回来即可。
    steps:
      # submodules 不拉：TS 侧一行都不需要 vendor/ 里的 C++ 源码。
      - uses: actions/checkout@v6

      # ADR-006 决策 7：Node 基线 22。**必须和 ci.yml 一致** ——
      # T-145 第一轮就是被这条咬到的：本机 Node 24 与 CI Node 22 的
      # `node --test` 默认发现规则不同，本机 868 全绿而 CI 当场红。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 放在 install **之前**：它只依赖 node，装依赖挂了也还能拿到这份事实表。
      #   这是本仓第一次在真 macOS / 真 Windows 上取得这些数据。
      - name: Platform facts (仪表，不是门禁)
        run: node scripts/ci/platform-facts.mjs

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages)
        if: ${{ !cancelled() }}
        run: pnpm build:safe

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # ★ T-171 补：此前本 workflow **没有 lint**，于是「跨平台门禁」在 lint 这一格上
      #   等于不存在 —— 它绿了只说明 **Linux 上**的 eslint 绿。
      #   （此处曾写「`ci.yml` 是全仓唯一自动触发的 workflow」。**已过期**：
      #     2026-08-12 起六条 e2e 腿带 cron，本文件从 2026-08-23 起也带。
      #     仍然成立的那半是「`ci.yml` 是唯一**挡合并**的 workflow」。）
      #
      #   为什么 lint 也需要跨平台跑（不是凑数）：eslint 的一部分判定与**文件系统**有关，
      #   而三个平台在这上面不一样 —— import 解析走真实路径（macOS/Windows 大小写不敏感，
      #   Linux 敏感 ⇒ `import './Foo'` 引 `foo.ts` 在 Linux 红、另两个平台绿），
      #   glob 展开与路径分隔符也不同。
      #
      #   ★ `[实测 run 32651393827，2026-08-23]` **三平台 lint 全绿。**
      #     此处曾写着 `[未验证]` 并请求「跑完回来更新这段话」—— 现在更新了。
      #     另有一次真阳性可以记账：run `31389910051`（2026-08-10）三平台 lint 同时红在
      #     `apps/web/src/test/components.test.tsx` 的两个未用 import 上。那**不是**
      #     平台差异（control 也红），它只是证明这一格确实在执行，不是摆设。
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # ⚠️ `--no-bail` 不是可选项，见文件头「订正」①。
      #    `pnpm -r test` 默认在**第一个失败的包**上停，而 pnpm 的包顺序是拓扑序 ——
      #    于是排在后面的包（Windows 上是 `apps/web` 559 条 + `apps/daemon` 785 条）
      #    在那一轮里**一条都没跑**，而输出里没有任何一个字说了这件事。
      #    探针要的是完整清单；门禁 `ci.yml` 那边**刻意保留** bail（它要的是快速判决）。
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail test

      # ★ T-171 补：此前本 workflow 也**没有 `test:ci-scripts`**。
      #
      #   ⚠️ **这一步在 macOS / Windows 上是红的，而那正是要它的理由**（探针不是门禁）。
      #
      #   为什么接进来：这些自检守的是 `build-backends.yml` 的判定逻辑，
      #   而那个 workflow **本来就要在三个平台上跑**。自检只在 Linux 上跑过，
      #   等于「用 Linux 的行为去证明 Windows 上的判定是对的」—— 本仓最贵的那类假绿。
      #
      # ── 🔴 一条**注释型断言**的现场（2026-08-23 订正，形态 ④）──────────────────────
      #
      #   此处曾写着一条 `[未验证，需真机]` 的预测（2026-08-07）：
      #     「`selftest-buildbox.sh` / `selftest-build-whisper.sh` 用到 `ldd`，
      #       Windows 上没有；macOS 上 `sed` 是 BSD 版」，
      #   并以「先让它红出来，再决定是修脚本还是按平台收窄」的语气收尾 ——
      #   读起来像是这条预测**已经交给机器去验了**。
      #
      #   **它没有。** 那两个 `.sh` 排在 `test:ci-scripts` 这条 `&&` 链的第 27、28 环，
      #   而链条 `[实测两次真跑一致]` win32 断在第 6 环、macOS 断在第 7 环。
      #   → **这条预测在 17 天里一次都没有被执行到**，而那段话看起来像它正被验着。
      #
      #   实际断在哪（两次真跑同一处，与那条预测无关）：
      #     · win32  ：`selftest-elf-glibc.mjs` —— objdump 认不出 Linux ELF 夹具
      #                （`file format not recognized`）。**这是一个 ELF/glibc 检查器，
      #                在 Windows 上跑它是范畴错误**，不是产品坏了。
      #     · darwin ：`selftest-pack-deps.mjs:118` —— `copyFileSync('/bin/true', …)`，
      #                而 macOS 上 `true` 在 `/usr/bin/true`，`/bin/true` 不存在。
      #                同样是 Linux-only 夹具，同样是范畴错误。
      #
      #   → 换成 `run-selftests-all.mjs` 之后链条会**跑到底**，那条 `ldd` / BSD `sed`
      #     的预测**第一次真的会被执行**。跑完请回来把结论写在这里，别再留预测。
      #     按平台收窄哪几条自检，要等这份**完整**清单出来再定 —— 拿一份被截断的清单
      #     去做收窄决定，就是本仓说的"量错东西"。
      # ★ 真机 CPU 探测实测：`detectCpuWin32()` 补上 IsProcessorFeaturePresent 之后，
      #   "写完了"与"真的查得出来"是两件事（Add-Type 可能被策略挡、P/Invoke 签名可能对不上），
      #   而这些失败模式的共同表现是**安静地返回空集合**。只有真机看得见。
      #   只报告不断言：Windows 上 features 仍为空，就是这次改动没成。
      - name: CPU 指令集探测实测（真机）
        # ★ 这一步是**取证**，不是门禁，所以不该被别人的红连坐。
        #   第一次跑它被前面 Test 的失败跳过了（那是 downloader 的并发用例，与它无关），
        #   于是"Windows 上到底探到什么"一个字都没拿到。
        if: ${{ !cancelled() }}
        run: node scripts/ci/probe-cpu-features.mjs

      # ⚠️ 跑的是**不短路**的那一版（`ci.yml` 的门禁仍跑短路版 `pnpm test:ci-scripts`）。
      #    两者读的是 `package.json` 里**同一条**清单 —— 不是两份会漂的名单。
      - name: CI scripts self-test (跑完再汇总，不在第一处红停下)
        if: ${{ !cancelled() }}
        run: node scripts/ci/run-selftests-all.mjs

      # ── ⛔ `pnpm format:check` **刻意没有接**，这里也不接，`ci.yml` 里也不接 ──────────
      #
      # `[T-171 实测 2026-08-07]` `npx prettier --check .` → **481 个文件不合格**
      # （历史记录：审计记 403、T-169 实测 476 —— 两个都已过期，别再引用那两个数）。
      #
      # 今天接进任何 workflow = 造一条**永远红**的门禁。而本仓自己写过判据：
      #   **「一条永远红的守卫等于一条被删掉的守卫，而且会训练人忽略红灯。」**
      # 顺序必须是「先把 481 个文件统一格式化 → 再上门禁」，反过来做只会让人给它加
      # `continue-on-error`，那就正好变成本文件头 ⚠️ 那条判据禁止的东西。
      #
      # → 这是一条**已登记的欠债**，不是被忘掉的。要清它请单开一个任务：
      #   一次 `pnpm format` 会碰几百个文件，与任何并行改动都必然冲突，
      #   所以它得独占一个提交窗口（PROTOCOL §10 推论：这类改动要么一次到位，要么申报窗口）。

      # T-141 §3 第 30 条预测过：这一步用 POSIX `find`，而 Windows 的 `FIND.exe` 是
      # grep 类工具，语义完全不同 → catch → 返回 [] → "没找到任何源码目录" → exit 1。
      # 放在最后单独一步，就是为了让那条预测**要么被证实、要么被推翻**。
      #
      # ★ 那条预测已经被证实、并且**已经修好**（T-147，`0588091`）：
      #   `check-tracked-sources.mjs` 不再调宿主 `find`，改用 Node 自己走目录 +
      #   `git check-ignore --stdin`。三平台实测同一个数：`✔ 95 个源码目录`
      #   （win32 见 run 31038276704）。所以这一步**现在应当是绿的，三个平台都是**。
      #
      # 这行说明本身是被更新过的 —— 它曾经写着「预期在 Windows 上红」，而它已经绿了。
      # 一句描述得很具体的过期说明比没有说明更能误导人：下一个看见它的人会以为
      # 这里的红是正常的，从而**不去查一个真的红**。过期的说明要更新，不是留着。
      - name: Tracked-sources guard (三平台都应为绿 —— T-141 §3 第 30 条已由 T-147 修复)
        if: ${{ !cancelled() }}
        run: pnpm check:sources
