# TypeScript 门禁：typecheck + lint + 全量测试。
#
# ── 为什么这个文件到今天才出现（platform T-141 §4 C11 / debt-audit C4）─────────────────
#
# 在此之前仓库里**只有一个 workflow**，而它只做二进制构建 —— **没有任何 CI 跑过
# `tsc` / `eslint` / `pnpm test`**。123 个提交，零自动门禁。
#
# 直接后果：`platform` 数出来全仓 **42 处** `process.platform` / `os.platform()` 分支，
# 其中 **34 处（81%）在开发机（Linux x64）上永远走不到**。
# → **这 34 条分支从写下来那天起，没有被任何自动化执行过一次。**
# 本文件也不会执行它们（GitHub runner 上跑的仍是 Linux），但它至少让
# **编译期**的跨平台错误（类型、未使用的分支、import 路径）在合并前就红。
#
# ── 触发方式：T-145 起改为**自动** ──────────────────────────────────────────────────
#
# 原本只有 `workflow_dispatch`，因为用户要求第一次由他手动发起并盯着。
# 2026-08-05 手动跑通（1m42s 绿）之后，用户指示改为自动触发 ——
# 理由就是那句：**「一个只能手动触发的 CI 不是 CI」**。
#
# `push` 限定 `branches: [master]` 是刻意的：加上 `pull_request:` 之后，
# 一个 PR 分支的推送**只会跑一次**（走 pull_request 事件），不会 push+PR 各跑一遍。
#
# ★ `build-backends.yml` **保持手动**，不要照抄这里。
#   它是 8 个 runner 的重型矩阵（CUDA 那两个单跑就 30+ 分钟），
#   而且它产出的是**发布物**不是门禁 —— 自动跑只会烧配额。
#
# ── 为什么**不加** `paths` / `paths-ignore` 过滤（判断题，理由写在这里）────────────
#
# 诱惑很实在：纯文档提交也跑一遍门禁看着像浪费。**但这里三条都不成立：**
#
# 1. **省不下多少。** 实测 1m42s（不是 6 分钟）。省下的是不到两分钟的 runner 时间，
#    而 public repo 的 Actions 是免费的。
#
# 2. **经典陷阱：被 `paths` 过滤掉的 job 在分支保护里显示为「未运行」而不是「通过」。**
#    今天这个仓库还没有分支保护，所以现在不痛；但等哪天加上"必须绿才能合并"，
#    一个 docs-only 的 PR 会**永远卡在 Expected — waiting for status**，
#    而且现场看起来像"CI 坏了"而不是"CI 没跑"。
#    **现在不加它是零成本的；等踩到再拆是有成本的。**
#
# 3. ★ **最要紧的一条：它和本仓正在清的那个病是同一个形状。**
#    `paths` 过滤的本质是"某些情况下这条检查**静默地不执行**"，
#    而今天一整天在清的 C4 / C5 / 假绿家族，共同点都是
#    **"没跑"和"跑了并通过"在结果里长得一模一样**。
#    在一个刚因为这个吃过大亏的仓库里，主动引入一个新的"静默不执行"开关，
#    省下的两分钟换不来它的风险。
#
#    并且这个仓库的 `docs/**` 并不是惰性的：`scripts/check-tracked-sources.mjs`
#    盯的是 `.gitignore` 覆盖面，`_comment:test` 又住在 `package.json` 里 ——
#    "只改了文档"这个前提本身就不一定成立。
#
# → **结论：不加过滤，每次 push / PR 都跑全量。** 什么时候值得重新考虑：
#   门禁时长涨到 10 分钟以上，或者仓库开始收外部 PR（配额压力真的出现）。
#   到那时正确的做法**不是** `paths`，而是让 job 永远启动、由**第一步**去判断
#   要不要跑重活 —— 那样检查依然会报 success，不会在分支保护里悬着。
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + lint + test
    runs-on: ubuntu-24.04
    # ★ 这些 outputs 只喂给下面的 `gate-summary` job（三态汇总，见该 job 的注释
    #   和 scripts/ci/summarize-gate.mjs 顶部注释）。不影响 gate 自己的 fail-fast：
    #   一个 step 没跑到，`steps.<id>.outcome` 就是 GitHub 自己给出的 `skipped`，
    #   这里原样透传，不代表 gate 允许它们在失败后继续跑。
    outputs:
      format_check: ${{ steps.format_check.outcome }}
      build: ${{ steps.build.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      tracked_sources: ${{ steps.tracked_sources.outcome }}
      orphan_exports: ${{ steps.orphan_exports.outcome }}
      ci_scripts_selftest: ${{ steps.ci_scripts_selftest.outcome }}
      test: ${{ steps.test.outcome }}
      mutation_anchors: ${{ steps.mutation_anchors.outcome }}
    steps:
      # submodules 刻意**不拉**：TS 侧一行都不需要 vendor/ 里的 C++ 源码，
      # 而 whisper.cpp / sherpa-onnx 加起来是几百 MB 的 checkout。
      - uses: actions/checkout@v6

      # ADR-006 决策 7：Node 基线 22（better-sqlite3 v13 要求 >= 22）。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      # ⚠️ **不加 `--ignore-scripts`**（与 build-backends 的 merge job 不同）：
      # 这里要跑真测试，`better-sqlite3` 之类的原生模块要能被 require 起来。
      #
      # ★ T-145 更正：这段注释原本写的是「`packages/pipeline` 的测试会用到
      #   ffmpeg-static / youtube-dl-exec 在 postinstall 下载的二进制」——
      #   **这句话是假的**，而且是在删掉那两个依赖时才发现的。实测三查全空：
      #   全仓没有任何 import/require、没有按路径引用 node_modules 里那两个二进制、
      #   `packages/pipeline/src/` 里一次都没出现过这两个名字。
      #   两个包已在 T-145 删除（理由见 packages/pipeline/package.json 的
      #   `_comment:removed-deps`），删完 `pnpm -r test` 仍是 874/0。
      #   —— 记在这里是因为**一条描述得很具体的错注释，比没有注释更能误导人**：
      #      它会让下一个想删依赖的人以为"测试要用，动不得"。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 全仓格式门禁（format-debt 本轮）。
      #
      # ── 为什么它到今天才进来 ──────────────────────────────────────────────────
      #
      # `format:check` 从很早就在 `package.json` 里，却**从来没接进任何自动流程**。
      # 不是忘了，是**接不进来**：`[实测]` 接之前全仓有 **508 个文件**不合格，
      # 直接加这一步就是一条开局即红的门禁。判据是本仓反复吃过亏的那条：
      # **一条永远红的守卫等于一条被删掉的守卫，而且会训练人忽略红灯。**
      #
      # 所以顺序是**先还债再上锁，且必须同一轮做完**：
      # 只格式化不上锁，几天后烂回去；只上锁不格式化，就是造那条永远红的守卫。
      # 还债那一步单独一个提交（纯格式化，`git blame` 时可以整跳过），本步骤是上锁那个。
      #
      # ── 为什么放在 Install 之后、Build 之前 ──────────────────────────────────
      #
      # 它只用到 node_modules 里的 prettier，不需要 build、不需要类型信息，
      # 放最前面失败得最快。
      #
      # ★ 但**顺序不影响结论**这件事是花了力气买来的，不是天然的：
      #   prettier **不读 `.gitignore`**（只读 `.prettierignore`），而
      #   `apps/web/.test-out/` 这类目录**只在跑过测试之后才存在**。
      #   `[实测]` 补 `.prettierignore` 之前：全仓格式化到干净 → 跑一次 `pnpm -r test`
      #   → `format:check` 当场红 **95 个文件，其中 92 个是 `.test-out/`**。
      #   即**同一棵树，跑没跑过测试会给出两种答案** —— CI 上绿、本地红，
      #   而"本地红 CI 绿"训练人忽略红灯的效果和"永远红"是一样的。
      #   已在 `.prettierignore` 里堵掉；被新忽略的**没有一个是版本库里的文件**
      #   （`git ls-files` 对那几条 pattern 命中 **0**），所以门禁覆盖的源码一个没少。
      #
      # ⚠️ prettier 3.9.6 在本仓**不是一次收敛**的：有 3 个文件要跑**第二遍**
      #   `pnpm format` 才到不动点（一个 blockquote 里的表格、一处 `_`/`*` 混用的
      #   强调、一条 JS 链式调用）。本地跑完 `pnpm format` 后这里若仍红，
      #   **再跑一遍 `pnpm format`** —— 那是 prettier 的非幂等，不是 CI 坏了。
      - name: Format check
        id: format_check
        run: pnpm format:check

      # ★ `pnpm build:safe`，**不是 `pnpm -r build`**（PROTOCOL §7 补充）。
      #
      # 在 CI 上这条区别其实不要紧（runner 是一次性的），但**保持和本地同一条命令**
      # 才有意义：本地跑 `pnpm -r build` 会覆盖 `apps/web/dist` —— 也就是用户
      # 正在 `:10000` 上看的那个前端 —— 而且不会有任何东西报错。两名 agent 先后踩过。
      # 前端的编译检查由下面的 `tsc -b` 覆盖（web 的 tsconfig 在 project references 里）。
      - name: Build (workspace packages)
        id: build
        run: pnpm build:safe

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Lint
        id: lint
        run: pnpm lint

      # 源码目录被 .gitignore 误伤的防线（真实事故：11 个源文件从未进过版本库，
      # 且 Tailwind 因此漏扫了整个目录）。它用 POSIX `find`，在 Linux runner 上没问题。
      - name: Tracked-sources guard
        id: tracked_sources
        run: pnpm check:sources

      # 「零调用方导出」棘轮（T-157 立，**T-169 才真正接进 CI**）。
      #
      # ── 为什么这一步到今天才出现 ──────────────────────────────────────────────
      #
      # T-157 的提交标题写的是「固化成门禁」，`progress-audit` 记的是「✅ 已装」，
      # 而 `closure-audit` 回头核了一遍：**它从来没在任何自动流程里跑过**。
      # 脚本在、基线在、`pnpm check` 里也在 —— 但 `.github/` 里 `grep -rn orphan` 零命中，
      # 没有 git hook，`pnpm check` 本身也没有任何自动调用方。
      # `scripts/mutation-check.mjs:22` 当时就写着「`pnpm check` 也没人跑」，没人当回事。
      #
      # 也就是说：**一把造好的锁，挂在一扇没人经过的门上，挂了整整一个版本周期。**
      # 期间棘轮一直是 72/72 没漏 —— 那是因为最近的改动恰好没引入新孤儿，
      # **不是因为有东西在挡**。「没跑」和「跑了并通过」在结果里长得一模一样，
      # 这正是本文件顶上那段注释在说的同一个病。
      #
      # ── 为什么是 `check:orphans` 而不是 `pnpm check` ──────────────────────────
      #
      # `pnpm check` = check:sources + check:orphans + tsc -b + build:safe + eslint。
      # 后三样上面已经各有一步了，直接调 `pnpm check` 会把 build 跑第二遍。
      # 这里只补真正缺的那一条。
      # （对账：`pnpm check` 的五个成员，此前只有 `check:orphans` 不在 CI 里，现在补齐。）
      #
      # ★ format-debt（本轮）更正上面这行对账：`pnpm check` 是**六个**成员，不是五个 ——
      #   漏数了 `node scripts/check-version-sync.mjs`。结论不受影响（它确实有自动调用方，
      #   是 `test:ci-scripts` 的第一个成员，见下面那一步），但**数目本身是错的**，
      #   而这种"对完账的错账"最容易被下一个人照抄。逐条复核见
      #   `coordination/inbox/format-debt.md`：六个成员今天全部有自动调用方。
      - name: Orphan-exports ratchet
        id: orphan_exports
        run: pnpm check:orphans

      # CI 脚本自身的正反向自检（T-144）。放在 test 前面：它比较快，
      # 而且它红的时候意味着 build-backends 那条线是坏的 —— 那是更要紧的信号。
      - name: CI scripts self-test
        id: ci_scripts_selftest
        run: pnpm test:ci-scripts

      - name: Test
        id: test
        run: pnpm -r test

      # ★ 变异规格的**锚点体检**（秒级，实测 0.086s）。
      #
      # 放在 Test **之后**是有原因的：18 条规格里有 6 条钉在 `apps/web/.test-out/**`，
      # 而那个目录是 `pnpm -r test` 里 web 的 test 脚本编出来的（`build:safe` 不编它）。
      # 放到 Test 前面，那 6 条会因为"产物不存在"而红 —— 一条假红。
      #
      # ⚠️ 它只回答「这些规格还指得到东西吗」，**不**回答「它们还抓得住变异吗」。
      #    后者是 `node scripts/mutation-check.mjs` 完整那一档，要几分钟，
      #    **有意不在门禁里**（它测的是护栏本身，不是产品）。
      #    这一步绿 ≠ 那一档可以不跑。脚本的输出里也写了同样的话。
      #
      # 为什么值得占门禁一格：`E1-state-dropped` 的锚点在 T-151 ⑥ 那次重构里失配，
      # 从此**什么都没测**，而没有任何东西会说出来 —— 因为唯一会说出来的那一档没人跑。
      # 这一步 0.086 秒，本来能在那天当场抓住它。
      - name: Mutation-spec anchors (只查锚点在不在 ≠ 规格还有牙齿)
        id: mutation_anchors
        run: node scripts/mutation-check.mjs --anchors-only

      # ★ 不加 `if: always()`、不加 `continue-on-error`。
      #
      # 这个仓库的核心病症是「失败被写成成功」（build-backends 的 merge job 就是
      # 一个现成的样本：三个构建全挂，它照样写出一个空 manifest 并绿灯）。
      # 任何让步骤"失败了也往下走"的写法，都会把这个 job 变成同一个东西。
      #
      # ── 2026-08-10：那"跳过看着像没跑过"的另一半，用一个独立 job 补 ──────────
      #
      # 上面这条铁律不变，但它有个没写出来的副作用：`gate` 一红，后面几个 step
      # 在 Actions 页面上全部显示成灰色 Skipped —— 这一天里连续 4 次 CI 运行，
      # `Test` 和 `Mutation-spec anchors` 一次都没真的执行过，页面上却只显得像
      # "某一步红了"，不像"9 条门禁里 5 条没跑"。`scripts/ci/lint-workflows.mjs`
      # 的 `MUST_FAIL_LOUDLY` 不许在**这个** job 里用 `always()` 治它（会撤回上面
      # 这条铁律要防的东西），所以治法搬到下面这个独立、只读不判定的
      # `gate-summary` job：它 `needs: gate` + `if: always()`
      # （不在 `MUST_FAIL_LOUDLY` 名单里），读上面 `outputs:` 透传出来的
      # `steps.<id>.outcome`，把"通过 / 失败 / 未验证"三态摊开数清楚。
      # 详细设计（包括为什么不是直接在这里加 always()）写在
      # `scripts/ci/summarize-gate.mjs` 顶部注释。

  gate-summary:
    name: gate 三态汇总（通过 / 失败 / 未验证）
    needs: gate
    # 这一步本身不许被跳过：一个用来报告"谁没跑到"的 step，如果自己也因为
    # gate 失败而 skipped，那就白做了。不在 lint-workflows.mjs 的
    # MUST_FAIL_LOUDLY 名单里（只有 `gate` 在），因为这个 job 不做任何判定，
    # 只读 gate 已经产生的 outcome 并数清楚，不会重演"没跑却报绿"。
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 汇总
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          GATE_STEP_NAMES: format_check,build,typecheck,lint,tracked_sources,orphan_exports,ci_scripts_selftest,test,mutation_anchors
          GATE_STEP_FORMAT_CHECK: ${{ needs.gate.outputs.format_check }}
          GATE_STEP_BUILD: ${{ needs.gate.outputs.build }}
          GATE_STEP_TYPECHECK: ${{ needs.gate.outputs.typecheck }}
          GATE_STEP_LINT: ${{ needs.gate.outputs.lint }}
          GATE_STEP_TRACKED_SOURCES: ${{ needs.gate.outputs.tracked_sources }}
          GATE_STEP_ORPHAN_EXPORTS: ${{ needs.gate.outputs.orphan_exports }}
          GATE_STEP_CI_SCRIPTS_SELFTEST: ${{ needs.gate.outputs.ci_scripts_selftest }}
          GATE_STEP_TEST: ${{ needs.gate.outputs.test }}
          GATE_STEP_MUTATION_ANCHORS: ${{ needs.gate.outputs.mutation_anchors }}
        run: node scripts/ci/summarize-gate.mjs

# ── TODO（登记，带过期谓词，不是"以后有空再说"）───────────────────────────────
#
# 现在 `gate` 仍是单个 job、9 个 step 顺序跑、一红全停 —— 这次只加了"跑完之后
# 数清楚"的 gate-summary，没有拆成 9 个可以互相独立报告状态的并行 job（15 job
# 那种结构性大改）。不做的理由：这一天里多个 agent 在同时推同一个 master
# （`concurrency.cancel-in-progress: true` 已经在这次任务里把两次在飞的 run
# 取消掉），这时候动一次影响整个门禁结构的大重构，风险和收益不成比例。
#
# 什么时候值得重新评估这条 TODO（可执行的判据，不是"以后"）：
#   连续检查 3 次、每次间隔 ≥ 1 小时，`git log --oneline --since=1.hour.ago | wc -l`
#   都 ≤ 1，**且** `gh run list --status in_progress --limit 5` 同一时刻看到的
#   在飞 run 数 ≤ 1 —— 也就是并发烈度真的降下来了，再做拆分；到那时单个 gate
#   job 顺序跑 9 个 step 的墙钟时间本身也会成为独立的理由。
# 在满足这条判据之前，"job 内不动、job 外补视野"是刻意的折中，不是偷懒。
