# TypeScript 门禁：typecheck + lint + 全量测试。
#
# ── 为什么这个文件到今天才出现（platform T-141 §4 C11 / debt-audit C4）─────────────────
#
# 在此之前仓库里**只有一个 workflow**，而它只做二进制构建 —— **没有任何 CI 跑过
# `tsc` / `eslint` / `pnpm test`**。123 个提交，零自动门禁。
#
# 直接后果：`platform` 数出来全仓 **42 处** `process.platform` / `os.platform()` 分支，
# 其中 **34 处（81%）在开发机（Linux x64）上永远走不到**。
# → **这 34 条分支从写下来那天起，没有被任何自动化执行过一次。**
# 本文件也不会执行它们（GitHub runner 上跑的仍是 Linux），但它至少让
# **编译期**的跨平台错误（类型、未使用的分支、import 路径）在合并前就红。
#
# ── 触发方式：T-145 起改为**自动** ──────────────────────────────────────────────────
#
# 原本只有 `workflow_dispatch`，因为用户要求第一次由他手动发起并盯着。
# 2026-08-05 手动跑通（1m42s 绿）之后，用户指示改为自动触发 ——
# 理由就是那句：**「一个只能手动触发的 CI 不是 CI」**。
#
# `push` 限定 `branches: [master]` 是刻意的：加上 `pull_request:` 之后，
# 一个 PR 分支的推送**只会跑一次**（走 pull_request 事件），不会 push+PR 各跑一遍。
#
# ★ `build-backends.yml` **保持手动**，不要照抄这里。
#   它是 8 个 runner 的重型矩阵（CUDA 那两个单跑就 30+ 分钟），
#   而且它产出的是**发布物**不是门禁 —— 自动跑只会烧配额。
#
# ── 为什么**不加** `paths` / `paths-ignore` 过滤（判断题，理由写在这里）────────────
#
# 诱惑很实在：纯文档提交也跑一遍门禁看着像浪费。**但这里三条都不成立：**
#
# 1. **省不下多少。** 实测 1m42s（不是 6 分钟）。省下的是不到两分钟的 runner 时间，
#    而 public repo 的 Actions 是免费的。
#
# 2. **经典陷阱：被 `paths` 过滤掉的 job 在分支保护里显示为「未运行」而不是「通过」。**
#    今天这个仓库还没有分支保护，所以现在不痛；但等哪天加上"必须绿才能合并"，
#    一个 docs-only 的 PR 会**永远卡在 Expected — waiting for status**，
#    而且现场看起来像"CI 坏了"而不是"CI 没跑"。
#    **现在不加它是零成本的；等踩到再拆是有成本的。**
#
# 3. ★ **最要紧的一条：它和本仓正在清的那个病是同一个形状。**
#    `paths` 过滤的本质是"某些情况下这条检查**静默地不执行**"，
#    而今天一整天在清的 C4 / C5 / 假绿家族，共同点都是
#    **"没跑"和"跑了并通过"在结果里长得一模一样**。
#    在一个刚因为这个吃过大亏的仓库里，主动引入一个新的"静默不执行"开关，
#    省下的两分钟换不来它的风险。
#
#    并且这个仓库的 `docs/**` 并不是惰性的：`scripts/check-tracked-sources.mjs`
#    盯的是 `.gitignore` 覆盖面，`_comment:test` 又住在 `package.json` 里 ——
#    "只改了文档"这个前提本身就不一定成立。
#
# → **结论：不加过滤，每次 push / PR 都跑全量。** 什么时候值得重新考虑：
#   门禁时长涨到 10 分钟以上，或者仓库开始收外部 PR（配额压力真的出现）。
#   到那时正确的做法**不是** `paths`，而是让 job 永远启动、由**第一步**去判断
#   要不要跑重活 —— 那样检查依然会报 success，不会在分支保护里悬着。
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

name: ci

permissions:
  contents: read

# ── 并发：master 的每个提交都要拿到判决；PR 分支保留"新的顶掉旧的" ──────────────
#
# ## 为什么改（数是量出来的，不是感觉）
#
# 原本是 `group: ci-${{ github.ref }}` + `cancel-in-progress: true`，也就是
# **master 上所有 push 共用一个组，后来的杀掉在飞的**。`[实测]` 2026-08-10 一天：
#
#   ci.yml 84 次 run = 55 failure / 18 **cancelled** / 11 success
#   → **18/84 = 21.4% 的推送，从头到尾没有拿到任何判决**
#
# 而「没判决」在事后和「没问题」**长得一模一样** —— 这正是本仓一整天在清的那个病。
#
# 取消换来的收益在这个仓**约等于 0**：
# - 仓库是 **public**、全部 GitHub 托管标准 runner（全仓无 self-hosted）
#   ⇒ **免费，没有分钟额度**，省不下钱；
# - `[实测]` 当天**根本没有排队**：run 领取延迟中位 **7.5 秒**、最大 29 秒；
#   取消开着时峰值并发 **3 个 run**，按当天到达时间重放建模、关掉取消后是
#   **5 个 run（≈10 个 job）**，在免费额度 20 个并发 job 之内。
#
# 一次完整 run 中位 **160 秒**（gate 136s / format 32s / gate-summary 9s）。
#
# ## ✅ 已验证（不再是"已配置未验证"）
#
# `[实测]` 2026-08-10 16:29-16:31，两跑**重叠 30 秒且都跑到了结论**：
#
#     f8cc1b7   起 16:29:32   止 16:30:43   failure
#     87e14e1   起 16:30:13   止 16:31:24   failure   ← 在上一跑还活着的时候开始的
#
# 改之前 `87e14e1` 那次推送会把 `f8cc1b7` 当场杀掉。另：最近 12 次运行 cancelled = **0**
# （对照改之前那天：84 次里 18 次 cancelled，21.4%）。
#
# ⚠️ 这条证据的**边界**，别读成"问题解决了"：它证明的只是**两跑重叠时不再互相取消**，
#    **不**证明下面那一档（非 head 提交）有任何改善；而且样本只有**一对**重叠 ——
#    要更强的证据，得看到**三跑以上同时活着也都拿到判决**。
#
# ## ⚠️ 为什么不是"把 cancel-in-progress 改成 false"就完事
#
# **只改这一个开关做不到目的。** GitHub 的默认是 `queue: single`：
# 「any existing **pending** job or workflow in the same concurrency group
# will be canceled」—— 也就是说只要还共用 `ci-${{ github.ref }}` 这一个组，
# 突发连推时中间那些提交**照样拿不到判决**，只是从"跑到一半被杀"
# 变成"排着队被顶掉"：**同一个结果，换了个死法。**
#
# 所以按 SHA 分组：**push 事件每个提交自己一组**，互不相干、全部并行、全部有判决。
# PR 事件仍按 ref 分组并保留取消 —— 在 PR 上"最后一版绿"才是要的结论，
# 中间版本被顶掉没有损失，而那恰恰是取消真正有价值的场景。
#
# （没有用 `queue: max`：它能让多个 run 排队而不是互相顶掉，但判决会来得很晚，
#   而"晚到的判决"本身就削弱门禁；且该属性较新，**没有验证过本账号是否支持**，
#   为一个拿不准的属性冒配置错的风险不值当。）
#
# ## ⚠️ 这条**没有**解决的那一档（别读成"现在每个提交都有判决了"）
#
# GitHub **只为一次 push 的 head 提交建 run**。所以**一次推多个提交时，
# 中间那些非 head 提交仍然拿不到任何判决** —— 按 SHA 分组也修不了这一档。
# `[实测]` 同一天 93 个提交里有 **9 个**落在这里（合计 66/93 = **71% 有判决**）。
#
# 裁决是**不上 merge queue**（重机械，不值当）：它的最坏后果是将来 bisect 时
# 那几个点没有结论，**不是主干状态没被验**（head 验了）。
# **这一档目前靠纪律兜着——「每步绿了立刻 commit + push」，一次一个提交——
# 不靠机器。** 谁要是把这句删了，就等于宣称机器管住了它，而机器并没有。
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Format check —— **独立 job，与 gate 并行**（2026-08-10）
  # ═══════════════════════════════════════════════════════════════════════════════
  #
  # 它原本是 `gate` 的**第一步**。那个位置有一个与它自身价值不相称的副作用：
  # 一个空格没对齐，`gate` 后面 8 条门禁**全部 skipped** —— 而 skipped 在 Actions
  # 的 UI 上是灰色的，不是红色的。`[实测 2026-08-10]` 连红五次、四个不同作者，
  # 其中一次是在别人正清理前一批的**那二十分钟里**落地的；期间
  # **8 条 × 5 轮 = 40 次检查没有发生**，任何真回归在那段时间里都是不可见的。
  # 更糟的是它挡住了发版：CI 红着不能在上面构建三平台包。
  #
  # ── 挪出来之后，什么变了、什么没变 ────────────────────────────────────────────
  #
  # · **没变**：它失败 ⇒ 这个 job 失败 ⇒ **整个 run 仍然是 failure**，分支保护照样拦。
  #   **红的强度一点没有削弱** —— 变的只有"谁挡着谁"。
  # · **变了**：格式问题不再让另外 8 条检查消失；而且反馈更快
  #   （这个 job 只需 install + 一条 prettier，不必排在 build/test 后面）。
  #
  # ── 为什么这不是在拆护栏 ─────────────────────────────────────────────────────
  #
  # `scripts/ci/lint-workflows.mjs` 的 `MUST_FAIL_LOUDLY['ci.yml'] = ['gate']` 禁止
  # 给 **`gate` 这个 job 的 step** 加 `if: always()` / `continue-on-error`（防的是
  # 「三个构建全挂照样绿灯」那一族）。**把一个检查挪到另一个 job 不在它的射程内**，
  # 而且这里一个 `always()` / `continue-on-error` 都没加 —— 与 `gate-summary`
  # 当初的思路相同：**绕过限制，而不是拆掉限制。**
  #
  # ⚠️ 连带必须做的一件事（已做，见 `gate-summary`）：并行之后
  # **「gate 绿」不再蕴含「格式绿」**，所以三态汇总必须把这个 job 的 result 也算进去，
  # 否则会出现「汇总说通过、run 是红的」—— 那正是这套汇总本身要治的病。
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      # `--ignore-scripts`：这个 job 只跑 prettier，不需要原生模块编译起来。
      # （`gate` 那边刻意**不加**这个旗标，因为它要跑真测试。）
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ⚠️ prettier 3.9.6 在本仓**不是一次收敛**的：有 3 个文件要跑第二遍
      #   `pnpm format` 才到不动点。本地跑完仍红时，**再跑一遍** —— 那是
      #   prettier 的非幂等，不是 CI 坏了。
      # ⚠️ 提交前用 `pnpm format:changed <照抄 pathspec>`（0.78s）先自查，
      #   别等这里红（PROTOCOL §12）。
      - name: Format check
        run: pnpm format:check

  gate:
    name: typecheck + lint + test
    runs-on: ubuntu-24.04
    # ★ 这些 outputs 只喂给下面的 `gate-summary` job（三态汇总，见该 job 的注释
    #   和 scripts/ci/summarize-gate.mjs 顶部注释）。不影响 gate 自己的 fail-fast：
    #   一个 step 没跑到，`steps.<id>.outcome` 就是 GitHub 自己给出的 `skipped`，
    #   这里原样透传，不代表 gate 允许它们在失败后继续跑。
    outputs:
      install: ${{ steps.install.outcome }}
      build: ${{ steps.build.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      tracked_sources: ${{ steps.tracked_sources.outcome }}
      orphan_exports: ${{ steps.orphan_exports.outcome }}
      test_ratchet: ${{ steps.test_ratchet.outcome }}
      locale_ratchet: ${{ steps.locale_ratchet.outcome }}
      ci_scripts_selftest: ${{ steps.ci_scripts_selftest.outcome }}
      test: ${{ steps.test.outcome }}
      mutation_anchors: ${{ steps.mutation_anchors.outcome }}
    steps:
      # submodules 刻意**不拉**：TS 侧一行都不需要 vendor/ 里的 C++ 源码，
      # 而 whisper.cpp / sherpa-onnx 加起来是几百 MB 的 checkout。
      - uses: actions/checkout@v6

      # ADR-006 决策 7：Node 基线 22（better-sqlite3 v13 要求 >= 22）。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      # ⚠️ **不加 `--ignore-scripts`**（与 build-backends 的 merge job 不同）：
      # 这里要跑真测试，`better-sqlite3` 之类的原生模块要能被 require 起来。
      #
      # ★ T-145 更正：这段注释原本写的是「`packages/pipeline` 的测试会用到
      #   ffmpeg-static / youtube-dl-exec 在 postinstall 下载的二进制」——
      #   **这句话是假的**，而且是在删掉那两个依赖时才发现的。实测三查全空：
      #   全仓没有任何 import/require、没有按路径引用 node_modules 里那两个二进制、
      #   `packages/pipeline/src/` 里一次都没出现过这两个名字。
      #   两个包已在 T-145 删除（理由见 packages/pipeline/package.json 的
      #   `_comment:removed-deps`），删完 `pnpm -r test` 仍是 874/0。
      #   —— 记在这里是因为**一条描述得很具体的错注释，比没有注释更能误导人**：
      #      它会让下一个想删依赖的人以为"测试要用，动不得"。
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # ── 为什么下面每一步都带 `if:` —— #75 在这一层的转世 ──────────────────────
      #
      # `[实测]` run 31415258130：**一条 lint 红，后面 7 道守卫全部 skipped。**
      # 跟 #75 是同一个形状（那次是 Format check 红 → 下游 8 个 job 全 skipped），
      # 只是从 job 层搬到了 step 层。
      #
      # ★ 判据不是"全都加 always() 了事"，而是**逐步问一句：
      #   前面那步失败，这步是不是真的失去意义了？**
      #   `[实测]` 在一个**没有跑过 build** 的干净 clone 里逐个跑（/tmp/dep-probe）：
      #
      #     check:sources / check:orphans / check:test-ratchet / check:locale  → 全部 exit 0
      #     tsc -b                                                            → exit 0（它自己会编）
      #     eslint .                                                          → 正常出结论
      #     test:ci-scripts   → exit 1「加载 @openmemo/shared/dist 失败」  ← **真依赖 build**
      #     mutation --anchors-only → exit 1「锚点失效」（读 dist/.test-out）← **真依赖 build**
      #     pnpm -r test      → 每个包的 test 脚本先比 src/dist 数量，缺 dist 直接抛
      #                          「test discovery broken …先 pnpm build:safe」← **真依赖 build**
      #
      # 所以：**6 步只是排在后面（假依赖），3 步是真依赖**。真依赖那几步跳过是**诚实的**，
      # 假依赖那几步跳过是**信息损失** —— 那正是这次要修的。
      #
      # ⚠️ 用 `!cancelled()` 而不是 `always()`：
      #   ① `always()` 在 run 被取消时还会跑，纯属浪费（我们现在按 SHA 分组，取消变少但仍存在）；
      #   ② `lint-workflows.mjs` 明确禁 `always()`，那条禁令针对的是**盖住失败**。
      # ★ 这里**没有**盖住任何失败：**没有任何一步带 `continue-on-error`**，
      #   失败的那一步照样把整个 job 判红。加 `if:` 只改变"别的步骤要不要跑"，
      #   **不改变"红不红"**。两者的区别已写进 lint-workflows 的那条断言里。
      - name: Build (workspace packages)
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:safe

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      # 源码目录被 .gitignore 误伤的防线（真实事故：11 个源文件从未进过版本库，
      # 且 Tailwind 因此漏扫了整个目录）。它用 POSIX `find`，在 Linux runner 上没问题。
      - name: Tracked-sources guard
        id: tracked_sources
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:sources

      # 「零调用方导出」棘轮（T-157 立，**T-169 才真正接进 CI**）。
      #
      # ── 为什么这一步到今天才出现 ──────────────────────────────────────────────
      #
      # T-157 的提交标题写的是「固化成门禁」，`progress-audit` 记的是「✅ 已装」，
      # 而 `closure-audit` 回头核了一遍：**它从来没在任何自动流程里跑过**。
      # 脚本在、基线在、`pnpm check` 里也在 —— 但 `.github/` 里 `grep -rn orphan` 零命中，
      # 没有 git hook，`pnpm check` 本身也没有任何自动调用方。
      # `scripts/mutation-check.mjs:22` 当时就写着「`pnpm check` 也没人跑」，没人当回事。
      #
      # 也就是说：**一把造好的锁，挂在一扇没人经过的门上，挂了整整一个版本周期。**
      # 期间棘轮一直是 72/72 没漏 —— 那是因为最近的改动恰好没引入新孤儿，
      # **不是因为有东西在挡**。「没跑」和「跑了并通过」在结果里长得一模一样，
      # 这正是本文件顶上那段注释在说的同一个病。
      #
      # ── 为什么是 `check:orphans` 而不是 `pnpm check` ──────────────────────────
      #
      # `pnpm check` = check:sources + check:orphans + tsc -b + build:safe + eslint。
      # 后三样上面已经各有一步了，直接调 `pnpm check` 会把 build 跑第二遍。
      # 这里只补真正缺的那一条。
      # （对账：`pnpm check` 的五个成员，此前只有 `check:orphans` 不在 CI 里，现在补齐。）
      #
      # ★ format-debt（本轮）更正上面这行对账：`pnpm check` 是**六个**成员，不是五个 ——
      #   漏数了 `node scripts/check-version-sync.mjs`。结论不受影响（它确实有自动调用方，
      #   是 `test:ci-scripts` 的第一个成员，见下面那一步），但**数目本身是错的**，
      #   而这种"对完账的错账"最容易被下一个人照抄。逐条复核见
      #   `coordination/inbox/format-debt.md`：六个成员今天全部有自动调用方。
      - name: Orphan-exports ratchet
        id: orphan_exports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:orphans

      # 「守卫文件不许静默消失」棘轮。
      #
      # ── 事故（今天，两次）──────────────────────────────────────────────────
      #
      # `31d3ae3` 的提交信息自述「**只改注释，零行为变更**」，实际**静默删除了**
      # `packages/runtime/src/backends/platformUnsupported.test.ts`，**191 行**
      # （`7581cff` 恢复）。删除在 `git show --stat` 里明明白白，
      # **但提交者自己的 diff 里看不到** —— 成因是提交前读的是一份陈旧索引。
      #
      # > 在共享树上，**从陈旧索引提交 = 静默删除别人已提交的文件**。
      #
      # 纪律拦不住它：那 191 行**是可见的**，只是**没人看**。所以判据不建立在
      # 提交信息上（这次正是提交信息说了假话），也不建立在"有没有人去看 diff"上 ——
      # **只看一件事实：在册的那个文件现在还在不在。**
      #
      # ── 为什么是独立一步，而不是塞进上一步 ────────────────────────────────
      #
      # 它的自检已经在下面的 `CI scripts self-test` 里跑了（`test:ci-scripts` 的一员），
      # 那条里也确实拿真仓库跑了一次真脚本。但**靠自检当门禁是间接的**：
      # 哪天有人把自检里那条"真仓库"用例删掉，门禁就**无声地消失**，
      # 而这正是本仓一直在清的病。所以给它一格自己的、能被三态汇总数到的位置。
      #
      # ⚠️ 加 step 不是加 job：#75 的教训是 **job** 拆出去之后下游 `needs` 全 skipped。
      #    step 留在 `gate` 里，一红就整条停，和 orphan 棘轮完全同构。
      #
      # ★ 新增 step 必须同时补三处，否则 `gate-summary` 会**数不到它**（= 又一个
      #   "没跑和跑了并通过长得一样"）：① 上面 `outputs:` 里的一行、
      #   ② 下面 gate-summary 的 `GATE_STEP_NAMES`、③ 那里的 `GATE_STEP_*` env。
      #   `selftest-summarize-gate.mjs` 现在会**逐条比对这三处和 STEP_LABELS 是否一致**，
      #   漏补哪一处都会当场红。
      # ★ `--against <基准>` 堵的是本守卫**自己申报过**的那个缺口：
      #   它的记忆存在版本库里，所以「把整棵树回退到更早快照」会把测试文件
      #   **和基线一起**退回去 —— 两边一致，普通判据全绿。
      #   而「基线只增不减」是已经立好的规矩，所以**基线自己缩了**就是可判的异常，
      #   整树回退正好落在这个信号上。
      #
      # ⚠️ 只**定点取一个 commit**，不动 checkout 的 `fetch-depth`：
      #   加深整个克隆会给**每个 job** 都加代价，为一个罕见场景拖慢整条流水线。
      #   这里只需要读基准上的**一份文件**。
      #   `[实测]` depth=1 浅克隆里定点 fetch 一个历史 SHA：**1.8 秒**，
      #   随后 `git show <sha>:scripts/test-ratchet-baseline.json` 正常读出。
      #
      # ★ `|| true` 只兜 **fetch** 那一步，**不兜判定**。这不是"失败被写成成功"：
      #   基准取不到时脚本会在输出里**明说「历史比对没跑成」**，而不是安静放行 ——
      #   force-push / 新分支首推本来就取不到基准，为它判红等于造一盏
      #   经常为合法情况亮的灯（那正是本轮把「新增未登记」降级的同一条判据）。
      - name: Test-file ratchet (守卫文件不许静默消失)
        id: test_ratchet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # push 用上一个 master SHA；PR 用目标分支的 base。取不到就是空串。
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --depth=1 --no-tags origin "$BASE_SHA" || true
          fi
          pnpm check:test-ratchet --against "$BASE_SHA"

      # locale key 守卫。事故：`zh-CN.json` 被另一路**按整文件重写**（中途还出现过
      # 0 字节的中间态），从一个更早的版本覆盖过去，于是刚加的
      # `search.tokenizerDegraded` **静默没了** —— 不报错、不冲突、git 也不提示。
      #
      # ⚠️ 判据**不是**照抄测试文件棘轮的「在册 key 消失就红」。我先量了历史：
      #   `[实测]` 75 个改过 locale 的提交里那样会触发 **8 次，8 次全是误报**
      #   （5 次改名 + 3 次功能整块下线），**真意外丢失 0 次** ——
      #   而且它连这次事故都抓不到（丢掉的那个 key 从来没提交进 zh-CN）。
      #   造一盏几乎只为合法工作亮的灯，和今天已经推翻过一次的那个是同一个错。
      #
      # 换成三条**量过、误报为 0** 的：
      #   ① 两份 locale 的 key 集合必须一致 —— **整文件重写恰恰是不对称的**，
      #      正好落在这条上；`[实测]` 75 个提交里它一次都没误报过。
      #   ② 源码 `t('…')` 用到的 key，每份 locale 都得有（认 i18next 复数后缀）——
      #      补 ① 的盲区：两份**同时**被重写时 ① 看不见，但代码还在用它。
      #   ③ 合法 JSON + key 数地板 —— 直接对着那个 **0 字节中间态**。
      - name: Locale key guard (翻译 key 不许被静默丢掉)
        id: locale_ratchet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:locale

      # CI 脚本自身的正反向自检（T-144）。放在 test 前面：它比较快，
      # 而且它红的时候意味着 build-backends 那条线是坏的 —— 那是更要紧的信号。
      # ↓ 这三步是**真依赖**（实测：没 build 就直接抛「先 pnpm build:safe」），
      #   所以它们跳过是**诚实的** —— 不该硬拉起来跑一个注定失败的假红。
      - name: CI scripts self-test
        id: ci_scripts_selftest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:ci-scripts

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -r test

      # ★ 变异规格的**锚点体检**（秒级，实测 0.086s）。
      #
      # 放在 Test **之后**是有原因的：18 条规格里有 6 条钉在 `apps/web/.test-out/**`，
      # 而那个目录是 `pnpm -r test` 里 web 的 test 脚本编出来的（`build:safe` 不编它）。
      # 放到 Test 前面，那 6 条会因为"产物不存在"而红 —— 一条假红。
      #
      # ⚠️ 它只回答「这些规格还指得到东西吗」，**不**回答「它们还抓得住变异吗」。
      #    后者是 `node scripts/mutation-check.mjs` 完整那一档，要几分钟，
      #    **有意不在门禁里**（它测的是护栏本身，不是产品）。
      #    这一步绿 ≠ 那一档可以不跑。脚本的输出里也写了同样的话。
      #
      # 为什么值得占门禁一格：`E1-state-dropped` 的锚点在 T-151 ⑥ 那次重构里失配，
      # 从此**什么都没测**，而没有任何东西会说出来 —— 因为唯一会说出来的那一档没人跑。
      # 这一步 0.086 秒，本来能在那天当场抓住它。
      # 真依赖 build **和** Test：18 条锚点里有 6 条钉在 `apps/web/.test-out/**`，
      # 而那个目录是 `pnpm -r test` 里 web 的 test 脚本编出来的。Test 没跑成 ⇒
      # 锚点必然对着空气 ⇒ 那是**假红**，跳过才诚实（汇总里会显示为「未验证」）。
      - name: Mutation-spec anchors (只查锚点在不在 ≠ 规格还有牙齿)
        id: mutation_anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.test.outcome == 'success' }}
        run: node scripts/mutation-check.mjs --anchors-only

      # ★ 不加 `if: always()`、不加 `continue-on-error`。
      #
      # 这个仓库的核心病症是「失败被写成成功」（build-backends 的 merge job 就是
      # 一个现成的样本：三个构建全挂，它照样写出一个空 manifest 并绿灯）。
      # 任何让步骤"失败了也往下走"的写法，都会把这个 job 变成同一个东西。
      #
      # ── 2026-08-10：那"跳过看着像没跑过"的另一半，用一个独立 job 补 ──────────
      #
      # 上面这条铁律不变，但它有个没写出来的副作用：`gate` 一红，后面几个 step
      # 在 Actions 页面上全部显示成灰色 Skipped —— 这一天里连续 4 次 CI 运行，
      # `Test` 和 `Mutation-spec anchors` 一次都没真的执行过，页面上却只显得像
      # "某一步红了"，不像"9 条门禁里 5 条没跑"。`scripts/ci/lint-workflows.mjs`
      # 的 `MUST_FAIL_LOUDLY` 不许在**这个** job 里用 `always()` 治它（会撤回上面
      # 这条铁律要防的东西），所以治法搬到下面这个独立、只读不判定的
      # `gate-summary` job：它 `needs: gate` + `if: always()`
      # （不在 `MUST_FAIL_LOUDLY` 名单里），读上面 `outputs:` 透传出来的
      # `steps.<id>.outcome`，把"通过 / 失败 / 未验证"三态摊开数清楚。
      # 详细设计（包括为什么不是直接在这里加 always()）写在
      # `scripts/ci/summarize-gate.mjs` 顶部注释。

  gate-summary:
    name: gate 三态汇总（通过 / 失败 / 未验证）
    # ★ 也 needs format：并行之后「gate 绿」不再蕴含「格式绿」，
    #   不把它算进来就会出现「汇总说通过、run 是红的」。
    needs: [gate, format]
    # 这一步本身不许被跳过：一个用来报告"谁没跑到"的 step，如果自己也因为
    # gate 失败而 skipped，那就白做了。不在 lint-workflows.mjs 的
    # MUST_FAIL_LOUDLY 名单里（只有 `gate` 在），因为这个 job 不做任何判定，
    # 只读 gate 已经产生的 outcome 并数清楚，不会重演"没跑却报绿"。
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 汇总
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          GATE_STEP_NAMES: format_check,install,build,typecheck,lint,tracked_sources,orphan_exports,test_ratchet,locale_ratchet,ci_scripts_selftest,test,mutation_anchors
          # ★ 来自**独立 job** 的 result（不再是 gate 的 step outcome）。
          #   job result 与 step outcome 用的是同一套词汇（success/failure/skipped/cancelled），
          #   所以 summarize-gate.mjs 一个字都不用改：失败→「失败」、跳过/取消→「未验证」，
          #   两者都会让 allPass 为假并令这一步非零退出。
          GATE_STEP_FORMAT_CHECK: ${{ needs.format.result }}
          GATE_STEP_INSTALL: ${{ needs.gate.outputs.install }}
          GATE_STEP_BUILD: ${{ needs.gate.outputs.build }}
          GATE_STEP_TYPECHECK: ${{ needs.gate.outputs.typecheck }}
          GATE_STEP_LINT: ${{ needs.gate.outputs.lint }}
          GATE_STEP_TRACKED_SOURCES: ${{ needs.gate.outputs.tracked_sources }}
          GATE_STEP_ORPHAN_EXPORTS: ${{ needs.gate.outputs.orphan_exports }}
          GATE_STEP_TEST_RATCHET: ${{ needs.gate.outputs.test_ratchet }}
          GATE_STEP_LOCALE_RATCHET: ${{ needs.gate.outputs.locale_ratchet }}
          GATE_STEP_CI_SCRIPTS_SELFTEST: ${{ needs.gate.outputs.ci_scripts_selftest }}
          GATE_STEP_TEST: ${{ needs.gate.outputs.test }}
          GATE_STEP_MUTATION_ANCHORS: ${{ needs.gate.outputs.mutation_anchors }}
        run: node scripts/ci/summarize-gate.mjs

# ── TODO（登记，带过期谓词，不是"以后有空再说"）───────────────────────────────
#
# 现在 `gate` 仍是单个 job、9 个 step 顺序跑、一红全停 —— 这次只加了"跑完之后
# 数清楚"的 gate-summary，没有拆成 9 个可以互相独立报告状态的并行 job（15 job
# 那种结构性大改）。不做的理由：这一天里多个 agent 在同时推同一个 master
# （`concurrency.cancel-in-progress: true` 已经在这次任务里把两次在飞的 run
# 取消掉），这时候动一次影响整个门禁结构的大重构，风险和收益不成比例。
#
# 什么时候值得重新评估这条 TODO（可执行的判据，不是"以后"）：
#   连续检查 3 次、每次间隔 ≥ 1 小时，`git log --oneline --since=1.hour.ago | wc -l`
#   都 ≤ 1，**且** `gh run list --status in_progress --limit 5` 同一时刻看到的
#   在飞 run 数 ≤ 1 —— 也就是并发烈度真的降下来了，再做拆分；到那时单个 gate
#   job 顺序跑 9 个 step 的墙钟时间本身也会成为独立的理由。
# 在满足这条判据之前，"job 内不动、job 外补视野"是刻意的折中，不是偷懒。
