# Build whisper.cpp backend packs for every platform x backend we support.
#
# OWNER: gpu-runtime (T-012). Design: docs/design/D-04-build-and-runtime.md.
# T-144 (ci-prep): fixed the 11 defects `platform` catalogued in
# coordination/inbox/platform.md §4. See "WHAT CHANGED IN T-144" below.
#
# ┌──────────────────────────────────────────────────────────────────────────────────────┐
# │ ⚠️  STILL UNVERIFIED: THIS WORKFLOW HAS NEVER BEEN EXECUTED ON A RUNNER.              │
# │                                                                                       │
# │ What HAS been verified locally (Linux x64), by extracting each step into a real       │
# │ script and running it — `pnpm test:ci-scripts`:                                       │
# │   - manifest fragment generation -> passes the real BackendPackSchema                 │
# │   - merge into backends.json     -> upserts, never overwrites, validates before write │
# │   - every failure path           -> non-zero exit AND no file written                 │
# │   - build-whisper.sh's non-compile logic under a stubbed cmake, incl. the MSVC        │
# │     multi-config output layout and the win/macos pack-id tokens                       │
# │                                                                                       │
# │ What has NOT been verified and cannot be from here:                                   │
# │   - anything that requires a real compiler, GPU SDK, macOS, or Windows                 │
# │   - the `needs:` / job-skipping semantics below (reasoned from GitHub docs only)       │
# │   - toolchain installation steps (choco/apt/CUDA/ROCm/Vulkan actions)                  │
# │                                                                                       │
# │ First real run WILL still need fixing. Expect: SDK path drift, disk exhaustion on     │
# │ the CUDA job, and MSVC generator quirks.                                              │
# └──────────────────────────────────────────────────────────────────────────────────────┘
#
# ── WHAT CHANGED IN T-144 ──────────────────────────────────────────────────────────────
#   C1  merge-manifest overwrote backends.json wholesale (all upstream packs vanished)
#       -> now `scripts/ci/merge-backend-manifest.mjs`, which upserts by id.
#   C2  build-whisper.sh's printf fragment was schema-incompatible (8 missing required
#       fields, 4 undeclared, zero URLs)
#       -> now `scripts/ci/emit-pack-manifest.mjs`, with a local schema round-trip test.
#   C3  merged manifest had no top-level `catalogVersion` -> daemon could not load it
#       -> the merge script carries it over and validates before writing.
#   C4  `if: always()` wrote `packs: []` and went GREEN when every build failed
#       -> removed. Builds fail -> workflow is RED and merge never runs. Belt-and-braces:
#          the merge script also exits 1 on zero fragments (download-artifact succeeds
#          with nothing to download).
#   C5  ad-hoc signature check `continue`d over an unmatched glob and passed silently
#       -> counts what it checked and fails on zero.
#   C6  `choco install ninja` but build-whisper.sh never passes `-G Ninja`
#       -> removed the install. See the note on the windows job.
#   C7  workflow hard-coded `.build/whisper-win32-<arch>-cpu/bin`
#       -> build-whisper.sh exports bin_dir/stage_dir/pack_id via $GITHUB_OUTPUT.
#   C8  `-DCMAKE_INSTALL_RPATH='$ORIGIN'` on macOS (dyld wants @loader_path)
#       -> fixed in build-whisper.sh.
#   C9  pack ids would have been `whispercpp-cpu-win32-x64` vs the hand-written
#       `whispercpp-cpu-win-x64` -> same pack, two ids
#       -> fixed in build-whisper.sh (PACK_OS).
#   C10 daemon looked for `probe`, everything else produces `openmemo-probe`
#       -> fixed in apps/daemon/src/runtime/setup.ts.
#   C11 no CI ran tsc / eslint / tests -> see .github/workflows/ci.yml.
# ───────────────────────────────────────────────────────────────────────────────────────
#
# Runner labels were verified against docs.github.com and actions/runner-images on
# 2026-08-02: macos-13 has been REMOVED and macos-14 is deprecated, so Intel macOS builds
# use `macos-15-intel` and Apple silicon uses `macos-26`. `ubuntu-24.04-arm` is free for
# public repositories.

name: build-backends

# ⚠️ ADR-015（上游预编译优先）：本 workflow 已**降级为按需触发**，不再是默认路径。
#
# 现在 whisper.cpp / sherpa-onnx / ffmpeg / libsimple / sqlite-vec / yt-dlp
# 六个组件**全部直连上游预编译产物**（T-063 逐个实地核实过"上游有没有我们要的那个
# 平台+后端的产物"）。少一套 CI 就少一类维护负担，也少一个"我们打的包和上游不一致"的风险。
# （原来这里还写着 llama.cpp —— T-144 已按 ADR-016 决策 3 整条摘除。）
#
# 只有在上游确实缺失时才手动触发本 workflow：
#   - whisper.cpp 的 Vulkan / ROCm / macOS CLI（上游至今没有）
#   - 需要自定义编译选项（例如单架构 CUDA 瘦身，见 D-04 §5）
#
# 触发方式仅保留 workflow_dispatch；原先的 tag push 触发已移除，避免它悄悄变回默认路径。
on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: 'whisper.cpp ref to build (defaults to the pinned submodule)'
        required: false
        default: ''
      publish:
        description: 'Attach the packs to a draft release'
        type: boolean
        required: false
        default: false
      # ★ T-163：只跑其中一组 job。
      #
      # 加它的直接理由是实测成本：本 workflow 只能整份 dispatch，一次要烧 8 个 job
      # （含两个 macOS runner）。T-161 有一轮 GitHub Actions 正在故障，五条腿全死在
      # `Set up job`，一行我们的代码都没跑到 —— 那一轮里**唯一有信息量的只有 linux**，
      # 其余全是噪声与 macOS 分钟数。
      #
      # ⚠️ 只跑一组时 `merge-manifest` 会**被跳过**（它 `needs:` 三组，有一组 skipped
      #    整个 job 就 skipped）。那不是缺陷，是正确结果：**半份矩阵合出来的目录比没有目录更糟**
      #    —— 这正是 C4 那条 `if: always()` 被删掉的理由，`lint-workflows.mjs` 还钉着
      #    「manifest job 不许有任何 if:」，所以这条路是堵死的，不需要额外守卫。
      legs:
        description: 'Which job group to run'
        type: choice
        required: false
        default: all
        options: [all, linux, macos, windows]

# T-144: was `contents: write`. Nothing in this workflow creates a release or pushes a
# commit — the "publish" step only prints a reminder. Least privilege by default; widen
# it deliberately if publishing is ever wired up.
permissions:
  contents: read

# Two concurrent full-matrix runs would race on the ccache keys and burn macOS minutes
# for nothing. Manual dispatch makes that easy to do by accident (double-click).
concurrency:
  group: build-backends-${{ github.ref }}
  cancel-in-progress: false

env:
  # ADR-004 decision 5: our downloader verifies SHA256 (Ollama's does not). The build
  # emits the digests; nothing downstream is allowed to trust an unverified artifact.
  PACK_OUTPUT_DIR: dist/packs

jobs:
  # =====================================================================================
  # macOS — Metal is the only accelerator that matters here, and it costs zero extra
  # bytes: GGML_METAL_EMBED_LIBRARY compiles the shaders into the binary, so the Metal
  # "pack" ships inside the core pack. Apple silicon also REQUIRES at least an ad-hoc
  # signature or the binary will not execute at all (ADR-003 decision 4).
  # =====================================================================================
  macos:
    name: macos-${{ matrix.arch }}-${{ matrix.backend }}
    if: inputs.legs == 'all' || inputs.legs == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26,       arch: arm64, backend: metal }
          - { runner: macos-26,       arch: arm64, backend: cpu }
          # ★ T-145 矩阵裁剪（用户 2026-08-05：「macos-x64 我用不到」）。原行：
          #   # Intel Macs have no supported GPU backend in ggml — CPU/AVX2 only.
          #   - { runner: macos-15-intel, arch: x64,   backend: cpu }
          #   → macOS Intel 从此**没有任何 whisper 产物**（上游本来也没有，见
          #     platform T-141 §1.2 第 2 行）。要恢复把上面两行放回来即可。
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # scripts/ci/emit-pack-manifest.mjs is plain node with zero dependencies, so this
      # is all the toolchain the build jobs need (no `pnpm install`).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: macos-${{ matrix.arch }}-${{ matrix.backend }}

      - name: Build pack
        id: build
        run: |
          bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs $(sysctl -n hw.logicalcpu)

      # ★★★ T-167：**macOS 部署目标守卫**（D-11 §8.0 那一族的 macOS 那一格）。
      #
      # 与 Linux 的 `check-elf-glibc` 是同一条规律的两个面：不显式指定部署目标，
      # 编译器就把**构建机自己的系统版本**写进 `LC_BUILD_VERSION.minos`，而 runner 是
      # `macos-26`。`[CI 实测 T-146]` 那次是包里 12 个二进制全是 `minos=26.0.0`
      # ——「下载成功、校验通过、一执行就死」。
      #
      # 那次修的是 `build-whisper.sh`。`[本机实测 T-167]` 把同一轮 CI 的产物解开逐个读：
      #   包里 20 个 Mach-O   minos = 13.3.0
      #   dist/probe/openmemo-probe  minos = 26.0.0   ← **同一个洞，另一个文件**
      # 所以现在它是一步会红的守卫，而不是两个脚本里各自的一行 flag。
      #
      # 覆盖面是 `stage_dir`（= 整个包），而探针从 T-167 起就在包里，
      # 于是它**自动**落进这条守卫 —— 这正是"随包出厂"顺带买到的性质。
      - name: Guard macOS deployment target
        run: |
          node scripts/ci/check-macho-minos.mjs \
            --dir "${{ steps.build.outputs.stage_dir }}" \
            --max 13.3

      # T-167：探针不再单独编译一次 —— 它已经由 build-whisper.sh 编进包里了。
      # 这一步只是把**同一份字节**复制出来当独立 artifact。
      # 判据：被守卫验过的那个文件，和用户拿到的那个文件，必须是同一个。
      # 单独再编一次会产生"两个都叫 openmemo-probe、但没人保证一样"的东西。
      - name: Copy the in-pack probe out as a standalone artifact
        if: matrix.backend == 'cpu'
        run: |
          set -euo pipefail
          mkdir -p dist/probe
          cp "${{ steps.build.outputs.probe_path }}" dist/probe/openmemo-probe
          ls -l dist/probe

      # ADR-003 decision 4: ad-hoc only. No Developer ID, no notarisation, no stapling —
      # the user's brief is personal use and no certificates were purchased. D-04 §7
      # documents the paid upgrade path.
      #
      # ⚠️ ADR-003:83 claims the daemon clears com.apple.quarantine after download.
      # `platform` T-141 §3.0-③ grepped the whole repo: **there is no such code**. Three
      # documents describe a function that does not exist. Do not rely on it.
      #
      # C5: the old version was `for f in .build/whisper-darwin-*/stage/*/*` with
      # `[ -f "$f" ] || continue`. When the glob matches nothing bash leaves the literal
      # pattern in place, every iteration `continue`s, and the step passes having checked
      # **zero files**. A guard whose failure mode is "silently pass" is not a guard.
      - name: Verify ad-hoc signature
        run: |
          set -euo pipefail
          stage="${{ steps.build.outputs.stage_dir }}"
          [ -n "$stage" ] || { echo "::error::build step did not report stage_dir"; exit 1; }
          [ -d "$stage" ] || { echo "::error::stage dir does not exist: $stage"; exit 1; }
          checked=0
          while IFS= read -r f; do
            case "$f" in
              # ★ T-145 第三轮：**加上 `*.so`**。
              #   `-DGGML_BACKEND_DL=ON` 下 ggml 的后端是 CMake 的 MODULE 目标，
              #   而 MODULE 在 Apple 平台上用 `.so` 后缀（不是 `.dylib`）——
              #   实测 macos-arm64-metal 的包里**只有一个文件** `libggml-metal.so`，
              #   于是这条模式一个都匹配不上：
              #     verified 0 signed file(s)
              #     ::error::checked 0 files under … — the pack is empty or the name patterns drifted
              #   👍 **守卫本身是对的**：它没有静默放过，而是明确说"我一个都没检查到"。
              #      这正是 C5 修复的意义 —— 要改的是模式，不是守卫。
              #   （build-whisper.sh 的签名那步用的是 `-name '*.dylib' -o -perm -u+x`，
              #     `.so` 带可执行位，所以**它们本来就被签了**，只是没被验。）
              *.dylib|*.so|*whisper-cli|*whisper-server|*whisper-bench|*whisper-vad-speech-segments|*openmemo-probe)
                codesign --verify --verbose "$f" || { echo "::error::UNSIGNED: $f"; exit 1; }
                checked=$((checked + 1))
                ;;
            esac
          done < <(find "$stage" -type f)
          echo "verified $checked signed file(s)"
          if [ "$checked" -eq 0 ]; then
            echo "::error::checked 0 files under $stage — the pack is empty or the name patterns drifted"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: packs-macos-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Linux — the only jobs whose commands were actually executed during T-012.
  # =====================================================================================
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.backend }}
    if: inputs.legs == 'all' || inputs.legs == 'linux'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ═══════════════════════════════════════════════════════════════════════════
          # ★★★ T-163：三条腿一起从 `ubuntu-22.04` 升到 `ubuntu-24.04`，
          #            **同时把产物的 GLIBC 下限留在 ≤ 2.34**。
          #
          # 这两件事在此之前是互相矛盾的，历史就是来回横跳：
          #   T-145  vulkan/cuda 22.04 → 24.04（为了 apt 的 glslc）→ 下限被抬到 2.38
          #   T-161  vulkan/cuda 24.04 → 22.04（为了把下限压回 2.34）→ 撞上 runner 退役
          #
          # 退役不是"以后再说"：`actions/runner-images#14254` 与
          # `Ubuntu2404-Readme.md` 顶部的公告栏都写着 **2026-09-17 起 deprecation、
          # 2027-04-17 完全不支持**，期间有 brownout（job 硬失败）。
          #
          # 解法不是再横跳一次，是**把两件事解耦**：
          #   · `runs-on` 只决定「谁来跑这个 job」 → 跟着 GitHub 的排期走，随时可以升。
          #   · 编译发生在 `scripts/ci/buildbox.Dockerfile` 造的 **glibc 2.35 容器**里
          #     → 那是我们对用户机器的承诺，不跟着 GitHub 的排期漂。
          #   · 判据仍然是 `check-elf-glibc.mjs` 逐个 ELF 实测（见下面那两步）——
          #     容器只是让基线容易满足，**不是**基线本身。
          #
          # `[实测 T-161]` 排除掉的那条路：留在 24.04 上用编译器开关压住 C23 重定向。
          #   触发源是 g++ driver 无条件注入的 `-D_GNU_SOURCE`
          #   （gcc/config/gnu-user.h 的 `CPLUSPLUS_CPP_SPEC`，gcc-12 与 gcc-13 两个分支
          #   字节相同），不是语言标准版本 —— C++ 侧 `-std=c++11/17/20/23` 逐个试过，
          #   **全部仍然产出 `__isoc23_strtol`**；换 gcc-12 同样无效（重定向在 glibc 2.39
          #   的头文件里）。
          #
          # ★ T-145 矩阵裁剪（用户 2026-08-05 当面指示：「linux-arm64 / macos-x64 /
          #   linux-x64-rocm 这些我用不到」）。删掉的三行原样记在这里，
          #   **因为它们不是"坏的"，是"用户不需要"** —— 日后要恢复直接放回来：
          #     - { runner: ubuntu-24.04,     arch: x64,   backend: rocm }
          #     - { runner: ubuntu-24.04-arm, arch: arm64, backend: cpu }
          #     - { runner: ubuntu-24.04-arm, arch: arm64, backend: vulkan }
          #   ⚠️ rocm 这一行就是章程要求 2.1 里的「AMD」。裁掉之后
          #   **AMD 的加速产物只剩 vulkan 这一条**（用户 2026-08-07：「AMD 卡用 vulkan，
          #   这正是我放弃 rocm 的原因」—— 所以 rocm 这一格是被 vulkan 取代，不是被放弃）。
          # ═══════════════════════════════════════════════════════════════════════════
          - { runner: ubuntu-24.04, arch: x64, backend: cpu }
          # glslc 的来源与发行版无关：`jakoch/install-vulkan-sdk-action` 在 x86_64 Linux 上
          # 下的是 LunarG 官方 tarball，跟 runner 是 22.04 还是 24.04 没关系
          # （T-161 已在 22.04 上实测拿到 `found components: glslc glslangValidator`）。
          # 所以升 runner 不会把 T-145 那个 "E: Unable to locate package glslc" 带回来。
          - { runner: ubuntu-24.04, arch: x64, backend: vulkan }
          # ★ CUDA 12.4 的仓库这件事没变，只是搬了一层：
          #   `[实测 2026-08-07]` NVIDIA 的 `repos/ubuntu2404/x86_64/` 里**最老只到 12-5**，
          #   `repos/ubuntu2204/x86_64/` 才有 `cuda-nvcc-12-4`。T-145 第二轮那两行
          #   "Package 'cuda-nvcc-12-4' has no installation candidate" 就是这么来的。
          #   → 现在 CUDA 装在 **jammy 容器**里（buildbox.Dockerfile），仓库路径回到
          #     ubuntu2204，12.4 又拿得到了 —— 宿主是 24.04 也不影响。
          - { runner: ubuntu-24.04, arch: x64, backend: cuda }
    env:
      # `docker build -t` 出来的本地 tag。buildbox.sh 读它。
      BUILDBOX_IMAGE: openmemo-buildbox:local
      # ★ ccache 的缓存目录必须**显式**给，而且宿主与容器要是同一个。
      #   `ggml-org/ccache-action` 的实现是 `process.env.CCACHE_DIR || $GITHUB_WORKSPACE/.ccache`，
      #   而它**不导出** `CCACHE_DIR` —— 它把 cache_dir 写进宿主 `$HOME/.config/ccache/ccache.conf`。
      #   容器里的 $HOME 是另一个目录 → ccache 回落到自己的默认路径 →
      #   **每次全量重编，且只表现为"CI 变慢了"，没有任何一处会说话。**
      #   在这里写死之后，action 与容器读到的是同一个值（这个值恰好也是 action 的默认值）。
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"

      # The CUDA and ROCm toolchains do not fit in the runner's 14 GB of free space.
      #
      # ★ T-163：CUDA 现在装进 buildbox 镜像里（见下面那一节），但**这一步仍然必须在宿主上跑**：
      #   容器的镜像层与可写层都落在宿主的 `/var/lib/docker`，就在这一步要释放的那块盘上。
      #   这也是本次没有用 job 级 `container:` 的直接原因 —— 那样所有 step 都在容器里，
      #   这一步就再也够不着宿主的 `/usr/share/dotnet` / `/opt/ghc` 之类，
      #   只会**成功地什么都没释放**（而它照样报绿）。
      - name: Free disk space
        if: matrix.backend == 'cuda' || matrix.backend == 'rocm'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: linux-${{ matrix.arch }}-${{ matrix.backend }}

      # --- Vulkan --------------------------------------------------------------------
      # VERIFIED locally that these are the required packages: the build fails at
      # configure time with "Could not find a package configuration file provided by
      # SPIRV-Headers" if spirv-headers is missing, even when libvulkan-dev and glslc
      # are both installed. That failure cost a build cycle during T-012.
      #
      # ★ T-145 实测（run 31014564498）：**这份包列表在 ubuntu-22.04 上装不上**
      #     E: Unable to locate package glslc
      #   `glslc` 在 jammy 的仓库里没有这个二进制包（它在 noble 才独立成包）。
      #   同一份列表在 `ubuntu-24.04-arm` 上**同一轮就是绿的**（linux-arm64-vulkan
      #   success）—— 所以问题确定在发行版，不在包名。x64 曾因此改用 ubuntu-24.04。
      #
      # ★★ T-161：**apt 这条路整条换掉了，改用 LunarG 官方 SDK（与 Windows 腿同一个 action）。**
      #
      #   为什么不是"把包名修对"——`[实测]` jammy 上是**两个**坑，不是一个：
      #     ① `glslc` 二进制包首次出现在 **noble**；jammy 连 `shaderc` 源码包都没有。
      #        `packages.ubuntu.com` 按**文件名**搜 jammy/amd64 的 `glslc`：6 条命中全是
      #        `SPIRVGLSLCanonicalization.h` 之类名字里碰巧含这几个字母的无关文件。
      #        `glslang-tools` 只提供 `glslangValidator` + `spirv-remap`，**没有 glslc**。
      #        jammy-backports / jammy-updates 同样没有。
      #     ② 更隐蔽的一条：`ggml-vulkan/CMakeLists.txt:14` 要的是
      #        `find_package(SPIRV-Headers CONFIG REQUIRED)` —— **CMake package config**。
      #        而 jammy 的 `spirv-headers` 文件列表里**一个 cmake 文件都没有**
      #        （只有 `/usr/share/pkgconfig/SPIRV-Headers.pc`）；noble 的才有
      #        `/usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake`。
      #        → **就算凭空变出一个 glslc，jammy 的 stock 包仍然会在 configure 阶段红。**
      #
      #   LunarG 的 SDK 同时解决这两条，且**不引入新依赖**：`jakoch/install-vulkan-sdk-action`
      #   正是下面 Windows 腿已经在用的那一个。它在 x86_64 Linux 上下的就是 LunarG 官方
      #   tarball（`vulkansdk-linux-x86_64-<version>.tar.xz`），解到 `$VULKAN_SDK`：
      #     `[实测]` tarball 里有 `x86_64/bin/glslc` 与
      #              `x86_64/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake`
      #     `[实测]` 那个 glslc 自己的最高需求是 **GLIBC_2.29**，jammy(2.35) 上跑得动，
      #              `objdump -T | grep -c isoc23` = 0
      #   而 `ggml-vulkan/CMakeLists.txt:11-13` 恰好写着「`$VULKAN_SDK` 存在就
      #   append 进 `CMAKE_PREFIX_PATH`」——两样东西一次到位。
      #
      #   ⚠️ **版本钉死**：`vulkan_version` 不传的话该 action 取"最新"，
      #   那就是我们在别处费劲避免的那种可变引用。1.4.313.0 是**实测存在**的
      #   （`sdk.lunarg.com/sdk/download/1.4.313.0/linux/vulkansdk-linux-x86_64-1.4.313.0.tar.xz`
      #   HTTP 200, 341,756,484 B）。
      #   ⚠️ **诚实边界**：该 action 作者自己的 CI 矩阵里**没有 `ubuntu-22.04` x64 这一格**
      #   （只有 ubuntu-latest 与两个 arm）。代码路径与发行版无关（x86_64 分支不看发行版），
      #   但"没人在这个组合上跑过"是事实 —— 第一次真跑要看日志。
      - name: Install Vulkan SDK (LunarG)
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: '1.4.313.0'
          cache: true

      # --- CUDA ----------------------------------------------------------------------
      #
      # ★★ T-163：**CUDA 不再由 action 在宿主上装，改成装进 buildbox 镜像里**
      #    （`scripts/ci/buildbox.Dockerfile` 的 `BACKEND=cuda` 分支）。
      #
      # 原因是硬的，不是偏好：`[实测 2026-08-07]` NVIDIA 的
      #   `repos/ubuntu2404/x86_64/`  最老只有 `cuda-nvcc-12-5`
      #   `repos/ubuntu2204/x86_64/`  才有 `cuda-nvcc-12-4_12.4.99 / _12.4.131`
      # 而 `Jimver/cuda-toolkit` 的 network 方法用 `lsb_release -sr` 拼仓库路径 ——
      # 宿主升到 24.04 之后它必然去 ubuntu2404 找 12.4，然后复现 T-145 第二轮那两行：
      #   Package 'cuda-nvcc-12-4' has no installation candidate
      # 在 jammy 容器里装，仓库路径回到 ubuntu2204，12.4 又拿得到了。
      #
      # 顺带消掉的一个坑：该 action 把 `sub-packages` 的每一项拼成
      # `cuda-<项>-<major>-<minor>`，而 cuBLAS 的真实包名是 `libcublas-12-4`（无 `cuda-` 前缀）
      # —— T-145 为此烧了两轮真跑（"cublas" → `cuda-cublas-12-4` 不存在；
      # "libcublas" → `cuda-libcublas-12-4` 也不存在），最后靠 `non-cuda-sub-packages` 绕过去。
      # Dockerfile 里直接写包名，**没有拼接，也就没有这一类失败**。
      #
      # ⚠️ 磁盘：`free-disk-space` 仍然跑在**宿主**上（见上面那一步）。这正是这里用
      #   `docker build` + `docker run` 而不是 job 级 `container:` 的理由 ——
      #   `container:` 会让所有 step 都在容器里跑，那一步就再也够不着宿主的
      #   `/usr/share/dotnet` 之类，只会"成功地什么都没释放"。
      #   而容器的可写层落在宿主的 `/var/lib/docker`，就在被释放的那块盘上。

      # --- ROCm ----------------------------------------------------------------------
      # No maintained setup action exists; this mirrors llama.cpp's apt route.
      #
      # ★ T-145 实测（run 31014564498，linux-x64-rocm）：**jammy 上依赖打架**——
      #     rocm-hip-runtime : Depends: rocminfo (= 1.0.0.70201-81~22.04)
      #                        but 5.0.0-1 is to be installed
      #     rocm-hip-runtime-dev : Depends: rocm-device-libs (= 1.0.0.70201-81~22.04)
      #                            but 5.0.0-1 is to be installed
      #     E: Unable to correct problems, you have held broken packages.
      #   成因是 **ubuntu 22.04 自带的 universe 仓库里有一套老 ROCm 包**
      #   （rocminfo 5.0.0-1 等），版本号比 repo.radeon.com 的 1.0.0.7xxxx 形态**大**，
      #   apt 会优先挑它，然后与 radeon 仓库的严格 `=` 依赖对不上。
      #   noble 的 universe 里没有那套老包 → 换到 ubuntu-24.04，仓库路径同步改 noble。
      #   ⚠️ **未验证**：24.04 上是否还有别的冲突。这一条要看下一轮日志才算数。
      - name: Install ROCm
        if: matrix.backend == 'rocm'
        run: |
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 noble main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y rocm-hip-sdk
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      # ═══════════════════════════════════════════════════════════════════════════════
      # ★★★ T-163：编译环境 —— 与 runner 镜像解耦的那一层
      #
      # 设计与取舍全部写在 `scripts/ci/buildbox.Dockerfile` 的文件头里，这里只留判据：
      #   · 这一步换掉 BASE_IMAGE、或者有人把下面几步的 `buildbox.sh` 前缀拿掉，
      #     产物的 GLIBC 下限就会跟着宿主跑到 2.39 —— 而那**不会**静默通过：
      #     `Guard glibc floor` 会红并点名 `__isoc23_strtol` 家族的符号。
      #   · `--report` 还会在编译**开始之前**就断言容器自己的 glibc ≤ 2.35，
      #     省得跑完整个 CUDA 编译才发现镜像被换了。
      # ═══════════════════════════════════════════════════════════════════════════════
      - name: Build the glibc-floor build image
        run: |
          docker build \
            --build-arg BASE_IMAGE=ubuntu:22.04 \
            --build-arg BACKEND=${{ matrix.backend }} \
            --build-arg CUDA_VERSION=12.4 \
            -f scripts/ci/buildbox.Dockerfile \
            -t "${BUILDBOX_IMAGE}" \
            scripts/ci

      - name: Build image self-report
        run: bash scripts/ci/buildbox.sh --report

      - name: Build pack
        id: build
        run: |
          EXTRA=""
          if [ "${{ matrix.backend }}" = "cuda" ]; then
            # Fat multi-architecture CUDA builds are enormous (the official Windows pack
            # measured 677.9 MB, of which ggml-cuda.dll alone is 564.59 MB unpacked).
            # See D-04 §5 -- the slimming spike will replace this with per-arch packs.
            EXTRA="--cuda-arch 86;89"
          fi
          if [ "${{ matrix.backend }}" = "rocm" ]; then
            export CC=/opt/rocm/llvm/bin/clang
            export CXX=/opt/rocm/llvm/bin/clang++
          fi
          bash scripts/ci/buildbox.sh \
            bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs $(nproc) $EXTRA

      # ccache 在容器里到底命中没有 —— 只打印，不判红绿。
      # 它答的是「CI 为什么忽然变慢了」这一类问题，而那类问题在此之前**没有任何一处会说话**
      # （见上面 env 里 CCACHE_DIR 那段注释）。
      - name: ccache stats
        run: bash scripts/ci/buildbox.sh ccache --show-stats

      # ★★ T-161：**glibc 运行时下限守卫**（D-11 §8.0 那一族的 Linux 那一格）。
      #
      # 在此之前这条基线只是本文件里的一句注释（下面矩阵那行「cpu 保留 22.04 是刻意的：
      # 它是 glibc 基线」）。**然后它被绕过了一次，而且是在解决另一个问题的过程中顺手绕的**：
      # vulkan 为了拿 `glslc` 从 22.04 挪到 24.04（§4.2），运行时下限从 2.34 抬到 2.38，
      # 没有任何一处会说话，直到有人把产物解开跑 objdump 才发现（D-11 §8.2）。
      #
      # D-11 §8.2 自己写的判据：「**一条靠"记得别动它"维持的基线，等价于一条迟早会被绕过的基线**」。
      # 所以它现在是守卫，不是注释 —— 换 runner 会当场红，而不是等用户"装了没变快"。
      #
      # 2.34 = Ubuntu 22.04 上编出来的实测值，不是拍的。
      # 发行版对照：Ubuntu 22.04=2.35 · Debian 12=2.36 · Ubuntu 24.04=2.39 · Debian 13=2.41。
      #
      # ★★ T-163：runner 升到 24.04 之后，**这一步是"两条要求都满足了"的唯一判据**。
      #    它跑在宿主上（objdump 读的是文件，与谁编的无关），验的是容器里编出来的东西。
      - name: Guard glibc floor
        run: |
          node scripts/ci/check-elf-glibc.mjs \
            --dir "${{ steps.build.outputs.stage_dir }}" \
            --max 2.34

      # T-167：探针不再单独编译一次 —— build-whisper.sh 已经把它编进包里了
      # （理由见该脚本里 "探针随包出厂" 那一段：它动态链接 libggml-base，
      #  单独发一个二进制文件在用户机器上**一次都启动不了**）。
      # 这一步只是把**同一份字节**复制出来当独立 artifact。
      - name: Copy the in-pack probe out as a standalone artifact
        if: matrix.backend == 'cpu'
        run: |
          set -euo pipefail
          mkdir -p dist/probe
          cp "${{ steps.build.outputs.probe_path }}" dist/probe/openmemo-probe
          ls -l dist/probe

      # ★★ T-163：**探针以前不在守卫的覆盖面里，而它是随包出厂的**。
      #
      # `Guard glibc floor` 只看 `stage_dir`（包的内容），而 `openmemo-probe` 被单独
      # upload 到 `dist/probe/`，`apps/daemon/src/runtime/setup.ts` 在用户机器上跑的就是它。
      # 在 22.04 runner 上这一格碰巧是安全的（宿主 = 基线），**升到 24.04 之后就不是了** ——
      # 一个 GLIBC_2.39 的探针在 Debian 12 上会直接起不来，而探针恰恰是回答
      # 「这台机器能用哪些加速器」的那个东西：它挂掉的表现是"探测不到任何 GPU"，
      # 与"这台机器真的没有 GPU"**在界面上完全一样**。
      #
      # ★ T-167 更新：探针进包之后，上面那条 `Guard glibc floor` 已经覆盖它了
      #   （stage 的 ELF 计数会从 22 变成 23）。**这一条仍然保留**，因为它守的是
      #   另一件事：**被 upload 出去的那份**与包里那份是不是同一个文件。
      #   复制那一步一旦被改回"再编一次"，两份就可能不同，而这条守卫验的是前者。
      - name: Guard glibc floor (probe)
        if: matrix.backend == 'cpu'
        run: |
          node scripts/ci/check-elf-glibc.mjs \
            --dir dist/probe \
            --max 2.34

      # Smoke test: extract the pack somewhere else entirely and run it with no
      # LD_LIBRARY_PATH. This catches the rpath regressions that make a pack work on the
      # builder and nowhere else. Verified to pass locally during T-012.
      # C7/C9: use the pack id the script reported instead of hard-coding it.
      #
      # ★★ T-161：**这一步以前只跑 cpu 那条腿**（`if: matrix.backend == 'cpu'`），
      #   因为在那之前加速包里只有一个 `libggml-<backend>.so`，根本没有可执行文件可跑。
      #   加速包自包含之后，这条烟雾测试**对每条腿都成立，而且它正是自包含的判据本身**：
      #   解到别处、不给 LD_LIBRARY_PATH、`./whisper-cli --help` 能起来
      #   = 这个包不依赖任何别的包。
      #
      # ★★★ T-163：这段逻辑**整段搬进了 `scripts/ci/smoke-linux-pack.sh`**，两个理由：
      #   ① 内联在 YAML 里的 50 行 shell **没有任何测试碰得到它** —— 与 C1/C3 把
      #      `node -e` 搬出 YAML 是同一条理由。现在它有反向用例
      #      （`scripts/ci/selftest-buildbox.sh`，`pnpm test:ci-scripts` 会跑）。
      #   ② 它现在**跑在 buildbox 容器里**，不是 runner 上。这不是形式问题：
      #      runner 升到 24.04(2.39) 之后，一个需要 GLIBC_2.38 的产物在宿主上照样跑得欢
      #      —— 那正是 D-11 §8.2 那个 bug 的原貌。**判据要跑在下限那一侧才算数。**
      - name: Smoke test pack relocatability
        if: matrix.arch == 'x64'
        run: |
          bash scripts/ci/buildbox.sh \
            bash scripts/ci/smoke-linux-pack.sh \
            --archive "${PACK_OUTPUT_DIR}/${{ steps.build.outputs.pack_id }}.tar.gz" \
            --pack-id "${{ steps.build.outputs.pack_id }}" \
            --backend "${{ matrix.backend }}"

      - uses: actions/upload-artifact@v6
        with:
          name: packs-linux-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Windows — no signing at all (ADR-003 decision 4). The installer will trip SmartScreen
  # until it accrues download reputation; downloaded backend packs will not, because a
  # programmatic HTTP download does not attach a Mark-of-the-Web. See D-04 §7.
  # =====================================================================================
  #
  # C6: the old workflow ran `choco install ninja -y`, but build-whisper.sh has no
  # `-G Ninja` anywhere — grep the whole repo, it is not there. Installing a generator
  # the build never selects costs a minute and buys nothing; worse, it makes the file
  # *look* like it builds with Ninja. Dropping the install (rather than adding -G Ninja)
  # is the smaller change: switching to Ninja on Windows also requires importing the MSVC
  # environment (vcvarsall / ilammy/msvc-dev-cmd) or cl.exe is not on PATH — a second
  # untested moving part on a workflow that has never run at all.
  # The consequence — a multi-config VS generator whose output lands in `bin/Release` —
  # is handled by build-whisper.sh's BIN_DIR probe, which IS covered locally by
  # `scripts/ci/selftest-build-whisper.sh` case ②.
  windows:
    name: windows-${{ matrix.arch }}-${{ matrix.backend }}
    if: inputs.legs == 'all' || inputs.legs == 'windows'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x64, backend: cpu }
          - { runner: windows-2025, arch: x64, backend: vulkan }
          - { runner: windows-2022, arch: x64, backend: cuda }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"
        shell: bash

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-${{ matrix.arch }}-${{ matrix.backend }}

      # ★ T-161：**加上 `vulkan_version`。** 不传的话该 action 取"最新" ——
      #   也就是一条会随时间漂的引用，而本仓在别处（release tag / sha256 /
      #   submodule commit / HuggingFace revision）为了消灭这种引用花了很大力气。
      #   一个不钉版本的构建工具链就是 D-11 §8.0 那一族的入口：
      #   「凡是不显式指定就取构建机当前值的东西，都会把构建机的新度焊进产物」。
      #   取值与 Linux 腿**同一个**，两个平台的 Vulkan 才是同一次上游 SDK。
      #   ⚠️ 这是对一条**当前编得过**的腿做的改动，如实标注：改之前它用的是浮动的
      #   "latest"，改之后是 1.4.313.0。`ggml-vulkan.cpp` 里最高的版本门是
      #   `VK_HEADER_VERSION >= 301`，313 > 301，特性集不会退化。第一次真跑要看日志。
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: '1.4.313.0'
          install_runtime: true
          cache: true

      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.0'
          method: 'network'
          # ★ T-145 撤回说明：我一度按 linux job 的报错把这里也改成 libcublas*，
          #   **然后发现没有证据支持**：run 31014564498 里 windows-x64-cuda 的
          #   「Install CUDA toolkit」**是成功的**，编译也 100% 走完，
          #   它只死在后面的 zip 那一步。也就是说 Windows 这条路径**现在是通的**。
          #   Linux 上 apt 查不到 `cuda-cublas-12-4`，Windows 上该 action 走的是
          #   NVIDIA 的网络安装器、名字映射是另一套 —— 两边不能互相推。
          #   → 保持原样。**没坏就别按另一个平台的错误去"修"。**
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","nvrtc","nvrtc_dev","visual_studio_integration"]'

      - name: Build pack
        id: build
        shell: bash
        run: |
          EXTRA=""
          [ "${{ matrix.backend }}" = "cuda" ] && EXTRA="--cuda-arch 86;89"
          bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs 4 $EXTRA

      # T-167：探针由 build-whisper.sh 编进包里；这一步只把同一份字节复制出来。
      # `[本机实测]` Windows 探针的导入表只有 KERNEL32 + `api-ms-win-crt-*`（UCRT，
      # Win10+ 自带）+ `ggml-base.dll` / `ggml.dll` —— **没有 MSVCP140 / VCRUNTIME140**。
      # 也就是说探针本身不需要 VC++ 可再发行组件；但它链接的那两个 ggml DLL 需要
      # （D-11 §8.3，`win-fixes` 的 `simple.dll` 是同一条），所以这条不构成"Windows 上没问题"。
      - name: Copy the in-pack probe out as a standalone artifact
        if: matrix.backend == 'cpu'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/probe
          cp "${{ steps.build.outputs.probe_path }}" dist/probe/openmemo-probe.exe
          ls -l dist/probe

      - uses: actions/upload-artifact@v6
        with:
          name: packs-windows-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Merge every per-pack manifest fragment into the single backends.json the downloader
  # reads. ADR-001 requires this file to be committed so that "what did we download" is
  # auditable and reproducible.
  #
  # ★ C4 — THE `if: always()` IS GONE, ON PURPOSE.
  #
  # It used to say `if: always()`, which meant: all three build job groups fail ->
  # this job still runs -> `artifacts/` is empty -> it writes a backends.json with
  # `packs: []` -> upload-artifact succeeds -> **the whole workflow is green and the
  # product catalogue is empty**. That is this project's signature disease (failure
  # written down as success) in its purest form.
  #
  # Without it: any failing build job makes the workflow conclusion `failure`, and this
  # job is skipped, so **no manifest is produced at all**. That is the correct outcome —
  # a partial catalogue is worse than no catalogue, because a partial one looks fine.
  # (Reasoned from GitHub's `needs`/`always()` documentation. NOT executed — see the
  # banner at the top. The second line of defence below IS locally tested.)
  # =====================================================================================
  manifest:
    name: merge-manifest
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # ADR-006 decision 7: Node baseline is 22 (better-sqlite3 v13 requires >= 22).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The merge script validates with the REAL BackendManifestSchema, which lives in
      # @openmemo/shared's dist. Without it the script refuses to run rather than
      # skipping validation — see loadValidator() in the script.
      #
      # pnpm is installed with plain npm rather than pnpm/action-setup or corepack:
      # this workflow has never run once, and every third-party moving part is another
      # thing that can fail for a reason unrelated to what we are trying to build. The
      # version is pinned to package.json's `packageManager` field — keep them in step.
      #
      # `--ignore-scripts` is deliberate: building one TypeScript package does not need
      # any dependency's postinstall to run.
      #
      # ★ T-145: this used to say the workspace's onlyBuiltDependencies "(ffmpeg-static,
      #   youtube-dl-exec) download hundreds of MB of binaries at install time". Both
      #   packages have since been REMOVED -- they were a second, looser acquisition
      #   channel (no checksums; youtube-dl-exec did not even pin a version, it hit
      #   `releases/latest`), while the product only ever used the manifest channel
      #   (pinned tag + sha256). Verified unused three ways before removal.
      #   `onlyBuiltDependencies` is now just esbuild + @tailwindcss/oxide.
      - name: Install and build @openmemo/shared
        run: |
          npm install -g pnpm@10.15.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @openmemo/shared build

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # ★ C1 / C3 / C4 — this used to be ~15 lines of inline `node -e` inside the YAML,
      # which is precisely why nothing could ever test it. It is now a real file with a
      # real self-test (`pnpm test:ci-scripts`).
      #
      # Behaviour: upsert by pack id into the committed backends.json; keep existing
      # upstream entries; never let a URL-less CI artifact displace a published upstream
      # pack (ADR-015); exit 1 on zero fragments; validate before writing anything.
      # 合并结果的表格由脚本自己写进 $GITHUB_STEP_SUMMARY —— 不在这里另起一段
      # inline `node -e`。`scripts/ci/lint-workflows.mjs` 有一条断言挡着它回来。
      - name: Merge manifest fragments
        run: node scripts/ci/merge-backend-manifest.mjs --fragments artifacts

      - uses: actions/upload-artifact@v6
        with:
          name: backends-manifest
          path: vendor/manifests/backends.json
          if-no-files-found: error

      # NOTE: publishing is intentionally manual. The packs this workflow produces are
      # `availability: "pending-ci"` — they have real SHA256 digests but **no download
      # URL**, because the artifacts live in GitHub Actions storage, not on a public URL.
      # The frontend disables the install button for those, which is the honest state.
      # Turning them into `published` requires (a) a real hosting location and (b) the
      # manifest to be signed with our minisign key, pinned client-side (D-04 §6).
      - name: Publishing reminder
        if: inputs.publish
        run: |
          echo "::warning::Publishing is not wired up. Packs are 'pending-ci' (no URL)."
          echo "::warning::Needs: a hosting URL for each archive + minisign signature (D-04 §6)."
