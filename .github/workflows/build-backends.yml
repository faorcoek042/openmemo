# Build whisper.cpp backend packs for every platform x backend we support.
#
# OWNER: gpu-runtime (T-012). Design: docs/design/D-04-build-and-runtime.md.
#
# ┌──────────────────────────────────────────────────────────────────────────────────────┐
# │ ⚠️  UNVERIFIED: THIS WORKFLOW HAS NEVER BEEN EXECUTED.                                │
# │                                                                                       │
# │ The repository has no git remote (ADR-003 decision 2 records this and it was          │
# │ escalated to the user). Nothing here has run on a GitHub runner. Every job is         │
# │ written from documentation plus the live-verified reference workflows in              │
# │ ggml-org/llama.cpp and ggml-org/whisper.cpp.                                          │
# │                                                                                       │
# │ VERIFIED ON THE T-012 LINUX BOX (these two jobs mirror commands that actually ran):   │
# │   - linux/x64/cpu     -> pack built, extracted, executed, 7.7 MB tar.gz               │
# │   - linux/x64/vulkan  -> pack built, 22.7 MB tar.gz containing exactly one file       │
# │ EVERYTHING ELSE (macOS, Windows, CUDA, ROCm, arm64) IS UNVERIFIED.                    │
# │                                                                                       │
# │ First real run WILL need fixing. Expect: SDK path drift, disk exhaustion on the CUDA  │
# │ job, and MSVC generator quirks.                                                       │
# └──────────────────────────────────────────────────────────────────────────────────────┘
#
# Runner labels were verified against docs.github.com and actions/runner-images on
# 2026-08-02: macos-13 has been REMOVED and macos-14 is deprecated, so Intel macOS builds
# use `macos-15-intel` and Apple silicon uses `macos-26`. `ubuntu-24.04-arm` is free for
# public repositories.

name: build-backends

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: 'whisper.cpp ref to build (defaults to the pinned submodule)'
        required: false
        default: ''
      publish:
        description: 'Attach the packs to a draft release'
        type: boolean
        required: false
        default: false
  push:
    tags: ['runtime-v*']

permissions:
  contents: write

env:
  # ADR-004 decision 5: our downloader verifies SHA256 (Ollama's does not). The build
  # emits the digests; nothing downstream is allowed to trust an unverified artifact.
  PACK_OUTPUT_DIR: dist/packs

jobs:
  # =====================================================================================
  # macOS — Metal is the only accelerator that matters here, and it costs zero extra
  # bytes: GGML_METAL_EMBED_LIBRARY compiles the shaders into the binary, so the Metal
  # "pack" ships inside the core pack. Apple silicon also REQUIRES at least an ad-hoc
  # signature or the binary will not execute at all (ADR-003 decision 4).
  # =====================================================================================
  macos:
    name: macos-${{ matrix.arch }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26,       arch: arm64, backend: metal }
          - { runner: macos-26,       arch: arm64, backend: cpu }
          # Intel Macs have no supported GPU backend in ggml — CPU/AVX2 only.
          - { runner: macos-15-intel, arch: x64,   backend: cpu }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: macos-${{ matrix.arch }}-${{ matrix.backend }}

      - name: Build pack
        run: |
          bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs $(sysctl -n hw.logicalcpu)

      - name: Build probe
        if: matrix.backend == 'cpu'
        run: |
          bash scripts/build-probe.sh \
            --ggml-lib-dir ".build/whisper-darwin-${{ matrix.arch }}-cpu/bin" \
            --out "dist/probe/openmemo-probe"

      # ADR-003 decision 4: ad-hoc only. No Developer ID, no notarisation, no stapling —
      # the user's brief is personal use and no certificates were purchased. The daemon
      # compensates by clearing com.apple.quarantine after download. D-04 §7 documents
      # the paid upgrade path.
      - name: Verify ad-hoc signature
        run: |
          set -e
          find "${PACK_OUTPUT_DIR}" -name '*.tar.gz' -print
          for f in .build/whisper-darwin-*/stage/*/*; do
            [ -f "$f" ] || continue
            case "$f" in *.dylib|*whisper-cli|*whisper-server|*openmemo-probe)
              codesign --verify --verbose "$f" || { echo "UNSIGNED: $f"; exit 1; } ;;
            esac
          done

      - uses: actions/upload-artifact@v6
        with:
          name: packs-macos-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Linux — the only jobs whose commands were actually executed during T-012.
  # =====================================================================================
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x64,   backend: cpu }
          - { runner: ubuntu-22.04,     arch: x64,   backend: vulkan }
          - { runner: ubuntu-22.04,     arch: x64,   backend: cuda }
          - { runner: ubuntu-22.04,     arch: x64,   backend: rocm }
          - { runner: ubuntu-24.04-arm, arch: arm64, backend: cpu }
          - { runner: ubuntu-24.04-arm, arch: arm64, backend: vulkan }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"

      # The CUDA and ROCm toolchains do not fit in the runner's 14 GB of free space.
      - name: Free disk space
        if: matrix.backend == 'cuda' || matrix.backend == 'rocm'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: linux-${{ matrix.arch }}-${{ matrix.backend }}

      # --- Vulkan --------------------------------------------------------------------
      # VERIFIED locally that these are the required packages: the build fails at
      # configure time with "Could not find a package configuration file provided by
      # SPIRV-Headers" if spirv-headers is missing, even when libvulkan-dev and glslc
      # are both installed. That failure cost a build cycle during T-012.
      - name: Install Vulkan toolchain
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers spirv-tools glslang-tools

      # --- CUDA ----------------------------------------------------------------------
      # Note: llama.cpp and whisper.cpp both hand-roll this by pulling individual
      # component archives from NVIDIA's redist server rather than using an action. The
      # action is simpler; swap to the manual route if image sizes become a problem.
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas-dev","nvrtc","nvrtc-dev"]'

      # --- ROCm ----------------------------------------------------------------------
      # No maintained setup action exists; this mirrors llama.cpp's apt route.
      - name: Install ROCm
        if: matrix.backend == 'rocm'
        run: |
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y rocm-hip-sdk
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Build pack
        run: |
          EXTRA=""
          if [ "${{ matrix.backend }}" = "cuda" ]; then
            # Fat multi-architecture CUDA builds are enormous (the official Windows pack
            # measured 677.9 MB, of which ggml-cuda.dll alone is 564.59 MB unpacked).
            # See D-04 §5 -- the slimming spike will replace this with per-arch packs.
            EXTRA="--cuda-arch 86;89"
          fi
          if [ "${{ matrix.backend }}" = "rocm" ]; then
            export CC=/opt/rocm/llvm/bin/clang
            export CXX=/opt/rocm/llvm/bin/clang++
          fi
          bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs $(nproc) $EXTRA

      - name: Build probe
        if: matrix.backend == 'cpu'
        run: |
          bash scripts/build-probe.sh \
            --ggml-lib-dir ".build/whisper-linux-${{ matrix.arch }}-cpu/bin" \
            --out "dist/probe/openmemo-probe"

      # Smoke test: extract the pack somewhere else entirely and run it with no
      # LD_LIBRARY_PATH. This catches the rpath regressions that make a pack work on the
      # builder and nowhere else. Verified to pass locally during T-012.
      - name: Smoke test pack relocatability
        if: matrix.backend == 'cpu' && matrix.arch == 'x64'
        run: |
          set -e
          mkdir -p /tmp/smoke && tar xzf "${PACK_OUTPUT_DIR}"/whispercpp-cpu-linux-x64.tar.gz -C /tmp/smoke
          cd /tmp/smoke/whispercpp-cpu-linux-x64
          env -u LD_LIBRARY_PATH ./whisper-cli --help > /dev/null
          echo "pack is relocatable"

      - uses: actions/upload-artifact@v6
        with:
          name: packs-linux-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Windows — no signing at all (ADR-003 decision 4). The installer will trip SmartScreen
  # until it accrues download reputation; downloaded backend packs will not, because a
  # programmatic HTTP download does not attach a Mark-of-the-Web. See D-04 §7.
  # =====================================================================================
  windows:
    name: windows-${{ matrix.arch }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x64, backend: cpu }
          - { runner: windows-2025, arch: x64, backend: vulkan }
          - { runner: windows-2022, arch: x64, backend: cuda }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out requested whisper.cpp ref
        if: inputs.whisper_ref != ''
        run: git -C vendor/whisper.cpp checkout "${{ inputs.whisper_ref }}"
        shell: bash

      - uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-${{ matrix.arch }}-${{ matrix.backend }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: true
          cache: true

      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","nvrtc","nvrtc_dev","visual_studio_integration"]'

      - name: Build pack
        shell: bash
        run: |
          EXTRA=""
          [ "${{ matrix.backend }}" = "cuda" ] && EXTRA="--cuda-arch 86;89"
          bash scripts/build-whisper.sh \
            --backend ${{ matrix.backend }} \
            --out "${PACK_OUTPUT_DIR}" \
            --jobs 4 $EXTRA

      - name: Build probe
        if: matrix.backend == 'cpu'
        shell: bash
        run: |
          bash scripts/build-probe.sh \
            --ggml-lib-dir ".build/whisper-win32-${{ matrix.arch }}-cpu/bin" \
            --out "dist/probe/openmemo-probe.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: packs-windows-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            ${{ env.PACK_OUTPUT_DIR }}/*
            dist/probe/*
          if-no-files-found: error

  # =====================================================================================
  # Merge every per-pack manifest fragment into the single backends.json the downloader
  # reads. ADR-001 requires this file to be committed so that "what did we download" is
  # auditable and reproducible.
  # =====================================================================================
  manifest:
    name: merge-manifest
    needs: [macos, linux, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # ADR-006 decision 7: Node baseline is 22 (better-sqlite3 v13 requires >= 22).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge manifest fragments
        run: |
          mkdir -p vendor/manifests
          node -e '
            const fs = require("node:fs");
            const dir = "artifacts";
            const packs = fs.readdirSync(dir)
              .filter((f) => f.endsWith(".json"))
              .map((f) => JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")))
              .sort((a, b) => a.id.localeCompare(b.id));
            const out = {
              schemaVersion: 1,
              generatedAt: new Date().toISOString(),
              // Deliberately no performance figures. R-02 refused to invent a
              // CUDA-vs-Vulkan number and ADR-003 decision 3 depends on that honesty.
              packs,
            };
            fs.writeFileSync("vendor/manifests/backends.json", JSON.stringify(out, null, 2) + "\n");
            console.log(`merged ${packs.length} packs`);
          '
          cat vendor/manifests/backends.json

      - uses: actions/upload-artifact@v6
        with:
          name: backends-manifest
          path: vendor/manifests/backends.json
          if-no-files-found: error

      # NOTE: publishing is intentionally manual. There is no remote yet, and the
      # manifest must be signed before anything trusts it (D-04 §6).
      - name: Publishing reminder
        if: inputs.publish
        run: |
          echo "::warning::Publishing is not wired up. The manifest must be signed with"
          echo "::warning::our minisign key and the public key pinned in the client first."
