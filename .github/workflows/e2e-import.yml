# F1 链接导入 + F2 本地媒体导入：**用预编译包、走真实 HTTP、端到端真的能用**
#
# ── 为什么这个 workflow 存在 ──────────────────────────────────────────────────────
#
# 用户下载 v0.2.0 预编译包在真机上用，Windows 双击报错、macOS 被拦、界面打不开。原话：
#
#   > 「你应该派多路 agent 去在 CI 中运行一遍把各个流程跑通才能给我交付的啊！」
#
# 他是对的。此前 CI 只验了「产品能不能被脚本驱动着转出一段文本」
# （`cold-start-audit.mjs` 第 7 节：import → job → transcript，判据是非空文本），
# 而交付的是「**人要用手打开并使用它**」。中间隔着的东西一条没测：
#
#   · 网页拖文件进来发的那个 **multipart 上传**（`POST /api/notes/upload`）—— 零覆盖
#   · 播放器发的那个 **`/media` Range 请求** —— 零覆盖
#   · 粘一个链接走 **yt-dlp 取回** 那条链 —— 零覆盖（`fetch` 从未被端到端跑过，
#     `ytdlp.ts:169` 那条「EXIT CODE 101 IS SUCCESS HERE」的注释就是这么来的）
#
# **判据从今天起是：这条功能面在 CI 上、用预编译包、走产品自己的 HTTP 路径，
# 端到端真的能用。** 不是单测绿，不是"代码写了"。
#
# ── 判据本体在哪一行 ────────────────────────────────────────────────────────────
#
# `scripts/ci/e2e-import-audit.mjs` 的 `assertPlayable()`。最值钱的一条是
# **sha256 往返**：导进去的文件与 `/media` 吐出来的字节逐字节相同。
# 它同时否掉「落库了但文件丢了」「归档时截断了」「Range 偏移算错了」——
# 而这三种在"数据库里有一行"的判据下**全都是绿的**。
#
# ── 触发方式：手动 ──────────────────────────────────────────────────────────────
#
# 它要下载一个预编译包、真装几百 MB 后端、真跑 5～6 次转写，不适合每次 push 都来。
# 值得重跑的时机：改了导入/上传/媒体路由、改了 media source 适配器、出了新包。

name: e2e-import

on:
  workflow_dispatch:
    inputs:
      bundleRunId:
        # 留空 = 自动取最近一次成功的 build-bundles run。
        # 理由与 PROTOCOL §7 补充那条同源：一个需要人记得去填的参数，
        # 等价于一个迟早不会被填的参数 —— 而"没填"的后果是这条腿根本跑不起来。
        description: '取包的 build-bundles run id。留空 = 自动用最近一次「三个平台产物齐全」的 run（不是最近一次 success —— 见下）。'
        required: false
        default: ''
        type: string
      skipF1:
        description: '跳过 F1（链接导入）。只在排查 F2 时用。'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # ★ 三平台。用户接 GitHub 的**全部理由**就是「在别的系统上跑」，
    #   而这条功能面此前一个平台都没跑过。
    #   runner 版本照抄 `cold-start-audit.yml` / `build-bundles.yml`（macOS 是 macos-26）——
    #   包就是在这些 runner 上打出来的，换一个版本跑等于换了个问题。
    #
    #   fail-fast: false —— 一个平台红不该掩盖另外两个平台的事实。
    name: F1+F2 端到端（${{ matrix.label }}）
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # ★ 把**实际用到的**那个包的 run id 抬到 job 级 —— 下面发凭证要绑定它。
    #   矩阵三条腿解析出的是同一个 id（要么人工指定，要么同一套挑选规则），
    #   所以谁最后写谁都一样；凭证文件里另存了平台清单可供事后审计。
    outputs:
      bundle_run_id: ${{ steps.bundle.outputs.run_id }}
    permissions:
      contents: read
      # 取**另一个 run** 的 artifact 需要它。只读。
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, label: linux-x64, artifact: bundle-linux-x64, port: 19800 }
          - { runner: macos-26, label: darwin-arm64, artifact: bundle-darwin-arm64, port: 19810 }
          - { runner: windows-2025, label: win32-x64, artifact: bundle-win-x64, port: 19820 }
    steps:
      # ★ `submodules: recursive` 不能省：造样本的源音频是 whisper.cpp submodule 自带的
      #   `vendor/whisper.cpp/samples/jfk.wav`。不带 submodule 的 checkout 下，
      #   第 7 节会如实报「源样本不存在 —— submodule 没 checkout？」然后红。
      #   （cold-start-audit.yml 已经为此栽过一次。）
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # 这个脚本是零依赖的纯 node —— 不装 workspace。
      # daemon 用的是**包自带的** Node，宿主这个只用来跑审计脚本本身。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ 在装任何东西之前记录 runner 自带什么。
      #   这是"我们装上了"与"它本来就在"的唯一分界线。
      - name: 宿主基线（装任何东西之前）
        shell: bash
        run: |
          echo "== runner 自带的同名工具 =="
          for t in ffmpeg ffprobe yt-dlp youtube-dl whisper-cli sqlite3 python3; do
            printf '%-14s %s\n' "$t" "$(command -v $t || echo '(不在 PATH 上)')"
          done

      # ① 取预编译包。**硬要求：用户手里是那个包，不是源码树。**
      #    源码树跑绿证明不了包能用 —— v0.2.0 那次正是这么过去的。
      - name: 取预编译包（来自 build-bundles 的 artifact）
        id: bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.bundleRunId }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          # ★★ 判定「哪一次 run 里有我要的产物」**只有一份实现**：
          #    `scripts/ci/resolve-bundle-run.sh`。
          #
          #    这里以前是这段逻辑的**第三份拷贝**（另两份在 resolve-bundle-run.sh
          #    与 e2e-notes 里）。三份都写对了同一件事，但那不是安全 ——
          #    resolve-bundle-run.sh 的文件头记着它诞生的原因：**同一段 shell 抄了两份，
          #    只修了一份，另一份继续按"最近一次成功"取件**，于是 mutations 那条腿
          #    整个挂在 `Artifact not found`。
          #    判据照本仓老规矩：不是"记得几处一起改"，是**不可能只改一边**。
          #
          #    它的判据是「这次 run 里有我这条腿要的 artifact，且没过期」，
          #    而不是「它是最近一次成功的 run」—— 后者会选中一个只跑了单平台的 run
          #    （那种 run 的 conclusion 仍然是 success，PROTOCOL §11）。
          RUN_ID=$(bash scripts/ci/resolve-bundle-run.sh "$ARTIFACT" "$RUN_ID_INPUT")
          echo "用的 run id：$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          mkdir -p dist/e2e-src
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" --dir dist/e2e-src
          echo "── 取到的东西 ──"
          ls -l dist/e2e-src

          # ── 挑归档 → 解开 → 找包根 → 验结构：走**共享脚手架** ──────────────
          #
          # 这段以前是这条腿自己的一份 bash，而它的第一版正是
          # `ARCHIVE=$(ls a b c 2>/dev/null | head -1)` —— `[CI 实测 run 31247156655]`
          # 三个平台**全部**死在那一行（`ls` 对匹配不到的 glob 非零退出，
          # `set -e` 在赋值处把整步带走；退出码 2/1/2 正好对上 GNU 与 BSD 的 `ls`）。
          # `e2e-notes` **独立**撞了同一行，另有一次是 `cp` 被暂存目录噎住 ——
          # 同一个形状三次，Manager 2026-08-08 裁决提成共享的一份。
          #
          # 换 Node 不是口味问题：**病因就是 shell 的 glob/退出码语义**。
          # 而且 `scripts/ci/` 下的脚本能被 `selftest-resolve-bundle.mjs` 在本机
          # 逐个坏输入量一遍（已挂进 `pnpm test:ci-scripts`）——
          # 这条 workflow 自己就是"从来没被执行过所以看起来没问题"的又一例。
          #
          # 顺带补上两条以前没有的护栏：两个归档并存 / 解出多个顶层目录，
          # 以前都是"挑第一个然后接着跑"，那样的绿灯追溯不到它验的是谁。
          node scripts/ci/resolve-bundle.mjs \
            --from dist/e2e-src --out dist/e2e-bundle \
            --require app/daemon/dist/main.js \
            --require-node-runtime

      # ② ★ 让 fixture 主机名解析到回环。
      #
      #    为什么非要这一步：产品的 SSRF 防线（argGuard.ts:isPrivateOrReservedHost）
      #    拒绝一切私有/回环**字面地址**，而那是**正确行为** —— daemon 自己绑在
      #    127.0.0.1 上，放行回环等于把产品变成 confused deputy。所以喂本地 fixture
      #    只能靠一个**公网形状**的主机名。`.test` 是 RFC 6761 保留给测试的 TLD，
      #    永远不会真的解析到公网上去。
      #
      #    ★ 这个改动**只发生在这里**（一次性 runner 的 hosts 文件），
      #      审计脚本本身**绝不碰** hosts —— 它只查"解析得到吗"，解析不到就如实报
      #      SKIPPED。判据照 PROTOCOL §9-bis：把脚本 kill -9 在最坏的那一行，
      #      机器上不会留下任何东西。
      - name: 让 fixture 主机名指向回环（仅本 runner）
        shell: bash
        run: |
          set -euo pipefail
          LINE="127.0.0.1 openmemo-e2e-fixture.test"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$LINE" >> /c/Windows/System32/drivers/etc/hosts
          else
            echo "$LINE" | sudo tee -a /etc/hosts > /dev/null
          fi
          echo "== 核对（解析不到的话审计脚本会把 F1 报成 SKIPPED，不会假绿）=="
          node -e "require('node:dns').lookup('openmemo-e2e-fixture.test',(e,a)=>{console.log(e?('解析失败: '+e.message):('→ '+a));})"

      # ③ 判据本体。**用包跑、屏蔽宿主 PATH、走真实 HTTP、验到 Range 能播。**
      #
      #    屏蔽宿主 PATH 沿用 cold-start-audit 的做法：在 PATH 最前面放同名假二进制，
      #    而不是把目录删掉 —— shim 能通过 access(X_OK)，所以「产品会不会去借」
      #    这个行为**照常发生**，只是借到的一执行就带标记失败。**借用变可见，不是被消除。**
      #    脚本第 12 节会用产品自己的 selfcheck 判据报出"借了几个"，借了就红。
      - name: F1+F2 端到端（预编译包 + 屏蔽宿主工具 + 真实 HTTP）
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        shell: bash
        run: |
          node scripts/ci/e2e-import-audit.mjs \
            --bundle "${{ steps.bundle.outputs.bundle_dir }}" \
            --port ${{ matrix.port }} \
            --fixture-port $(( ${{ matrix.port }} + 1 )) \
            ${{ inputs.skipF1 && '--skip-f1' || '' }}

  # ═══════════════════════════════════════════════════════════════════════════════════
  # 发一张「这条腿对着**这一批包**跑绿过」的凭证。
  #
  # ## 为什么要有它
  #
  # `v0.3.0` 发出去之后才发现：四条 e2e 腿此前跑的**都是更早的包**。
  # 是用户追问「确定各平台都验过了吗」才查出来的。与 v0.2.0「CI 从没执行过启动器」
  # 是同一形状 —— **判据没有对准交付物，而且靠人记得。**
  #
  # 根因是一条容易被读漏的性质：**e2e 腿测的是「包」，不是「树」。**
  # 它绿只说明**那一批包**好；HEAD 修好了它也不会自己变绿。
  # 所以"跑过 e2e"必须有个宾语，而这张凭证就是那个宾语。
  #
  # ## 判定落在 artifact **名字**上（与 bundles-complete 同一形状）
  #
  # 名字是 `e2e-attest-import-<bundleRunId>`：换一批包就是另一个名字，
  # **旧凭证自动失效**。消费方（发布前那道闸）只问名字在不在，不读内容 ——
  # 一个需要读内容才能判定的凭证，迟早会有人读错。
  #
  # ## 这个 job **不带任何 `if:`**，且 `needs:` 矩阵全部
  #
  # 任何一个平台失败或被跳过 → 它自己被跳过 → **凭证根本不存在**。
  # "部分跑"的 run 里不会出现一张说了半句真话的凭证（PROTOCOL §11）。
  # ═══════════════════════════════════════════════════════════════════════════════════
  attest:
    name: e2e 凭证（三平台全绿才发）
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ★ --undecided（Manager 2026-08-11 裁决，import 腿）
      #
      # runtime/browser 两条腿是**三态**（PASS/FAIL/UNKNOWN），"前提在这台 runner 上
      # 构造不出来"有专门的第三态承接，所以要真的跨平台数、跨平台求和
      # （见 sum-undecided.mjs）。import 腿不是同一个形状 —— 它对**判决**来说是
      # **二态**（`ok: true/false` 驱动 `exitCode`）。
      #
      # `e2e-import-audit.mjs` 的总表里确实会出现 `ok: null`（第 13 节渲染成
      # "⊘ 跳过"），而且不止 `--skip-f1` 一处——F2/F2b 在样本没造出来时也会补一条
      # `ok: null` 的行（2026-08-11 补的，见该文件 §9/§10 附近注释：以前这种情况
      # 是总表里那一行凭空消失，不留痕迹，比 undecided 更难查）。但这些 `null`
      # **只用于把总表填完整，从不影响判决**：F2/F2b 会补 null 行，前提必然是
      # 第 7 节的"样本没造出来"已经 `fail()` 判过一次红——判决已经定了，这里不会
      # 再重复 `fail()`。
      #
      # 这不是"这条腿没有 undecided 概念"，是**它主动把 undecided 换成了 FAIL**：
      # `e2e-import-audit.mjs` 里"环境没准备好"（比如 fixture 主机名没指向回环，
      # 或者样本没造出来）曾经也报成 `ok: null` 然后照常 `exit 0`，后来被改掉——
      # PROTOCOL §11：「跳过不许渲染成成功」，现在当场判 `fail()`。一条判 fail 的腿，
      # `needs: [e2e]` 会让这个 attest job **直接不跑**，凭证根本不会发出来——不存在
      # "三平台都绿、但暗地里有几条没验到"这种状态留给 undecided 去描述。
      #
      # 所以上面说的"F2/F2b 补的 `ok: null` 行"和这里的 `--undecided 0` 不矛盾：
      # 那些行只会出现在一次已经判红、attest job 根本不会跑的运行里——凭证只在
      # run 绿的时候产出，而 run 绿意味着所有样本都造出来了，F2/F2b 不存在没跑到
      # 的子用例。**标准门禁跑法下**（`skipF1=false`，release-upload.yml 的
      # e2e-gate 用的就是这条默认路径）这个数**结构上恒为 0**：不是"没查"，是
      # "这条腿设计上不产生未决"。⚠️ 如果哪天想把"总表里有 null 行"当成
      # `--undecided` 该跟着变的信号，先想清楚：那是红跑才会出现的东西，
      # 而这个数只在绿跑里发出去，两者压根不会在同一次运行里同时存在。
      #
      # 唯一真实的例外是人为诊断跑法：`--skip-f1`（"只在排查 F2 时用"，输入自己的
      # 说明写着）。那种情况下 F1 是真的一条都没验，如实报 1，不假装成 0——
      # 留 0 会把"我们知道答案是 0"变成"我们选择不说"，两者不是一回事。
      - name: 写凭证
        id: attest
        run: |
          node scripts/ci/emit-e2e-attestation.mjs \
            --leg import \
            --bundle-run "${{ needs.e2e.outputs.bundle_run_id }}" \
            --platforms linux-x64,darwin-arm64,win32-x64 \
            --undecided ${{ inputs.skipF1 && '1' || '0' }} \
            --out dist/e2e-attest.json

      - uses: actions/upload-artifact@v6
        with:
          name: e2e-attest-import-${{ needs.e2e.outputs.bundle_run_id }}
          path: dist/e2e-attest.json
          if-no-files-found: error
